  # =============================================================================
  # Image verb integration tests
  # =============================================================================

  - name: "html - image dimension workflow"
    description: "Read dimensions and use in page table"
    skip: "Need sample image fixtures"
    script: |
      local(testDir = "{FRONTIER_TEST_TMP_DIR}");
      local(gifPath = testDir + "/sample_100x50.gif");
      local(jpegPath = testDir + "/sample_200x200.jpg");

      local(gifDims = html.getgifheightwidth(gifPath));
      local(jpegDims = html.getjpegheightwidth(jpegPath));

      # Verify both work correctly
      local(gifOK = (gifDims[1] == 50) and (gifDims[2] == 100));
      local(jpegOK = (jpegDims[1] == 200) and (jpegDims[2] == 200));

      return gifOK and jpegOK
    expected_result: "true"

  - name: "html - generate image tag with dimensions"
    description: "Use image dimensions to generate complete img tags"
    skip: "Need sample image fixtures"
    script: |
      local(testDir = "{FRONTIER_TEST_TMP_DIR}");
      local(imagePath = testDir + "/sample_100x50.gif");
      local(dimensions = html.getgifheightwidth(imagePath));

      local(imgTag = "<img src=\"sample.gif\"");
      imgTag = imgTag + " width=\"" + dimensions[2] + "\"";
      imgTag = imgTag + " height=\"" + dimensions[1] + "\">";

      return string.contains(imgTag, "width=\"100\"") and string.contains(imgTag, "height=\"50\"")
    expected_result: "true"
