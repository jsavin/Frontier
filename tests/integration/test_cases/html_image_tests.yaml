# Integration tests for Phase 2 HTML verbs - Image Analysis
# Tests the 2 image dimension reading verbs for GIF and JPEG files
#
# Phase 2 Image verbs covered (2 verbs):
#   - html.getgifheightwidth - Read GIF dimensions
#   - html.getjpegheightwidth - Read JPEG dimensions
#
# Reference: planning/phase3/html_verbs_implementation_plan.md
# C Implementation: Common/source/langhtml.c (getgifheightwidthverb, getjpegheightwidthverb)
# Documentation: docs/usertalk/docserver/html/

tests:
  # =============================================================================
  # html.getgifheightwidth - Read GIF dimensions
  # =============================================================================

  - name: "html.getgifheightwidth - basic GIF file"
    description: "Read dimensions from valid GIF file"
    skip: "Need sample GIF test fixture"
    script: |
      local(testDir = "{FRONTIER_TEST_TMP_DIR}");
      local(gifPath = testDir + "/sample_100x50.gif");
      local(dimensions = html.getgifheightwidth(gifPath));
      return (dimensions[1] == 50) and (dimensions[2] == 100)
    expected_result: "true"

  - name: "html.getgifheightwidth - square GIF"
    description: "Read dimensions from square GIF file"
    skip: "Need sample GIF test fixture"
