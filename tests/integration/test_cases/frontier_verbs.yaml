# Integration tests for frontier.* verbs
# Tests CLI-specific functionality available in headless mode
#
# Verbs tested:
#   - frontier.getProgramPath() - Returns path to CLI executable
#   - frontier.getFilePath() - Returns path to loaded database
#   - frontier.version() - Returns version string
#   - frontier.enableAgents() - No-op in headless (returns true)
#   - frontier.isValidSerialNumber() - Always returns true in headless
#   - frontier.isPowerPC() - Returns true (suppresses legacy 68k workarounds)
#   - frontier.isRuntime() - Returns false (CLI is not runtime-only)
#   - frontier.countThreads() - Returns active thread count
#   - frontier.reclaimMemory() - No-op, returns true

tests:
  # frontier.getProgramPath tests
  - name: "frontier.getProgramPath - returns string"
    description: "getProgramPath should return a string value"
    script: |
      local (path = frontier.getProgramPath());
      return typeof(path) == 'TEXT'
    expected_success: true
    expected_result: "true"

  - name: "frontier.getProgramPath - contains frontier-cli"
    description: "Path should contain the CLI executable name"
    script: |
      local (path = frontier.getProgramPath());
      return path contains "frontier-cli"
    expected_success: true
    expected_result: "true"

  - name: "frontier.getProgramPath - is absolute path"
    description: "Path should be absolute (starts with /)"
    script: |
      local (path = frontier.getProgramPath());
      return path[1] == '/'
    expected_success: true
    expected_result: "true"

  # frontier.getFilePath tests
  - name: "frontier.getFilePath - returns string"
    description: "getFilePath should return a string value"
    script: |
      local (path = frontier.getFilePath());
      return typeof(path) == 'TEXT'
    expected_success: true
    expected_result: "true"

  - name: "frontier.getFilePath - is absolute path"
    description: "Path should be absolute (starts with /)"
    script: |
      local (path = frontier.getFilePath());
      return path[1] == '/'
    expected_success: true
    expected_result: "true"

  - name: "frontier.getFilePath - contains root extension"
    description: "Path should contain .root extension"
    script: |
      local (path = frontier.getFilePath());
      return path contains ".root"
    expected_success: true
    expected_result: "true"

  # frontier.version tests
  - name: "frontier.version - returns string"
    description: "version should return a string value"
    script: |
      local (v = frontier.version());
      return typeof(v) == 'TEXT'
    expected_success: true
    expected_result: "true"

  - name: "frontier.version - returns 11.x product version"
    description: "Headless mode returns product version derived from git tag (CLI major + 10)"
    script: |
      local (v = frontier.version());
      return v beginsWith "11."
    expected_success: true
    expected_result: "true"

  - name: "frontier.version - satisfies legacy version checks"
    description: "Product version should be greater than legacy 7.x and 10.x versions"
    script: |
      return not date.versionLessThan(frontier.version(), "10.0")
    expected_success: true
    expected_result: "true"

  # frontier.cliVersion tests
  - name: "frontier.cliVersion - returns string"
    description: "cliVersion should return a string value"
    script: |
      local (v = frontier.cliVersion());
      return typeof(v) == 'TEXT'
    expected_success: true
    expected_result: "true"

  - name: "frontier.cliVersion - returns CLI version"
    description: "cliVersion should return the git-derived CLI version"
    script: |
      local (v = frontier.cliVersion());
      return sizeOf(v) > 0
    expected_success: true
    expected_result: "true"

  # frontier.enableAgents tests (no-op in headless)
  - name: "frontier.enableAgents - returns true"
    description: "enableAgents is a no-op in headless mode, returns true"
    script: |
      return frontier.enableAgents(true)
    expected_success: true
    expected_result: "true"

  - name: "frontier.enableAgents - accepts false"
    description: "enableAgents accepts false parameter"
    script: |
      return frontier.enableAgents(false)
    expected_success: true
    expected_result: "true"

  # frontier.isValidSerialNumber tests
  - name: "frontier.isValidSerialNumber - always true in headless"
    description: "Serial number validation always returns true in CLI mode"
    script: |
      return frontier.isValidSerialNumber("anything")
    expected_success: true
    expected_result: "true"

  - name: "frontier.isValidSerialNumber - empty string"
    description: "Empty serial number still returns true in headless"
    script: |
      return frontier.isValidSerialNumber("")
    expected_success: true
    expected_result: "true"

  # ==========================================================================
  # frontier.isPowerPC tests
  # ==========================================================================
  # Returns true in headless mode to suppress legacy 68k Mac workarounds.
  # Historical context: In 2000-era Frontier, "not isPowerPC" meant 68k Mac
  # which needed extra listener sockets because its TCP stack couldn't handle
  # concurrent connections. inetd.startOne() calls tcp.listenStream's UserTalk
  # wrapper which checks isPowerPC() — returning true prevents the wrapper from
  # creating duplicate listeners on the same port.

  - name: "frontier.isPowerPC - returns boolean"
    description: "isPowerPC must return a boolean value"
    script: 'typeOf(Frontier.isPowerPC()) == "bool"'
    expected_success: true
    expected_result: "true"

  - name: "frontier.isPowerPC - returns true in headless mode"
    description: |
      Returns true to suppress legacy 68k Mac TCP workarounds.
      Modern systems don't need extra listener sockets.
    script: "Frontier.isPowerPC()"
    expected_success: true
    expected_result: "true"

  # ==========================================================================
  # frontier.isRuntime tests
  # ==========================================================================
  # Returns false — headless CLI is a full development environment.

  - name: "frontier.isRuntime - returns boolean"
    description: "isRuntime must return a boolean value"
    script: 'typeOf(Frontier.isRuntime()) == "bool"'
    expected_success: true
    expected_result: "true"

  - name: "frontier.isRuntime - returns false for CLI"
    description: |
      Headless CLI is not a runtime-only build — it has full
      development capabilities (REPL, script editing, etc.).
    script: "Frontier.isRuntime()"
    expected_success: true
    expected_result: "false"

  # ==========================================================================
  # frontier.countThreads tests
  # ==========================================================================
  # Returns the number of active threads (at least 1).

  - name: "frontier.countThreads - returns a number"
    description: "countThreads must return a numeric value"
    script: 'typeOf(Frontier.countThreads()) == "long"'
    expected_success: true
    expected_result: "true"

  - name: "frontier.countThreads - at least 1"
    description: "There is always at least one thread (the main/REPL thread)"
    script: "Frontier.countThreads() >= 1"
    expected_success: true
    expected_result: "true"

  # ==========================================================================
  # frontier.reclaimMemory tests
  # ==========================================================================
  # No-op on modern systems — returns true.

  - name: "frontier.reclaimMemory - returns boolean"
    description: "reclaimMemory must return a boolean value"
    script: 'typeOf(Frontier.reclaimMemory()) == "bool"'
    expected_success: true
    expected_result: "true"

  - name: "frontier.reclaimMemory - succeeds"
    description: |
      reclaimMemory is a no-op on modern systems where the OS handles
      memory management. Returns true to indicate success.
    script: "Frontier.reclaimMemory()"
    expected_success: true
    expected_result: "true"
