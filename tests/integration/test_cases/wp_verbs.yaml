tests:
  - name: "wp.setText - defined in headless mode"
    description: "Verify wp.setText verb is registered and resolvable"
    script: 'defined(wp.setText)'
    expected_success: true
    expected_result: "true"

  - name: "wp.getText - defined in headless mode"
    description: "Verify wp.getText verb is registered and resolvable"
    script: 'defined(wp.getText)'
    expected_success: true
    expected_result: "true"

  - name: "wp.intextmode - returns false in headless"
    description: "No text editing mode in headless, should return false"
    script: 'wp.intextmode()'
    expected_success: true
    expected_result: "false"

  - name: "wp.getselect/setselect - selection state roundtrip"
    description: |
      Verify that wp.setselect persists selection state and wp.getselect
      retrieves it. Selection state is thread-local via GIL.
    script: |
      wp.setselect(10, 20);
      local(s, e);
      wp.getselect(@s, @e);
      return((s == 10) and (e == 20))
    expected_success: true
    expected_result: "true"

  - name: "wp.getselect - different values"
    description: "Verify selection state updates correctly with different values"
    script: |
      wp.setselect(100, 200);
      local(s, e);
      wp.getselect(@s, @e);
      return(s + e)
    expected_success: true
    expected_result: "300"

  - name: "wp.getText - returns text from targeted WPText object"
    description: "Create a WPText object, set text, and verify getText returns the text"
    script: |
      new(wpTextType, @system.temp.wpGetTextTest);
      target.set(@system.temp.wpGetTextTest);
      wp.setText("hello from getText test");
      local(t = wp.getText());
      return(sizeOf(t) > 0)
    expected_success: true
    expected_result: "true"

  - name: "wp.getText equivalence with string()"
    description: "wp.getText() should produce the same result as string() coercion on the target"
    script: |
      new(wpTextType, @system.temp.wpEquivTest);
      target.set(@system.temp.wpEquivTest);
      wp.setText("equivalence test content");
      return(wp.getText() == string(system.temp.wpEquivTest))
    expected_success: true
    expected_result: "true"

  - name: "wp.setText/getText roundtrip"
    description: "Set text on a WPText object, then get it back and verify match"
    script: |
      new(wpTextType, @system.temp.wpRoundtripTest);
      target.set(@system.temp.wpRoundtripTest);
      wp.setText("hello world");
      return(wp.getText() == "hello world")
    expected_success: true
    expected_result: "true"

  - name: "wp.getText - no target generates script error"
    description: "Calling wp.getText with no target set should fail with an error"
    script: 'wp.getText()'
    expected_success: false

  - name: "wp.getText - non-WP target generates script error"
    description: "Targeting a table (not a WPText object) should produce an error"
    script: |
      target.set(@examples);
      wp.getText()
    expected_success: false

  - name: "wp.setText - accepts text parameter"
    description: "wp.setText should accept a string parameter when target is a WPText object"
    script: |
      new(wpTextType, @system.temp.wpSetTextTest);
      target.set(@system.temp.wpSetTextTest);
      wp.setText("hello world")
    expected_success: true
    expected_result: "true"

  - name: "wp.getDisplay - returns false in headless"
    description: "No display in headless mode"
    script: 'wp.getDisplay()'
    expected_success: true
    expected_result: "false"

  - name: "wp.getRuler - returns false in headless"
    description: "No ruler in headless mode"
    script: 'wp.getRuler()'
    expected_success: true
    expected_result: "false"

  - name: "wp.rulerLength - returns 0 in headless"
    description: "No ruler length in headless mode"
    script: 'wp.rulerLength()'
    expected_success: true
    expected_result: "0"

  - name: "wp.getIndent - returns 0 in headless"
    description: "No indent in headless mode"
    script: 'wp.getIndent()'
    expected_success: true
    expected_result: "0"

  - name: "wp.setselect - negative values accepted"
    description: "Negative selection values should be stored without error"
    script: |
      wp.setselect(-1, -1);
      local(s, e);
      wp.getselect(@s, @e);
      return((s == -1) and (e == -1))
    expected_success: true
    expected_result: "true"

  - name: "wp.setselect - end less than start"
    description: "Selection where end < start should be stored as-is"
    script: |
      wp.setselect(50, 10);
      local(s, e);
      wp.getselect(@s, @e);
      return((s == 50) and (e == 10))
    expected_success: true
    expected_result: "true"

  - name: "wp.setselect - zero values"
    description: "Zero selection values roundtrip correctly"
    script: |
      wp.setselect(0, 0);
      local(s, e);
      wp.getselect(@s, @e);
      return((s == 0) and (e == 0))
    expected_success: true
    expected_result: "true"
