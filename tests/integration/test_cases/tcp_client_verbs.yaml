        return "false"
      }
    expected_success: true
    expected_result: "true"
    notes: "Migrated from example.com IP - uses localhost"

  - name: "tcp.openStream - localhost connection"
    description: "Connect to localhost using 127.0.0.1 encoded address"
    script: |
