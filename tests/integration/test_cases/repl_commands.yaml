# REPL Phase 1 Command Tests
#
# Tests for REPL special commands:
# - /help - Show available commands
# - /exit - Exit REPL
#
# QUICKSCRIPT MODEL (2026-01-15): /vars and /clear commands removed
# - QuickScript model doesn't use workspace (each evaluation runs in clean thread)
# - Tests for /vars and /clear marked as skip=true (not applicable)
# - Persistence via explicit database paths: system.temp.x, workspace.x
# - See ADR-009 and docs/CLI_USAGE_GUIDE.md for QuickScript model documentation
#
# These tests require REPL interactive mode with stdin simulation.
# Reference: planning/phase4/REPL_INTERACTIVE_MODE_DESIGN.md (Phase 1)
#
# Test Pattern: Similar to dialog_verbs.yaml, using stdin_input to simulate
# user commands typed at REPL prompt.

tests:
  # =========================================================================
  # /help Command
  # =========================================================================

  - name: "REPL /help - displays available commands"
    description: "/help should list all available commands"
    repl_mode: true
    stdin_input: "/help\n/exit\n"
    expected_output_contains:
      - "/exit"
      - "/help"
      - "/jump"
      - "/list"
      - "/keycodes"
      - "Available commands"
    expected_success: true

  - name: "REPL /help - shows QuickScript model"
    description: "/help should explain QuickScript variable persistence"
    repl_mode: true
    stdin_input: "/help\n/exit\n"
    expected_output_contains:
      - "QuickScript"
      - "workspace"
      - "system.temp"
    expected_success: true

  - name: "REPL /help - shows multi-line usage"
    description: "/help should mention multi-line (Phase 2 feature)"
    repl_mode: true
    stdin_input: "/help\n/exit\n"
    expected_output_contains:
      - "Multi-line"
      - "Phase 2"
    expected_success: true

  # =========================================================================
  # /exit Command
  # =========================================================================

  - name: "REPL /exit - exits cleanly"
    description: "/exit should terminate REPL without error"
    repl_mode: true
    stdin_input: "/exit\n"
    expected_output_contains:
      - "Goodbye"  # or similar exit message
    expected_success: true

  - name: "REPL /exit - ignores subsequent input"
    description: "/exit should terminate immediately"
    repl_mode: true
    stdin_input: "/exit\nx = 42\n"
    expected_output_not_contains:
      - "42"  # Should exit before evaluating second line
    expected_success: true

  # =========================================================================
  # /list Command
  # =========================================================================

  - name: "REPL /list - lists current table (root)"
    description: "/list with no argument lists the current table"
    repl_mode: true
    stdin_input: "/list\n/exit\n"
    expected_output_contains:
      - "root:"
      - "system"
      - "user"
    expected_success: true

  - name: "REPL /list - shows table type"
    description: "/list should show 'table' type for sub-tables"
    repl_mode: true
    stdin_input: "/list\n/exit\n"
    expected_output_contains:
      - "table"
    expected_success: true

  - name: "REPL /list - with dot-path argument"
    description: "/list should accept dot-path to list specific table"
    repl_mode: true
    stdin_input: "/list system\n/exit\n"
    expected_output_contains:
      - "system:"
      - "verbs"
    expected_success: true

  - name: "REPL /list - with nested dot-path"
    description: "/list should accept nested dot-paths"
    repl_mode: true
    stdin_input: "/list system.verbs\n/exit\n"
    expected_output_contains:
      - "system.verbs:"
      - "builtins"
    expected_success: true

  - name: "REPL /list - with system.paths name"
    description: "/list should resolve names via system.paths"
    repl_mode: true
    stdin_input: "/list fileMenu\n/exit\n"
    expected_output_contains:
      - "system.verbs.builtins.fileMenu:"
    expected_success: true

  - name: "REPL /list - with script expression"
    description: "/list should evaluate script expressions like parentOf()"
    repl_mode: true
    stdin_input: "/list parentOf(fileMenu)\n/exit\n"
    expected_output_contains:
      - "system.verbs.builtins:"
    expected_success: true

  - name: "REPL /list - with address expression"
    description: "/list should work with @ address expressions"
    repl_mode: true
    stdin_input: "/list parentOf(@user.inetd)\n/exit\n"
    expected_output_contains:
      - "user:"
    expected_success: true

  - name: "REPL /list - shows scalar values inline"
    description: "/list should display scalar values (numbers, strings) inline"
    repl_mode: true
    stdin_input: "/list user.prefs\n/exit\n"
    expected_output_contains:
      - "user.prefs:"
    expected_success: true

  - name: "REPL /list - invalid path shows error"
    description: "/list with invalid path should show error message"
    repl_mode: true
    stdin_input: "/list nonexistent.path\n/exit\n"
    expected_output_contains:
      - "Error"
      - "not a valid table path"
    expected_success: true

  - name: "REPL /list - empty path argument lists current"
    description: "/list with just whitespace lists current table"
    repl_mode: true
    stdin_input: "/list   \n/exit\n"
    expected_output_contains:
      - "root:"
    expected_success: true

  # =========================================================================
  # /jump Command
  # =========================================================================

  - name: "REPL /jump - to root (no argument)"
    description: "/jump with no argument returns to root"
    repl_mode: true
    stdin_input: "/jump system\n/jump\n/exit\n"
    expected_output_contains:
      - "[root]>"
    expected_success: true

  - name: "REPL /jump - changes prompt"
    description: "/jump should change the prompt to show current location"
    repl_mode: true
    stdin_input: "/jump system\n/exit\n"
    expected_output_contains:
      - "[system]>"
    expected_success: true

  - name: "REPL /jump - to nested table"
    description: "/jump should navigate to nested tables"
    repl_mode: true
    stdin_input: "/jump system.verbs\n/exit\n"
    expected_output_contains:
      - "[system.verbs]>"
    expected_success: true

  - name: "REPL /jump - parent with .."
    description: "/jump .. should go to parent table"
    repl_mode: true
    stdin_input: "/jump system.verbs\n/jump ..\n/exit\n"
    expected_output_contains:
      - "[system]>"
    expected_success: true

  - name: "REPL /jump - via system.paths"
    description: "/jump should resolve names via system.paths"
    repl_mode: true
    stdin_input: "/jump fileMenu\n/exit\n"
    expected_output_contains:
      - "[system.verbs.builtins.fileMenu]>"
    expected_success: true

  - name: "REPL /jump - with script expression"
    description: "/jump should evaluate script expressions"
    repl_mode: true
    stdin_input: "/jump parentOf(fileMenu)\n/exit\n"
    expected_output_contains:
      - "[system.verbs.builtins]>"
    expected_success: true

  - name: "REPL /jump - with address expression"
    description: "/jump should work with @ address expressions"
    repl_mode: true
    stdin_input: "/jump parentOf(@user.inetd)\n/exit\n"
    expected_output_contains:
      - "[user]>"
    expected_success: true

  - name: "REPL /jump - invalid path shows error"
    description: "/jump with invalid path should show error"
    repl_mode: true
    stdin_input: "/jump nonexistent.path\n/exit\n"
    expected_output_contains:
      - "Error"
      - "not a valid table path"
    expected_success: true

  - name: "REPL /jump - doesn't change on error"
    description: "/jump to invalid path shouldn't change current table"
    repl_mode: true
    stdin_input: "/jump system\n/jump nonexistent\n/exit\n"
    expected_output_contains:
      - "[system]>"
      - "Error"
    expected_success: true

  - name: "REPL /jump - then /list shows jumped table"
    description: "/list after /jump should show the jumped-to table"
    repl_mode: true
    stdin_input: "/jump system\n/list\n/exit\n"
    expected_output_contains:
      - "system:"
      - "verbs"
    expected_success: true

  # =========================================================================
  # /help Command - Documents All Commands
  # =========================================================================

  - name: "REPL /help - documents /jump command"
    description: "/help should explain /jump command with examples"
    repl_mode: true
    stdin_input: "/help\n/exit\n"
    expected_output_contains:
      - "/jump"
      - "Navigate"
      - "system.paths"
      - "parentOf"
    expected_success: true

  - name: "REPL /help - documents /list command"
    description: "/help should explain /list command with examples"
    repl_mode: true
    stdin_input: "/help\n/exit\n"
    expected_output_contains:
      - "/list"
      - "List"
      - "system.paths"
      - "parentOf"
    expected_success: true

  - name: "REPL /help - documents /keycodes command"
    description: "/help should explain /keycodes command"
    repl_mode: true
    stdin_input: "/help\n/exit\n"
    expected_output_contains:
      - "/keycodes"
    expected_success: true

  # =========================================================================
  # Command Error Handling
  # =========================================================================

  - name: "REPL - unknown command"
    description: "Unknown commands should show error and continue"
    repl_mode: true
    stdin_input: "/unknown\n/exit\n"
    expected_output_contains:
      - "Unknown command"
      - "/help"
    expected_success: true

  - name: "REPL - command case insensitivity"
    description: |
      As of PR 7 (slash-menu migration) commands resolve via the menubar
      with case-insensitive label match, so /EXIT routes to the same Exit
      leaf as /exit. The legacy case-sensitive behavior was a side effect
      of strcmp() in the old hardcoded dispatcher.
    repl_mode: true
    stdin_input: "/EXIT\n"
    expected_output_contains:
      - "Goodbye"
    expected_output_not_contains:
      - "Unknown command"
    expected_success: true

  # =========================================================================
  # Menubar resolver behavior (PR 7) - prefix and hotkey matching
  # =========================================================================
  # The slash-command resolver matches the user's token against the
  # installed REPL menubar (system.menus.data.repl.REPL) using a three-tier
  # precedence: exact label, unique prefix, single-letter first-letter.
  # These tests exercise each tier end-to-end through the dispatch path.

  - name: "REPL - unique prefix match (/exi -> Exit)"
    description: |
      The resolver routes a unique prefix to its only matching leaf.
      "exi" is a strict prefix of only the "Exit" label, so /exi should
      exit cleanly with Goodbye.
    repl_mode: true
    stdin_input: "/exi\n"
    expected_output_contains:
      - "Goodbye"
    expected_output_not_contains:
      - "Unknown command"
    expected_success: true

  - name: "REPL - first-letter hotkey match (/h -> Help)"
    description: |
      Single-letter token matches the first letter of a label when no
      other label starts with the same letter. /h is unique to "Help"
      so it dispatches the help text.
    repl_mode: true
    stdin_input: "/h\n/exit\n"
    expected_output_contains:
      - "Available commands"
      - "/help"
    expected_success: true

  - name: "REPL - first-letter hotkey match (/e -> Exit)"
    description: |
      /e routes to "Exit" because no other REPL menu label starts with
      E. Belt-and-braces companion to /h - they share the same matching
      tier but exercise different leaves.
    repl_mode: true
    stdin_input: "/e\n"
    expected_output_contains:
      - "Goodbye"
    expected_output_not_contains:
      - "Unknown command"
    expected_success: true

  - name: "REPL - whitespace-collapsed label match (/keycodes)"
    description: |
      The "Key codes" label resolves under the token "keycodes" (spaces
      collapsed) so the legacy /keycodes shorthand still works post-PR 7.
      The keycodes handler enters linenoise's key-code debug mode, which
      requires an interactive TTY - in plain REPL mode it returns false
      without printing a key dump. Assert the menubar dispatch reached
      the handler (no Unknown command error) rather than the dump output.
    repl_mode: true
    stdin_input: "/keycodes\n/exit\n"
    expected_output_not_contains:
      - "Unknown command"
    expected_success: true

  - name: "REPL - unknown command preserves full body in error"
    description: |
      A line that begins with / but doesn't resolve must echo the FULL
      input (including any whitespace+args) in the diagnostic, not just
      the first whitespace-delimited word. This is the legacy behavior
      preserved post-PR 7 so users (and integration tests) see what they
      typed.
    repl_mode: true
    stdin_input: "/foo bar baz\n/exit\n"
    expected_output_contains:
      - "Unknown command: /foo bar baz"
    expected_success: true

  - name: "REPL - /jump with bad path emits Error message"
    description: |
      /jump <invalid> routes through the kernel-verb host adapter
      (replverbhost_jump_path) which returns false on an unresolvable
      path. The dispatcher prints the legacy-format error so existing
      integration tests for /jump - invalid path keep passing.
    repl_mode: true
    stdin_input: "/jump nonexistent.path\n/exit\n"
    expected_output_contains:
      - "Error"
      - "not a valid table path"
    expected_success: true

  - name: "REPL - leading slash required"
    description: "Commands without leading slash are treated as code"
    repl_mode: true
    stdin_input: "help\n/exit\n"
    expected_output_contains:
      - "Can't evaluate"  # 'help' treated as variable
      - "hasn't been defined"
    expected_success: true

  - name: "REPL - command with trailing whitespace"
    description: "Commands should work with trailing spaces"
    repl_mode: true
    stdin_input: "/help   \n/exit\n"
    expected_output_contains:
      - "Available commands"
    expected_success: true

  # =========================================================================
  # Command Integration with Evaluation
  # =========================================================================

  - name: "REPL - error doesn't affect commands"
    description: "Runtime errors shouldn't break command execution"
    repl_mode: true
    stdin_input: |
      1 / 0
      /help
      /exit
    expected_output_contains:
      - "divide by zero"
      - "Available commands"
    expected_success: true

  # =========================================================================
  # Welcome and Prompt Messages
  # =========================================================================

  - name: "REPL - welcome message"
    description: "REPL should show welcome message on startup"
    repl_mode: true
    stdin_input: "/exit\n"
    expected_output_contains:
      - "Frontier REPL"
      - "Interactive"
    expected_success: true

  - name: "REPL - prompt displays"
    description: "REPL should show prompt before each input"
    repl_mode: true
    stdin_input: "/exit\n"
    expected_output_contains:
      - "[root]>"  # or "[workspace]>" depending on implementation
    expected_success: true

  - name: "REPL - goodbye message"
    description: "REPL should show goodbye message on exit"
    repl_mode: true
    stdin_input: "/exit\n"
    expected_output_contains:
      - "Goodbye"
    expected_success: true

  # =========================================================================
  # Empty Input Handling
  # =========================================================================

  - name: "REPL - empty line ignored"
    description: "Empty input should show next prompt"
    repl_mode: true
    stdin_input: "\n\n/exit\n"
    expected_output_contains:
      - "[root]>"
    expected_success: true

  - name: "REPL - whitespace-only line ignored"
    description: "Whitespace-only input should be ignored"
    repl_mode: true
    stdin_input: "   \n\t\n/exit\n"
    expected_success: true

  # =========================================================================
  # EOF (Ctrl-D) Handling
  # =========================================================================

  - name: "REPL - EOF exits cleanly"
    description: "Ctrl-D (EOF) should exit REPL"
    repl_mode: true
    stdin_input: ""  # Empty stdin simulates EOF
    expected_output_contains:
      - "Goodbye"  # Should exit gracefully
    expected_success: true

  - name: "REPL - EOF after expressions"
    description: "EOF should exit after evaluating expressions"
    repl_mode: true
    stdin_input: "workspace.x = 42\n"  # No /exit, just EOF
    expected_success: true

  # =========================================================================
  # Command Help Text Validation
  # =========================================================================

  - name: "REPL /help - documents /exit"
    description: "/help should explain /exit command"
    repl_mode: true
    stdin_input: "/help\n/exit\n"
    expected_output_contains:
      - "/exit"
      - "Exit"
    expected_success: true

  # =========================================================================
  # /list - Index Syntax [n] (1-based)
  # =========================================================================

  - name: "REPL /list - with index syntax on table"
    description: "/list with [n] should show the nth item (1-based)"
    repl_mode: true
    stdin_input: "/list system[1]\n/exit\n"
    expected_output_contains:
      - ":"
    expected_output_not_contains:
      - "Error"
    expected_success: true

  - name: "REPL /list - index zero error"
    description: "/list with [0] should error (1-based indexing)"
    repl_mode: true
    stdin_input: "/list system[0]\n/exit\n"
    expected_output_contains:
      - "Error"
      - "index must be >= 1"
    expected_success: true

  - name: "REPL /list - index out of range error"
    description: "/list with index beyond table size should error"
    repl_mode: true
    stdin_input: "/list system[999]\n/exit\n"
    expected_output_contains:
      - "Error"
      - "out of range"
    expected_success: true

  - name: "REPL /list - index syntax with dot-path"
    description: "/list with dot-path and [n] index"
    repl_mode: true
    stdin_input: "/list system.verbs[1]\n/exit\n"
    expected_output_contains:
      - ":"
    expected_output_not_contains:
      - "Error"
    expected_success: true

  - name: "REPL /list - invalid index syntax"
    description: "/list with malformed index should error"
    repl_mode: true
    stdin_input: "/list system[abc]\n/exit\n"
    expected_output_contains:
      - "Error"
      - "invalid index syntax"
    expected_success: true

  - name: "REPL /list - trailing chars after bracket rejected"
    description: "/list system[1]foo should error, not silently ignore trailing text"
    repl_mode: true
    stdin_input: "/list system[1]foo\n/exit\n"
    expected_output_contains:
      - "Error"
      - "invalid index syntax"
      - "unexpected characters after"
    expected_success: true

  - name: "REPL /list - bare index into current table"
    description: "/list [1] should index directly into root table"
    repl_mode: true
    stdin_input: "/list [1]\n/exit\n"
    expected_output_not_contains:
      - "Error"
    expected_success: true

  - name: "REPL /list - negative index error"
    description: "/list system[-1] should error with clear message"
    repl_mode: true
    stdin_input: "/list system[-1]\n/exit\n"
    expected_output_contains:
      - "Error"
      - "index must be >= 1"
    expected_success: true

  - name: "REPL /list - double bracket rejected"
    description: "/list system[[1]] should error on invalid syntax"
    repl_mode: true
    stdin_input: "/list system[[1]]\n/exit\n"
    expected_output_contains:
      - "Error"
    expected_success: true

  - name: "REPL /list - consecutive indices rejected"
    description: "/list system[1][2] should error on trailing chars after bracket"
    repl_mode: true
    stdin_input: "/list system[1][2]\n/exit\n"
    expected_output_contains:
      - "Error"
      - "unexpected characters after"
    expected_success: true

  - name: "REPL /list - index on nonexistent intermediate"
    description: "/list nonexistent[1] should error on unknown table name"
    repl_mode: true
    stdin_input: "/list nonexistent[1]\n/exit\n"
    expected_output_contains:
      - "Error"
      - "not a valid table path"
    expected_success: true

  - name: "REPL /list - index on scalar (not a table)"
    description: "/list with index on a non-table value should error"
    repl_mode: true
    stdin_input: "/list system.verbs.colors.blue[1]\n/exit\n"
    expected_output_contains:
      - "Error"
      - "not a table"
    expected_success: true

  - name: "REPL /list - bare index after /jump"
    description: "/list [n] with no name should index into current table"
    repl_mode: true
    stdin_input: "/jump system\n/list [1]\n/exit\n"
    expected_output_contains:
      - "system."
    expected_success: true

  # =========================================================================
  # /list - Relative Paths (after /jump)
  # =========================================================================

  - name: "REPL /list - relative path after /jump"
    description: "/list with relative path should resolve from current table"
    repl_mode: true
    stdin_input: "/jump system\n/list verbs\n/exit\n"
    expected_output_contains:
      - "system.verbs:"
      - "builtins"
    expected_success: true

  - name: "REPL /list - relative single name after /jump"
    description: "/list single name resolves relative to jumped table"
    repl_mode: true
    stdin_input: "/jump system.verbs\n/list builtins\n/exit\n"
    expected_output_contains:
      - "system.verbs.builtins:"
    expected_success: true

  # =========================================================================
  # /jump - Index Syntax [n] (1-based)
  # =========================================================================

  - name: "REPL /jump - with index syntax"
    description: "/jump with [n] should navigate to the nth item if it's a table"
    repl_mode: true
    stdin_input: "/jump system[1]\n/exit\n"
    expected_output_contains:
      - "[system."
    expected_success: true

  - name: "REPL /jump - index zero error"
    description: "/jump with [0] should error (1-based indexing)"
    repl_mode: true
    stdin_input: "/jump system[0]\n/exit\n"
    expected_output_contains:
      - "Error"
      - "index must be >= 1"
    expected_success: true

  - name: "REPL /jump - index out of range"
    description: "/jump with index beyond table size should error"
    repl_mode: true
    stdin_input: "/jump system[999]\n/exit\n"
    expected_output_contains:
      - "Error"
      - "out of range"
    expected_success: true

  # =========================================================================
  # /help - Documents New Syntax
  # =========================================================================

  - name: "REPL /help - documents index syntax"
    description: "/help should mention index [n] syntax"
    repl_mode: true
    stdin_input: "/help\n/exit\n"
    expected_output_contains:
      - "[1]"
      - "1-based"
    expected_success: true

  - name: "REPL /help - documents relative paths"
    description: "/help should mention relative path support"
    repl_mode: true
    stdin_input: "/help\n/exit\n"
    expected_output_contains:
      - "Relative"
    expected_success: true

  # =========================================================================
  # /list and /jump - Guest Database (filewindowtable) Resolution
  # =========================================================================

  - name: "REPL /list - resolves guest database table name"
    description: "/list should find table names inside open guest databases via filewindowtable search"
    skip: true
    skip_reason: "Requires fileMenu.open which needs startup scripts; --skip-startup mode cannot open guest databases. Verified manually."
    repl_mode: true
    stdin_input: "db.new(\"{FRONTIER_TEST_TMP_DIR}/repl_guest_list.root\")\nfileMenu.open(\"{FRONTIER_TEST_TMP_DIR}/repl_guest_list.root\")\ndb.newtable(\"{FRONTIER_TEST_TMP_DIR}/repl_guest_list.root\", \"guestTestSuite\")\n/list guestTestSuite\nfileMenu.closeall()\n/exit\n"
    expected_output_contains:
      - "guestTestSuite:"
    expected_output_not_contains:
      - "not a valid table path"
    expected_success: true

  - name: "REPL /jump - resolves guest database table name"
    description: "/jump should navigate to table names inside open guest databases"
    skip: true
    skip_reason: "Requires fileMenu.open which needs startup scripts; --skip-startup mode cannot open guest databases. Verified manually."
    repl_mode: true
    stdin_input: "db.new(\"{FRONTIER_TEST_TMP_DIR}/repl_guest_jump.root\")\nfileMenu.open(\"{FRONTIER_TEST_TMP_DIR}/repl_guest_jump.root\")\ndb.newtable(\"{FRONTIER_TEST_TMP_DIR}/repl_guest_jump.root\", \"guestJumpSuite\")\n/jump guestJumpSuite\n/exit\n"
    expected_output_contains:
      - "guestJumpSuite"
    expected_output_not_contains:
      - "not a valid table path"
    expected_success: true

# Test suite notes:
#
# 1. All tests use repl_mode: true to indicate REPL interactive mode required.
#    The test runner must invoke frontier-cli without -e flag to enter REPL,
#    then feed stdin_input as simulated user input.
#
# 2. expected_output_contains checks for substrings in stdout/stderr output.
#    This is more flexible than exact matching for prompt-based output.
#
# 3. Some tests verify absence of output (expected_output_not_contains) to
#    ensure /exit properly terminates and doesn't process subsequent input.
#
# 4. EOF tests use empty or incomplete stdin to simulate Ctrl-D behavior.
#
# 5. Test runner must distinguish between:
#    - REPL prompt output (should not be treated as errors)
#    - Error messages from script execution (should be captured)
#    - Command output (/vars, /help display)
#    - Evaluation results (return values)
