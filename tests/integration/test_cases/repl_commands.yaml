# REPL Phase 1 Command Tests
#
# Tests for REPL special commands:
# - /help - Show available commands
# - /vars - List workspace variables
# - /clear - Clear workspace
# - /exit - Exit REPL
#
# These tests require REPL interactive mode with stdin simulation.
# Reference: planning/phase4/REPL_INTERACTIVE_MODE_DESIGN.md (Phase 1)
#
# Test Pattern: Similar to dialog_verbs.yaml, using stdin_input to simulate
# user commands typed at REPL prompt.

tests:
  # =========================================================================
  # /help Command
  # =========================================================================

  - name: "REPL /help - displays available commands"
    description: "/help should list all available commands"
    repl_mode: true
    stdin_input: "/help\n/exit\n"
    expected_output_contains:
      - "/exit"
      - "/help"
      - "/vars"
      - "/clear"
      - "Available commands"
    expected_success: true

  - name: "REPL /help - shows multi-line usage"
    description: "/help should mention multi-line (Phase 2 feature)"
    repl_mode: true
    stdin_input: "/help\n/exit\n"
    expected_output_contains:
      - "Multi-line"
      - "Phase 2"
    expected_success: true

  - name: "REPL /help - shows examples"
    description: "/help should provide usage examples"
    repl_mode: true
    stdin_input: "/help\n/exit\n"
    expected_output_contains:
      - "Examples"
      - "workspace"
    expected_success: true

  # =========================================================================
  # /vars Command - Empty Workspace
  # =========================================================================

  - name: "REPL /vars - empty workspace"
    description: "/vars shows empty ephemeral workspace"
    repl_mode: true
    stdin_input: "/vars\n/exit\n"
    expected_output_contains:
      - "(empty)"
    expected_success: true

  # =========================================================================
  # /vars Command - With Variables
  # =========================================================================

  - name: "REPL /vars - single variable"
    description: "/vars should list single workspace variable"
    repl_mode: true
    stdin_input: "x = 42\n/vars\n/exit\n"
    expected_output_contains:
      - "x = 42"
      - "Workspace variables"
    expected_success: true

  - name: "REPL /vars - multiple variables"
    description: "/vars should list all workspace variables"
    repl_mode: true
    stdin_input: |
      x = 42
      y = "hello"
      z = true
      /vars
      /exit
    expected_output_contains:
      - "x = 42"
      - "y = \"hello\""
      - "z = true"
      - "Workspace variables (3)"
    expected_success: true

  - name: "REPL /vars - string variable displays with quotes"
    description: "/vars should show strings with quote marks"
    repl_mode: true
    stdin_input: |
      greeting = "Hello, world!"
      /vars
      /exit
    expected_output_contains:
      - "greeting = \"Hello, world!\""
    expected_success: true

  - name: "REPL /vars - boolean variables"
    description: "/vars should show true/false for booleans"
    repl_mode: true
    stdin_input: |
      flag1 = true
      flag2 = false
      /vars
      /exit
    expected_output_contains:
      - "flag1 = true"
      - "flag2 = false"
    expected_success: true

  - name: "REPL /vars - table variable"
    description: "/vars should show table summary"
    repl_mode: true
    stdin_input: |
      lang.new(tableType, @subtable)
      subtable.a = 1
      subtable.b = 2
      /vars
      /exit
    expected_output_contains:
      - "subtable ="
      - "[table with 2 items]"
    expected_success: true

  # =========================================================================
  # /clear Command
  # =========================================================================

  - name: "REPL /clear - clears workspace variables"
    description: "/clear should remove all workspace variables"
    repl_mode: true
    stdin_input: |
      x = 42
      y = 100
      /clear
      /vars
      /exit
    expected_output_contains:
      - "Workspace cleared"
      - "(empty)"
    expected_success: true

  - name: "REPL /clear - variables inaccessible after clear"
    description: "After /clear, variables should not be accessible"
    repl_mode: true
    stdin_input: |
      x = 42
      /clear
      x
      /exit
    expected_output_contains:
      - "Can't evaluate"
      - "hasn't been defined"
    expected_success: true

  - name: "REPL /clear - can add variables after clear"
    description: "After /clear, new variables should work"
    repl_mode: true
    stdin_input: |
      old = 1
      /clear
      new = 2
      /vars
      /exit
    expected_output_contains:
      - "new = 2"
    expected_output_not_contains:
      - "old"
    expected_success: true

  - name: "REPL /clear - idempotent (can clear empty workspace)"
    description: "/clear on empty workspace should succeed"
    repl_mode: true
    stdin_input: "/clear\n/clear\n/exit\n"
    expected_output_contains:
      - "Workspace cleared"
    expected_success: true

  # =========================================================================
  # /exit Command
  # =========================================================================

  - name: "REPL /exit - exits cleanly"
    description: "/exit should terminate REPL without error"
    repl_mode: true
    stdin_input: "/exit\n"
    expected_output_contains:
      - "Goodbye"  # or similar exit message
    expected_success: true

  - name: "REPL /exit - ignores subsequent input"
    description: "/exit should terminate immediately"
    repl_mode: true
    stdin_input: "/exit\nx = 42\n"
    expected_output_not_contains:
      - "42"  # Should exit before evaluating second line
    expected_success: true

  # =========================================================================
  # Command Error Handling
  # =========================================================================

  - name: "REPL - unknown command"
    description: "Unknown commands should show error and continue"
    repl_mode: true
    stdin_input: "/unknown\n/exit\n"
    expected_output_contains:
      - "Unknown command"
      - "/help"
    expected_success: true

  - name: "REPL - command case sensitivity"
    description: "Commands should be case-sensitive"
    repl_mode: true
    stdin_input: "/EXIT\n/exit\n"
    expected_output_contains:
      - "Unknown command"
    expected_success: true

  - name: "REPL - leading slash required"
    description: "Commands without leading slash are treated as code"
    repl_mode: true
    stdin_input: "help\n/exit\n"
    expected_output_contains:
      - "Can't evaluate"  # 'help' treated as variable
      - "hasn't been defined"
    expected_success: true

  - name: "REPL - command with trailing whitespace"
    description: "Commands should work with trailing spaces"
    repl_mode: true
    stdin_input: "/help   \n/exit\n"
    expected_output_contains:
      - "Available commands"
    expected_success: true

  # =========================================================================
  # Command Integration with Evaluation
  # =========================================================================

  - name: "REPL - alternate between code and commands"
    description: "Should seamlessly switch between code and commands"
    repl_mode: true
    stdin_input: |
      x = 10
      /vars
      x = 20
      /vars
      /exit
    expected_output_contains:
      - "x = 10"
      - "x = 20"
    expected_success: true

  - name: "REPL - error doesn't affect commands"
    description: "Runtime errors shouldn't break command execution"
    repl_mode: true
    stdin_input: |
      1 / 0
      /help
      /exit
    expected_output_contains:
      - "divide by zero"
      - "Available commands"
    expected_success: true

  - name: "REPL - command after successful evaluation"
    description: "Commands should work after successful code"
    repl_mode: true
    stdin_input: |
      result = 42
      /vars
      /exit
    expected_output_contains:
      - "result = 42"
    expected_success: true

  # =========================================================================
  # Welcome and Prompt Messages
  # =========================================================================

  - name: "REPL - welcome message"
    description: "REPL should show welcome message on startup"
    repl_mode: true
    stdin_input: "/exit\n"
    expected_output_contains:
      - "Frontier REPL"
      - "Interactive"
    expected_success: true

  - name: "REPL - prompt displays"
    description: "REPL should show prompt before each input"
    repl_mode: true
    stdin_input: "/exit\n"
    expected_output_contains:
      - "[root]>"  # or "[workspace]>" depending on implementation
    expected_success: true

  - name: "REPL - goodbye message"
    description: "REPL should show goodbye message on exit"
    repl_mode: true
    stdin_input: "/exit\n"
    expected_output_contains:
      - "Goodbye"
    expected_success: true

  # =========================================================================
  # Workspace Context Display
  # =========================================================================

  - name: "REPL /vars - shows variable count"
    description: "/vars should show count of workspace variables"
    repl_mode: true
    stdin_input: |
      a = 1
      b = 2
      c = 3
      /vars
      /exit
    expected_output_contains:
      - "(3)"
    expected_success: true

  - name: "REPL /vars - handles special characters in values"
    description: "/vars should properly display special characters"
    repl_mode: true
    stdin_input: |
      special = "Line1\nLine2"
      /vars
      /exit
    expected_output_contains:
      - "special ="
    expected_success: true

  # =========================================================================
  # Empty Input Handling
  # =========================================================================

  - name: "REPL - empty line ignored"
    description: "Empty input should show next prompt"
    repl_mode: true
    stdin_input: "\n\n/exit\n"
    expected_output_contains:
      - "[root]>"
    expected_success: true

  - name: "REPL - whitespace-only line ignored"
    description: "Whitespace-only input should be ignored"
    repl_mode: true
    stdin_input: "   \n\t\n/exit\n"
    expected_success: true

  # =========================================================================
  # EOF (Ctrl-D) Handling
  # =========================================================================

  - name: "REPL - EOF exits cleanly"
    description: "Ctrl-D (EOF) should exit REPL"
    repl_mode: true
    stdin_input: ""  # Empty stdin simulates EOF
    expected_output_contains:
      - "Goodbye"  # Should exit gracefully
    expected_success: true

  - name: "REPL - EOF after expressions"
    description: "EOF should exit after evaluating expressions"
    repl_mode: true
    stdin_input: "workspace.x = 42\n"  # No /exit, just EOF
    expected_success: true

  # =========================================================================
  # Complex Workspace State
  # =========================================================================

  - name: "REPL /vars - nested table display"
    description: "/vars should handle nested tables"
    repl_mode: true
    stdin_input: |
      lang.new(tableType, @outer)
      lang.new(tableType, @outer.inner)
      outer.inner.value = 42
      /vars
      /exit
    expected_output_contains:
      - "outer ="
    expected_success: true

  - name: "REPL /vars - large workspace"
    description: "/vars should handle many variables"
    repl_mode: true
    stdin_input: |
      v1 = 1
      v2 = 2
      v3 = 3
      v4 = 4
      v5 = 5
      v6 = 6
      v7 = 7
      v8 = 8
      v9 = 9
      v10 = 10
      /vars
      /exit
    expected_output_contains:
      - "v1 ="
      - "v10 ="
      - "(10)"
    expected_success: true

  # =========================================================================
  # Command Help Text Validation
  # =========================================================================

  - name: "REPL /help - documents /exit"
    description: "/help should explain /exit command"
    repl_mode: true
    stdin_input: "/help\n/exit\n"
    expected_output_contains:
      - "/exit"
      - "Exit"
    expected_success: true

  - name: "REPL /help - documents /vars"
    description: "/help should explain /vars command"
    repl_mode: true
    stdin_input: "/help\n/exit\n"
    expected_output_contains:
      - "/vars"
      - "workspace"
    expected_success: true

  - name: "REPL /help - documents /clear"
    description: "/help should explain /clear command"
    repl_mode: true
    stdin_input: "/help\n/exit\n"
    expected_output_contains:
      - "/clear"
      - "Clear"
    expected_success: true

# Test suite notes:
#
# 1. All tests use repl_mode: true to indicate REPL interactive mode required.
#    The test runner must invoke frontier-cli without -e flag to enter REPL,
#    then feed stdin_input as simulated user input.
#
# 2. expected_output_contains checks for substrings in stdout/stderr output.
#    This is more flexible than exact matching for prompt-based output.
#
# 3. Some tests verify absence of output (expected_output_not_contains) to
#    ensure /exit properly terminates and doesn't process subsequent input.
#
# 4. EOF tests use empty or incomplete stdin to simulate Ctrl-D behavior.
#
# 5. Test runner must distinguish between:
#    - REPL prompt output (should not be treated as errors)
#    - Error messages from script execution (should be captured)
#    - Command output (/vars, /help display)
#    - Evaluation results (return values)
#
# 6. Phase 2 will add multi-line tests using backslash continuation:
#    stdin_input: "workspace.x = 1 + \\\n2 + \\\n3\n/exit\n"
