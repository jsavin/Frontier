# Integration tests for TCP Phase 1A - Core Socket Primitives
# Tests basic TCP client connectivity (NO external network dependencies)
#
# Phase 1A verbs (7 total):
#   - tcp.openNameStream(hostname, port) → streamID - DNS + connect (blocking)
#   - tcp.openAddrStream(addr, port) → streamID - Direct IP connect
#   - tcp.readStream(stream, bytes) → data - Non-blocking read
#   - tcp.writeStream(stream, data) → true - Blocking write
#   - tcp.closeStream(stream) → true - Graceful shutdown (FIN)
#   - tcp.abortStream(stream) → true - Immediate close (RST)
#   - tcp.countConnections() → count - Active stream count
#
# NOTE: This file contains LOCAL tests only (no external network required).
# Network-dependent tests are in tcp_verbs_network.yaml (opt-in).
#
# NOTE: tcp.addressEncode/Decode are Phase 1B verbs (not Phase 1A).
# Tests for those verbs will be added in Phase 1B.
#
# Reference:
#   - planning/phase4/networking/TCP_PHASE1A_PREFLIGHT.md
#   - planning/phase4/networking/TCP_VERBS_ANALYSIS.md
#   - planning/phase4/networking/IMPLEMENTATION_PLAN.md

tests:
  # ===========================================================================
  # tcp.countConnections - Resource tracking
  # ===========================================================================

  - name: "tcp.countConnections - initial state"
    description: "Verify countConnections returns a number (should be >= 0)"
    script: |
      local(count = tcp.countConnections());
      return typeof(count) == longType
    expected_success: true
    expected_result: "true"

  - name: "tcp.countConnections - return type"
    description: "Verify countConnections returns long type"
    script: |
      local(count = tcp.countConnections());
      return typeof(count) == longType
    expected_success: true
    expected_result: "true"

  # ===========================================================================
  # Error Handling - Invalid Stream IDs
  # ===========================================================================

  - name: "tcp.closeStream - invalid stream ID (negative)"
    description: "Closing negative stream ID should raise error"
    script: |
      try {
        tcp.closeStream(-1);
        return "false"
      }
      else {
        return "true"
      }
    expected_success: true
    expected_result: "true"

  - name: "tcp.closeStream - invalid stream ID (zero)"
    description: "Stream ID 0 is invalid (reserved)"
    script: |
      try {
        tcp.closeStream(0);
        return "false"
      }
      else {
        return "true"
      }
    expected_success: true
    expected_result: "true"

  - name: "tcp.closeStream - invalid stream ID (large)"
    description: "Large invalid stream ID should raise error"
    script: |
      try {
        tcp.closeStream(999999);
        return "false"
      }
      else {
        return "true"
      }
    expected_success: true
    expected_result: "true"

  - name: "tcp.abortStream - invalid stream ID (negative)"
    description: "Aborting negative stream ID should raise error"
    script: |
      try {
        tcp.abortStream(-1);
        return "false"
      }
      else {
        return "true"
      }
    expected_success: true
    expected_result: "true"

  - name: "tcp.abortStream - invalid stream ID (zero)"
    description: "Stream ID 0 is invalid for abort"
    script: |
      try {
        tcp.abortStream(0);
        return "false"
      }
      else {
        return "true"
      }
    expected_success: true
    expected_result: "true"

  - name: "tcp.readStream - invalid stream ID (negative)"
    description: "Reading from negative stream ID should raise error"
    script: |
      try {
        tcp.readStream(-1, 1024);
        return "false"
      }
      else {
        return "true"
      }
    expected_success: true
    expected_result: "true"

  - name: "tcp.readStream - invalid stream ID (zero)"
    description: "Reading from stream ID 0 should raise error"
    script: |
      try {
        tcp.readStream(0, 1024);
        return "false"
      }
      else {
        return "true"
      }
    expected_success: true
    expected_result: "true"

  - name: "tcp.writeStream - invalid stream ID (negative)"
    description: "Writing to negative stream ID should raise error"
    script: |
      try {
        tcp.writeStream(-1, "test data");
        return "false"
      }
      else {
        return "true"
      }
    expected_success: true
    expected_result: "true"

  - name: "tcp.writeStream - invalid stream ID (zero)"
    description: "Writing to stream ID 0 should raise error"
    script: |
      try {
        tcp.writeStream(0, "test data");
        return "false"
      }
      else {
        return "true"
      }
    expected_success: true
    expected_result: "true"

  # ===========================================================================
  # Error Handling - Invalid Parameters
  # ===========================================================================

  - name: "tcp.readStream - invalid byte count (negative)"
    description: "Negative byte count should raise error"
    script: |
      try {
        tcp.readStream(1, -1);
        return "false"
      }
      else {
        return "true"
      }
    expected_success: true
    expected_result: "true"

  - name: "tcp.openNameStream - invalid port (negative)"
    description: "Negative port number should raise error"
    script: |
      try {
        tcp.openNameStream("localhost", -1);
        return "false"
      }
      else {
        return "true"
      }
    expected_success: true
    expected_result: "true"

  - name: "tcp.openNameStream - invalid port (zero)"
    description: "Port 0 should raise error for client connections"
    script: |
      try {
        tcp.openNameStream("localhost", 0);
        return "false"
      }
      else {
        return "true"
      }
    expected_success: true
    expected_result: "true"

  - name: "tcp.openNameStream - invalid port (too large)"
    description: "Port > 65535 should raise error"
    script: |
      try {
        tcp.openNameStream("localhost", 70000);
        return "false"
      }
      else {
        return "true"
      }
    expected_success: true
    expected_result: "true"

  - name: "tcp.openNameStream - empty hostname"
    description: "Empty hostname should raise error"
    script: |
      try {
        tcp.openNameStream("", 80);
        return "false"
      }
      else {
        return "true"
      }
    expected_success: true
    expected_result: "true"

  - name: "tcp.openAddrStream - invalid port (negative)"
    description: "Negative port number should raise error"
    script: |
      try {
        local(localhost = 0x7F000001);
        tcp.openAddrStream(localhost, -1);
        return "false"
      }
      else {
        return "true"
      }
    expected_success: true
    expected_result: "true"

  - name: "tcp.openAddrStream - invalid port (too large)"
    description: "Port > 65535 should raise error"
    script: |
      try {
        local(localhost = 0x7F000001);
        tcp.openAddrStream(localhost, 70000);
        return "false"
      }
      else {
        return "true"
      }
    expected_success: true
    expected_result: "true"

  - name: "tcp.openAddrStream - invalid address (zero)"
    description: "Address 0.0.0.0 is invalid for connect"
    script: |
      try {
        tcp.openAddrStream(0, 80);
        return "false"
      }
      else {
        return "true"
      }
    expected_success: true
    expected_result: "true"

  # ===========================================================================
  # Behavioral Specifications (documented requirements)
  # ===========================================================================

  - name: "tcp.readStream - non-blocking behavior spec"
    description: "Spec: readStream returns empty string when no data available (non-blocking)"
    script: |
      // Behavioral specification: tcp.readStream is NON-BLOCKING.
      // When called on a valid stream with no data available, it returns
      // empty string immediately (does not block, does not raise error).
      // This cannot be tested without actual network connection.
      // This test documents the expected behavior.
      return true
    expected_success: true
    expected_result: "true"

  - name: "tcp.writeStream - blocking behavior spec"
    description: "Spec: writeStream blocks until all data is sent"
    script: |
      // Behavioral specification: tcp.writeStream is BLOCKING.
      // It does not return until all data has been written to the socket,
      // or an error occurs (connection lost, timeout, etc.).
      // This cannot be tested without actual network connection.
      // This test documents the expected behavior.
      return true
    expected_success: true
    expected_result: "true"

  - name: "tcp.closeStream - graceful shutdown spec"
    description: "Spec: closeStream sends FIN (graceful shutdown)"
    script: |
      // Behavioral specification: tcp.closeStream performs graceful shutdown.
      // It sends TCP FIN and waits for remote acknowledgment before
      // deallocating the stream ID. Safe to call multiple times (idempotent).
      // This test documents the expected behavior.
      return true
    expected_success: true
    expected_result: "true"

  - name: "tcp.abortStream - immediate close spec"
    description: "Spec: abortStream sends RST (immediate close)"
    script: |
      // Behavioral specification: tcp.abortStream performs immediate close.
      // It sends TCP RST (reset) and does NOT wait for remote acknowledgment.
      // Use when connection is hung or needs immediate termination.
      // This test documents the expected behavior.
      return true
    expected_success: true
    expected_result: "true"

  - name: "tcp.openNameStream - blocking DNS spec"
    description: "Spec: openNameStream performs blocking DNS lookup + connect"
    script: |
      // Behavioral specification: tcp.openNameStream is BLOCKING.
      // It performs DNS resolution (if hostname not IP) and TCP connect.
      // Does not return until connection established or error.
      // Phase 1A uses blocking DNS; Phase 1B may add async.
      // This test documents the expected behavior.
      return true
    expected_success: true
    expected_result: "true"

  - name: "tcp.openAddrStream - no DNS lookup spec"
    description: "Spec: openAddrStream uses IP address directly (no DNS)"
    script: |
      // Behavioral specification: tcp.openAddrStream bypasses DNS.
      // Address parameter is a 4-byte encoded IP in host byte order.
      // Faster than openNameStream when IP is already known.
      // This test documents the expected behavior.
      return true
    expected_success: true
    expected_result: "true"

  # ===========================================================================
  # Return Type Validation
  # ===========================================================================

  - name: "tcp.readStream - return type spec"
    description: "Spec: readStream returns string (binary data as stringType)"
    script: |
      // Behavioral specification: tcp.readStream returns stringType ('TEXT').
      // UserTalk strings can contain binary data, including null bytes.
      // The return type is always stringType, not a specialized binary type.
      // This test documents the expected behavior.
      return true
    expected_success: true
    expected_result: "true"

  - name: "tcp.openAddrStream - return type spec"
    description: "Spec: openAddrStream returns positive long (stream ID)"
    script: |
      // Behavioral specification: tcp.openAddrStream returns longType.
      // Stream ID is always a positive integer (> 0).
      // Zero is reserved as invalid stream ID.
      // This test documents the expected behavior.
      return true
    expected_success: true
    expected_result: "true"

  - name: "tcp.writeStream - return type spec"
    description: "Spec: writeStream returns boolean true on success"
    script: |
      // Behavioral specification: tcp.writeStream returns booleanType.
      // Always returns true on success (all data sent).
      // Raises error on failure (does not return false).
      // This test documents the expected behavior.
      return true
    expected_success: true
    expected_result: "true"

  - name: "tcp.closeStream - return type spec"
    description: "Spec: closeStream returns boolean true"
    script: |
      // Behavioral specification: tcp.closeStream returns booleanType.
      // Always returns true (even if stream already closed - idempotent).
      // This test documents the expected behavior.
      return true
    expected_success: true
    expected_result: "true"
