# Integration tests for TCP Phase 1A - Core Socket Primitives
# Tests basic TCP client connectivity (NO external network dependencies)
#
# Phase 1A verbs (7 total):
#   - tcp.openStream(hostname, port) → streamID - DNS + connect (blocking)
#   - tcp.openStream(addr, port) → streamID - Direct IP connect
#   - tcp.readStream(stream, bytes) → data - Non-blocking read
#   - tcp.writeStream(stream, data) → true - Blocking write
#   - tcp.closeStream(stream) → true - Graceful shutdown (FIN)
#   - tcp.abortStream(stream) → true - Immediate close (RST)
#   - tcp.countConnections() → count - Active stream count
#
# NOTE: This file contains LOCAL tests only (no external network required).
# Network-dependent tests are in tcp_verbs_network.yaml (opt-in).
#
# NOTE: tcp.addressEncode/Decode are Phase 1B verbs (not Phase 1A).
# Tests for those verbs will be added in Phase 1B.
#
# Reference:
#   - planning/phase4/networking/TCP_PHASE1A_PREFLIGHT.md
#   - planning/phase4/networking/TCP_VERBS_ANALYSIS.md
#   - planning/phase4/networking/IMPLEMENTATION_PLAN.md

tests:
  # ===========================================================================
  # tcp.countConnections - Resource tracking
  # ===========================================================================

  - name: "tcp.countConnections - initial state"
    description: "Verify countConnections returns a number (should be >= 0)"
    script: |
      local(count = tcp.countConnections());
      return typeof(count) == longType
    expected_success: true
    expected_result: "true"

  - name: "tcp.countConnections - return type"
    description: "Verify countConnections returns long type"
    script: |
      local(count = tcp.countConnections());
      return typeof(count) == longType
    expected_success: true
    expected_result: "true"

  # ===========================================================================
  # Error Handling - Invalid Stream IDs
  # ===========================================================================

  - name: "tcp.closeStream - invalid stream ID (negative)"
    description: "Closing negative stream ID should raise error"
    script: |
      try {
        tcp.closeStream(-1);
        return "false"
      }
      else {
        return "true"
      }
    expected_success: true
    expected_result: "true"

  - name: "tcp.closeStream - invalid stream ID (zero)"
    description: "Stream ID 0 is invalid (reserved)"
    script: |
      try {
        tcp.closeStream(0);
        return "false"
      }
      else {
        return "true"
      }
    expected_success: true
    expected_result: "true"

  - name: "tcp.closeStream - invalid stream ID (large)"
    description: "Large invalid stream ID should raise error"
    script: |
      try {
        tcp.closeStream(999999);
        return "false"
      }
      else {
        return "true"
      }
    expected_success: true
    expected_result: "true"

  - name: "tcp.abortStream - invalid stream ID (negative)"
    description: "Aborting negative stream ID should raise error"
    script: |
      try {
        tcp.abortStream(-1);
        return "false"
      }
      else {
        return "true"
      }
    expected_success: true
    expected_result: "true"

  - name: "tcp.abortStream - invalid stream ID (zero)"
    description: "Stream ID 0 is invalid for abort"
    script: |
      try {
        tcp.abortStream(0);
        return "false"
      }
      else {
        return "true"
      }
    expected_success: true
    expected_result: "true"

  - name: "tcp.readStream - invalid stream ID (negative)"
    description: "Reading from negative stream ID should raise error"
    script: |
      try {
        tcp.readStream(-1, 1024);
        return "false"
      }
      else {
        return "true"
      }
    expected_success: true
    expected_result: "true"

  - name: "tcp.readStream - invalid stream ID (zero)"
    description: "Reading from stream ID 0 should raise error"
    script: |
      try {
        tcp.readStream(0, 1024);
        return "false"
      }
      else {
        return "true"
      }
    expected_success: true
    expected_result: "true"

  - name: "tcp.writeStream - invalid stream ID (negative)"
    description: "Writing to negative stream ID should raise error"
    script: |
      try {
        tcp.writeStream(-1, "test data");
        return "false"
      }
      else {
        return "true"
      }
    expected_success: true
    expected_result: "true"

  - name: "tcp.writeStream - invalid stream ID (zero)"
    description: "Writing to stream ID 0 should raise error"
    script: |
      try {
        tcp.writeStream(0, "test data");
        return "false"
      }
      else {
        return "true"
      }
    expected_success: true
    expected_result: "true"

  # ===========================================================================
  # Error Handling - Invalid Parameters
  # ===========================================================================

  - name: "tcp.readStream - invalid byte count (negative)"
    description: "Negative byte count should raise error"
    script: |
      try {
        tcp.readStream(1, -1);
        return "false"
      }
      else {
        return "true"
      }
    expected_success: true
    expected_result: "true"

  - name: "tcp.readStream - invalid byte count (zero)"
    description: "Zero byte count should raise error (must be positive)"
    script: |
      try {
        tcp.readStream(1, 0);
        return "false"
      }
      else {
        return "true"
      }
    expected_success: true
    expected_result: "true"

  - name: "tcp.openStream - invalid port (negative)"
    description: "Negative port number should raise error"
    script: |
      try {
        tcp.openStream("localhost", -1);
        return "false"
      }
      else {
        return "true"
      }
    expected_success: true
    expected_result: "true"

  - name: "tcp.openStream - invalid port (zero)"
    description: "Port 0 should raise error for client connections"
    script: |
      try {
        tcp.openStream("localhost", 0);
        return "false"
      }
      else {
        return "true"
      }
    expected_success: true
    expected_result: "true"

  - name: "tcp.openStream - invalid port (too large)"
    description: "Port > 65535 should raise error"
    script: |
      try {
        tcp.openStream("localhost", 70000);
        return "false"
      }
      else {
        return "true"
      }
    expected_success: true
    expected_result: "true"

  - name: "tcp.openStream - empty hostname"
    description: "Empty hostname should raise error"
    script: |
      try {
        tcp.openStream("", 80);
        return "false"
      }
      else {
        return "true"
      }
    expected_success: true
    expected_result: "true"

  - name: "tcp.openStream - invalid port (negative)"
    description: "Negative port number should raise error"
    script: |
      try {
        local(localhost = 0x7F000001);
        tcp.openStream(localhost, -1);
        return "false"
      }
      else {
        return "true"
      }
    expected_success: true
    expected_result: "true"

  - name: "tcp.openStream - invalid port (too large)"
    description: "Port > 65535 should raise error"
    script: |
      try {
        local(localhost = 0x7F000001);
        tcp.openStream(localhost, 70000);
        return "false"
      }
      else {
        return "true"
      }
    expected_success: true
    expected_result: "true"

  - name: "tcp.openStream - invalid address (zero)"
    description: "Address 0.0.0.0 is invalid for client connect (Phase 1A)"
    # Note: 0.0.0.0 is invalid for Phase 1A client connections (tcp.openStream).
    # Phase 2 may allow 0.0.0.0 for server binding (tcp.listenStream), but that's
    # a different use case. This test validates Phase 1A client-side behavior.
    script: |
      try {
        tcp.openStream(0, 80);
        return "false"
      }
      else {
        return "true"
      }
    expected_success: true
    expected_result: "true"

  # ===========================================================================
  # Behavioral Specifications (documented requirements)
  # ===========================================================================

  - name: "tcp.readStream - non-blocking behavior spec"
    description: "Spec: readStream returns empty string when no data available (non-blocking)"
    script: |
      // Behavioral specification: tcp.readStream is NON-BLOCKING.
      // When called on a valid stream with no data available, it returns
      // empty string immediately (does not block, does not raise error).
      // This cannot be tested without actual network connection.
      // This test documents the expected behavior.
      return true
    expected_success: true
    expected_result: "true"

  - name: "tcp.writeStream - blocking behavior spec"
    description: "Spec: writeStream blocks until all data is sent"
    script: |
      // Behavioral specification: tcp.writeStream is BLOCKING.
      // It does not return until all data has been written to the socket,
      // or an error occurs (connection lost, timeout, etc.).
      // This cannot be tested without actual network connection.
      // This test documents the expected behavior.
      return true
    expected_success: true
    expected_result: "true"

  - name: "tcp.closeStream - graceful shutdown spec"
    description: "Spec: closeStream sends FIN (graceful shutdown)"
    script: |
      // Behavioral specification: tcp.closeStream performs graceful shutdown.
      // It sends TCP FIN and waits for remote acknowledgment before
      // deallocating the stream ID. Safe to call multiple times (idempotent).
      // This test documents the expected behavior.
      return true
    expected_success: true
    expected_result: "true"

  - name: "tcp.abortStream - immediate close spec"
    description: "Spec: abortStream sends RST (immediate close)"
    script: |
      // Behavioral specification: tcp.abortStream performs immediate close.
      // It sends TCP RST (reset) and does NOT wait for remote acknowledgment.
      // Use when connection is hung or needs immediate termination.
      // This test documents the expected behavior.
      return true
    expected_success: true
    expected_result: "true"

  - name: "tcp.openStream - blocking DNS spec"
    description: "Spec: openNameStream performs blocking DNS lookup + connect"
    script: |
      // Behavioral specification: tcp.openStream is BLOCKING.
      // It performs DNS resolution (if hostname not IP) and TCP connect.
      // Does not return until connection established or error.
      // Phase 1A uses blocking DNS; Phase 1B may add async.
      // This test documents the expected behavior.
      return true
    expected_success: true
    expected_result: "true"

  - name: "tcp.openStream - no DNS lookup spec"
    description: "Spec: openAddrStream uses IP address directly (no DNS)"
    script: |
      // Behavioral specification: tcp.openStream bypasses DNS.
      // Address parameter is a 4-byte encoded IP in host byte order.
      // Faster than openNameStream when IP is already known.
      // This test documents the expected behavior.
      return true
    expected_success: true
    expected_result: "true"

  # ===========================================================================
  # Return Type Validation
  # ===========================================================================

  - name: "tcp.readStream - return type spec"
    description: "Spec: readStream returns string (binary data as stringType)"
    script: |
      // Behavioral specification: tcp.readStream returns stringType ('TEXT').
      // UserTalk strings can contain binary data, including null bytes.
      // The return type is always stringType, not a specialized binary type.
      // This test documents the expected behavior.
      return true
    expected_success: true
    expected_result: "true"

  - name: "tcp.openStream - return type spec"
    description: "Spec: openAddrStream returns positive long (stream ID)"
    script: |
      // Behavioral specification: tcp.openStream returns longType.
      // Stream ID is always a positive integer (> 0).
      // Zero is reserved as invalid stream ID.
      // This test documents the expected behavior.
      return true
    expected_success: true
    expected_result: "true"

  - name: "tcp.writeStream - return type spec"
    description: "Spec: writeStream returns boolean true on success"
    script: |
      // Behavioral specification: tcp.writeStream returns booleanType.
      // Always returns true on success (all data sent).
      // Raises error on failure (does not return false).
      // This test documents the expected behavior.
      return true
    expected_success: true
    expected_result: "true"

  - name: "tcp.closeStream - return type spec"
    description: "Spec: closeStream returns boolean true"
    script: |
      // Behavioral specification: tcp.closeStream returns booleanType.
      // Always returns true (even if stream already closed - idempotent).
      // This test documents the expected behavior.
      return true
    expected_success: true
    expected_result: "true"

  # ===========================================================================
  # Phase 1B: Address Encoding Verbs
  # ===========================================================================
  # tcp.addressEncode(ipString) → addr - Convert dotted decimal to long
  # tcp.addressDecode(addr) → ipString - Convert long to dotted decimal
  #
  # These verbs provide UserTalk-accessible IP address conversion:
  # - addressEncode: "192.168.1.1" → 0xC0A80101 (network byte order long)
  # - addressDecode: 0xC0A80101 → "192.168.1.1" (dotted decimal string)
  #
  # Reference:
  #   - planning/phase4/networking/TCP_PHASE1B_SPEC.md
  #   - tests/TCP_PHASE1A_TEST_SUMMARY.md (C unit tests show expected behavior)
  #   - Common/source/tcpverbs.c (tcp_address_encode, tcp_address_decode)

  # ---------------------------------------------------------------------------
  # Happy Path - Valid IP Addresses
  # ---------------------------------------------------------------------------

  - name: "tcp.addressEncode - private IP (192.168.1.1)"
    description: "Encode private IP address to long (network byte order)"
    script: |
      local(addr = tcp.addressEncode("192.168.1.1"));
      return addr == 3232235777
    expected_success: true
    expected_result: "true"

  - name: "tcp.addressEncode - localhost (127.0.0.1)"
    description: "Encode localhost to long"
    script: |
      local(addr = tcp.addressEncode("127.0.0.1"));
      return addr == 0x7F000001
    expected_success: true
    expected_result: "true"

  - name: "tcp.addressEncode - public DNS (8.8.8.8)"
    description: "Encode Google DNS IP to long"
    script: |
      local(addr = tcp.addressEncode("8.8.8.8"));
      return addr == 0x08080808
    expected_success: true
    expected_result: "true"

  - name: "tcp.addressDecode - private IP (3232235777)"
    description: "Decode network byte order long to dotted decimal"
    script: |
      local(ipString = tcp.addressDecode(3232235777));
      return ipString == "192.168.1.1"
    expected_success: true
    expected_result: "true"

  - name: "tcp.addressDecode - localhost (0x7F000001)"
    description: "Decode localhost address to string"
    script: |
      local(ipString = tcp.addressDecode(0x7F000001));
      return ipString == "127.0.0.1"
    expected_success: true
    expected_result: "true"

  - name: "tcp.addressDecode - public DNS (134744072)"
    description: "Decode Google DNS address to string"
    script: |
      local(ipString = tcp.addressDecode(134744072));
      return ipString == "8.8.8.8"
    expected_success: true
    expected_result: "true"

  # ---------------------------------------------------------------------------
  # Roundtrip Tests - Encode → Decode → Original
  # ---------------------------------------------------------------------------

  - name: "tcp.addressEncode/Decode - roundtrip 192.168.1.1"
    description: "Verify encode→decode→original for private IP"
    script: |
      local(original = "192.168.1.1");
      local(encoded = tcp.addressEncode(original));
      local(decoded = tcp.addressDecode(encoded));
      return decoded == original
    expected_success: true
    expected_result: "true"

  - name: "tcp.addressEncode/Decode - roundtrip 127.0.0.1"
    description: "Verify encode→decode→original for localhost"
    script: |
      local(original = "127.0.0.1");
      local(encoded = tcp.addressEncode(original));
      local(decoded = tcp.addressDecode(encoded));
      return decoded == original
    expected_success: true
    expected_result: "true"

  - name: "tcp.addressEncode/Decode - roundtrip 8.8.8.8"
    description: "Verify encode→decode→original for public DNS"
    script: |
      local(original = "8.8.8.8");
      local(encoded = tcp.addressEncode(original));
      local(decoded = tcp.addressDecode(encoded));
      return decoded == original
    expected_success: true
    expected_result: "true"

  # ---------------------------------------------------------------------------
  # Edge Cases - Boundary Values
  # ---------------------------------------------------------------------------

  - name: "tcp.addressEncode - wildcard address (0.0.0.0)"
    description: "Encode wildcard/INADDR_ANY address"
    script: |
      local(addr = tcp.addressEncode("0.0.0.0"));
      return addr == 0
    expected_success: true
    expected_result: "true"

  - name: "tcp.addressEncode - broadcast address (255.255.255.255)"
    description: "Encode broadcast address"
    script: |
      local(addr = tcp.addressEncode("255.255.255.255"));
      return addr == 4294967295
    expected_success: true
    expected_result: "true"

  - name: "tcp.addressDecode - wildcard (0)"
    description: "Decode zero to 0.0.0.0"
    script: |
      local(ipString = tcp.addressDecode(0));
      return ipString == "0.0.0.0"
    expected_success: true
    expected_result: "true"

  - name: "tcp.addressDecode - broadcast (4294967295)"
    description: "Decode max value to 255.255.255.255"
    script: |
      local(ipString = tcp.addressDecode(4294967295));
      return ipString == "255.255.255.255"
    expected_success: true
    expected_result: "true"

  - name: "tcp.addressEncode/Decode - roundtrip 0.0.0.0"
    description: "Verify encode→decode→original for wildcard"
    script: |
      local(original = "0.0.0.0");
      local(encoded = tcp.addressEncode(original));
      local(decoded = tcp.addressDecode(encoded));
      return decoded == original
    expected_success: true
    expected_result: "true"

  - name: "tcp.addressEncode/Decode - roundtrip 255.255.255.255"
    description: "Verify encode→decode→original for broadcast"
    script: |
      local(original = "255.255.255.255");
      local(encoded = tcp.addressEncode(original));
      local(decoded = tcp.addressDecode(encoded));
      return decoded == original
    expected_success: true
    expected_result: "true"

  # ---------------------------------------------------------------------------
  # Error Cases - Invalid IP Strings
  # ---------------------------------------------------------------------------

  - name: "tcp.addressEncode - invalid format (too many octets)"
    description: "Reject IP string with 5 octets"
    script: |
      try {
        tcp.addressEncode("192.168.1.1.1");
        return "false"
      }
      else {
        return "true"
      }
    expected_success: true
    expected_result: "true"

  - name: "tcp.addressEncode - invalid format (too few octets)"
    description: "Reject IP string with 3 octets"
    script: |
      try {
        tcp.addressEncode("192.168.1");
        return "false"
      }
      else {
        return "true"
      }
    expected_success: true
    expected_result: "true"

  - name: "tcp.addressEncode - invalid format (octet overflow)"
    description: "Reject IP string with octet > 255"
    script: |
      try {
        tcp.addressEncode("192.168.1.256");
        return "false"
      }
      else {
        return "true"
      }
    expected_success: true
    expected_result: "true"

  - name: "tcp.addressEncode - invalid format (negative octet)"
    description: "Reject IP string with negative octet"
    script: |
      try {
        tcp.addressEncode("192.168.-1.1");
        return "false"
      }
      else {
        return "true"
      }
    expected_success: true
    expected_result: "true"

  - name: "tcp.addressEncode - invalid format (non-numeric)"
    description: "Reject IP string with letters"
    script: |
      try {
        tcp.addressEncode("192.168.1.x");
        return "false"
      }
      else {
        return "true"
      }
    expected_success: true
    expected_result: "true"

  - name: "tcp.addressEncode - invalid format (empty string)"
    description: "Reject empty IP string"
    script: |
      try {
        tcp.addressEncode("");
        return "false"
      }
      else {
        return "true"
      }
    expected_success: true
    expected_result: "true"

  # ---------------------------------------------------------------------------
  # Return Type Validation
  # ---------------------------------------------------------------------------

  - name: "tcp.addressEncode - return type"
    description: "Verify addressEncode returns longType"
    script: |
      local(addr = tcp.addressEncode("192.168.1.1"));
      return typeof(addr) == longType
    expected_success: true
    expected_result: "true"

  - name: "tcp.addressDecode - return type"
    description: "Verify addressDecode returns stringType"
    script: |
      local(ipString = tcp.addressDecode(0xC0A80101));
      return typeof(ipString) == stringType
    expected_success: true
    expected_result: "true"
