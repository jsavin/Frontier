# Integration tests for lang verb operations (type conversions)
# Tests type conversion verbs available in headless mode
#
# Test case fields:
#   name: Test name (required)
#   description: Test description (optional)
#   script: UserTalk script to execute (required)
#   expected_success: true/false (default: true)
#   expected_result: Expected return value as string (optional)
#   expected_result_type: Expected result type from JSON (optional)
#   expected_error_type: Expected error type if expected_success=false (optional)
#   timeout: Timeout in seconds (optional, default: 10)

tests:
  # lang.double - Convert to double-precision float
  - name: "lang.double - integer to double"
    description: "Convert integer to double-precision float"
    script: 'lang.double(42)'
    expected_success: true
    expected_result: "42.0"

  - name: "lang.double - string to double"
    description: "Convert string representation to double"
    script: 'lang.double("3.14159")'
    expected_success: true
    expected_result: "3.14159"

  - name: "lang.double - negative value"
    description: "Convert negative number to double"
    script: 'lang.double(-273.15)'
    expected_success: true
    expected_result: "-273.15"

  - name: "lang.double - boolean true"
    description: "Convert boolean true to double (1.0)"
    script: 'lang.double(true)'
    expected_success: true
    expected_result: "1.0"

  - name: "lang.double - boolean false"
    description: "Convert boolean false to double (0.0)"
    script: 'lang.double(false)'
    expected_success: true
    expected_result: "0.0"

  # lang.single - Convert to single-precision float
  - name: "lang.single - integer to single"
    description: "Convert integer to single-precision float"
    script: 'lang.single(42)'
    expected_success: true
    expected_result: "42.0"

  - name: "lang.single - string to single"
    description: "Convert string representation to single-precision"
    script: 'typeof(lang.single("3.14159"))'
    expected_success: true
    expected_result: "sing"

  - name: "lang.single - negative value"
    description: "Convert negative number to single"
    script: 'lang.single(-100.5)'
    expected_success: true
    expected_result: "-100.5"

  - name: "lang.single - double to single precision"
    description: "Convert double to single (may lose precision)"
    script: 'typeof(lang.single(1.23456789))'
    expected_success: true
    expected_result: "sing"

  # lang.fixed - Convert to fixed-point (scaled integer)
  - name: "lang.fixed - integer to fixed"
    description: "Convert integer to fixed-point"
    script: 'lang.fixed(42)'
    expected_success: true
    expected_result: "42.0"

  - name: "lang.fixed - double to fixed"
    description: "Convert double to fixed-point"
    script: 'typeof(lang.fixed(3.14159))'
    expected_success: true
    expected_result: "fixd"

  - name: "lang.fixed - string to fixed"
    description: "Convert string to fixed-point"
    script: 'typeof(lang.fixed("100.25"))'
    expected_success: true
    expected_result: "fixd"

  - name: "lang.fixed - negative value"
    description: "Convert negative number to fixed"
    script: 'typeof(lang.fixed(-50.75))'
    expected_success: true
    expected_result: "fixd"

  # lang.direction - Convert to direction enum (up/down/left/right/flatup/flatdown/nodirection)
  - name: "lang.direction - string 'up'"
    description: "Convert string 'up' to direction"
    script: 'lang.direction("up")'
    expected_success: true
    expected_result: "up"

  - name: "lang.direction - string 'down'"
    description: "Convert string 'down' to direction"
    script: 'lang.direction("down")'
    expected_success: true
    expected_result: "down"

  - name: "lang.direction - string 'left'"
    description: "Convert string 'left' to direction"
    script: 'lang.direction("left")'
    expected_success: true
    expected_result: "left"

  - name: "lang.direction - string 'right'"
    description: "Convert string 'right' to direction"
    script: 'lang.direction("right")'
    expected_success: true
    expected_result: "right"

  - name: "lang.direction - string 'flatup'"
    description: "Convert string 'flatup' to direction"
    script: 'lang.direction("flatup")'
    expected_success: true
    expected_result: "flatup"

  - name: "lang.direction - string 'flatdown'"
    description: "Convert string 'flatdown' to direction"
    script: 'lang.direction("flatdown")'
    expected_success: true
    expected_result: "flatdown"

  - name: "lang.direction - invalid direction"
    description: "Attempt to convert invalid direction string"
    script: 'lang.direction("invalid")'
    expected_success: false

  # lang.string4 - Convert to OSType (4-character string code)
  - name: "lang.string4 - 4-char string"
    description: "Convert 4-character string to OSType"
    script: 'lang.string4("TEXT")'
    expected_success: true
    expected_result: "TEXT"

  - name: "lang.string4 - integer code"
    description: "Convert integer code to OSType"
    script: 'typeof(lang.string4(1414745172))'
    expected_success: true
    expected_result: "type"

  - name: "lang.string4 - padded string"
    description: "Convert short string to OSType (should pad)"
    script: 'typeof(lang.string4("ZIP"))'
    expected_success: true
    expected_result: "type"

  # Type conversion round-trips
  - name: "lang.double roundtrip"
    description: "Convert to double and back via string"
    script: 'lang.double(lang.string(lang.double(42)))'
    expected_success: true
    expected_result: "42.0"

  - name: "lang.single roundtrip"
    description: "Convert to single and back via string"
    script: 'typeof(lang.single(lang.string(lang.single(3.14))))'
    expected_success: true
    expected_result: "sing"

  # Edge cases
  - name: "lang.double - zero"
    description: "Convert zero to double"
    script: 'lang.double(0)'
    expected_success: true
    expected_result: "0.0"

  - name: "lang.double - very large number"
    description: "Convert large number to double"
    script: 'lang.double(1234567890)'
    expected_success: true
    expected_result: "1234567890.0"

  - name: "lang.single - very small number"
    description: "Convert very small number to single"
    script: 'typeof(lang.single(0.0001))'
    expected_success: true
    expected_result: "sing"

  - name: "lang.fixed - zero"
    description: "Convert zero to fixed"
    script: 'lang.fixed(0)'
    expected_success: true
    expected_result: "0.0"

  # Parameter validation tests (verifying automatic validation via getXXXparam)
  - name: "lang.double - no parameters"
    description: "Parameter validation: missing parameter should fail"
    script: 'lang.double()'
    expected_success: false

  - name: "lang.double - too many parameters"
    description: "Parameter validation: extra parameters should fail"
    script: 'lang.double(1, 2)'
    expected_success: false

  - name: "lang.single - no parameters"
    description: "Parameter validation: missing parameter should fail"
    script: 'lang.single()'
    expected_success: false

  - name: "lang.fixed - too many parameters"
    description: "Parameter validation: extra parameters should fail"
    script: 'lang.fixed(1, 2)'
    expected_success: false

  - name: "lang.direction - no parameters"
    description: "Parameter validation: missing parameter should fail"
    script: 'lang.direction()'
    expected_success: false

  - name: "lang.string4 - too many parameters"
    description: "Parameter validation: extra parameters should fail"
    script: 'lang.string4("TEXT", "EXTRA")'
    expected_success: false

  # Phase 2: Memory & Utility Verbs

  # lang.abs - Absolute value
  - name: "lang.abs - positive long"
    description: "Absolute value of positive number (no change)"
    script: 'lang.abs(42)'
    expected_success: true
    expected_result: "42"

  - name: "lang.abs - negative long"
    description: "Absolute value of negative number"
    script: 'lang.abs(-42)'
    expected_success: true
    expected_result: "42"

  - name: "lang.abs - zero"
    description: "Absolute value of zero"
    script: 'lang.abs(0)'
    expected_success: true
    expected_result: "0"

  - name: "lang.abs - negative double"
    description: "Absolute value of negative double"
    script: 'lang.abs(-3.14159)'
    expected_success: true
    expected_result: "3.14159"

  - name: "lang.abs - positive double"
    description: "Absolute value of positive double (no change)"
    script: 'lang.abs(2.71828)'
    expected_success: true
    expected_result: "2.71828"

  - name: "lang.abs - negative single"
    description: "Absolute value of negative single-precision"
    script: 'lang.abs(-100.5)'
    expected_success: true
    expected_result: "100.5"

  - name: "lang.abs - very large negative"
    description: "Absolute value of large negative number"
    script: 'lang.abs(-999999999)'
    expected_success: true
    expected_result: "999999999"

  - name: "lang.abs - no parameters"
    description: "Parameter validation: missing parameter should fail"
    script: 'lang.abs()'
    expected_success: false

  - name: "lang.abs - too many parameters"
    description: "Parameter validation: extra parameters should fail"
    script: 'lang.abs(1, 2)'
    expected_success: false

  # lang.random - Random number generator
  - name: "lang.random - in range"
    description: "Random number should be in valid range [0, max-1]"
    script: |
      local (x = lang.random(100));
      return (x >= 0) and (x < 100)
    expected_success: true
    expected_result: "true"

  - name: "lang.random - max=1"
    description: "Random(1) should always return 0"
    script: 'lang.random(1)'
    expected_success: true
    expected_result: "0"

  - name: "lang.random - max=10"
    description: "Random(10) should be in [0,9]"
    script: |
      local (x = lang.random(10));
      return (x >= 0) and (x <= 9)
    expected_success: true
    expected_result: "true"

  - name: "lang.random - multiple calls differ"
    description: "Multiple random calls should (usually) produce different values"
    script: |
      local (x = lang.random(1000));
      local (y = lang.random(1000));
      local (z = lang.random(1000));
      return (x != y) or (y != z)
    expected_success: true
    expected_result: "true"

  - name: "lang.random - max=0 error"
    description: "Random(0) should fail (invalid range)"
    script: 'lang.random(0)'
    expected_success: false

  - name: "lang.random - negative max error"
    description: "Random with negative max should fail"
    script: 'lang.random(-10)'
    expected_success: false

  - name: "lang.random - no parameters"
    description: "Parameter validation: missing parameter should fail"
    script: 'lang.random()'
    expected_success: false

  # lang.memavail - Available memory
  - name: "lang.memavail - returns positive"
    description: "Available memory should be a positive number"
    script: 'lang.memavail() > 0'
    expected_success: true
    expected_result: "true"

  - name: "lang.memavail - returns long"
    description: "Memory available should return a numeric value"
    script: |
      local (m = lang.memavail());
      return typeof(m) == "long"
    expected_success: true
    expected_result: "true"

  - name: "lang.memavail - reasonable value"
    description: "Memory available should be at least 1MB (sanity check)"
    script: 'lang.memavail() >= (1024 * 1024)'
    expected_success: true
    expected_result: "true"

  # lang.flushmemory - Memory flush (no-op)
  - name: "lang.flushmemory - succeeds"
    description: "Flush memory should always succeed (no-op)"
    script: 'lang.flushmemory()'
    expected_success: true
    expected_result: "true"

  - name: "lang.flushmemory - returns boolean"
    description: "Flush memory should return boolean true"
    script: |
      local (result = lang.flushmemory());
      return typeof(result) == "bool"
    expected_success: true
    expected_result: "true"

  - name: "lang.flushmemory - idempotent"
    description: "Multiple flush calls should all succeed"
    script: |
      return lang.flushmemory() and lang.flushmemory() and lang.flushmemory()
    expected_success: true
    expected_result: "true"

  # Phase 3: Core Lang Operations Verbs

  # lang.delete - Delete variable/object
  # Design: Errors if variable doesn't exist (not idempotent). This is the correct
  # UserTalk semantics - attempting to delete a nonexistent variable is a script error.
  - name: "lang.delete - simple variable"
    description: "Delete a simple variable from current scope"
    script: |
      local (x = 42);
      lang.delete(@x);
      return true
    expected_success: true
    expected_result: "true"

  - name: "lang.delete - table entry"
    description: "Delete an entry from a table"
    script: |
      lang.new(tableType, @t);
      t.a = "hello";
      t.b = "world";
      lang.delete(@t.a);
      return t.b == "world"
    expected_success: true
    expected_result: "true"

  - name: "lang.delete - non-existent variable"
    description: "Deleting non-existent variable should error (correct UserTalk semantics)"
    script: 'lang.delete(@nonexistent)'
    expected_success: false
    expected_error_type: "script_error"

  - name: "lang.delete - no parameters"
    description: "Parameter validation: missing parameter should fail"
    script: 'lang.delete()'
    expected_success: false
    expected_error_type: "script_error"

  # lang.evaluate - Evaluate UserTalk code string
  - name: "lang.evaluate - simple expression"
    description: "Evaluate simple arithmetic expression"
    script: 'lang.evaluate("1 + 1")'
    expected_success: true
    expected_result: "2"

  - name: "lang.evaluate - string expression"
    description: "Evaluate string concatenation"
    script: 'lang.evaluate("\"Hello\" + \" \" + \"World\"")'
    expected_success: true
    expected_result: "Hello World"

  - name: "lang.evaluate - boolean expression"
    description: "Evaluate boolean logic"
    script: 'lang.evaluate("(5 > 3) and (2 < 4)")'
    expected_success: true
    expected_result: "true"

  - name: "lang.evaluate - multi-line code"
    description: "Evaluate multi-line UserTalk code"
    script: |
      lang.evaluate("local (x = 10); x * 2")
    expected_success: true
    expected_result: "20"

  - name: "lang.evaluate - syntax error"
    description: "Evaluation with syntax error should fail with scriptError"
    script: 'lang.evaluate("1 + + 1")'
    expected_success: false

  - name: "lang.evaluate - empty string"
    description: "Evaluate empty string"
    script: 'lang.evaluate("")'
    expected_success: true

  - name: "lang.evaluate - no parameters"
    description: "Parameter validation: missing parameter should fail"
    script: 'lang.evaluate()'
    expected_success: false

  # lang.callscript - Call a script by name
  - name: "lang.callscript - simple script"
    description: "Call a simple script that returns a value"
    script: |
      on testscript() { return 42 };
      return lang.callscript("testscript")
    expected_success: true
    expected_result: "42"

  - name: "lang.callscript - script with side effects"
    description: "Call a script that modifies state"
    script: |
      local (result = 0);
      on setresult() { result = 100 };
      lang.callscript("setresult");
      return result
    expected_success: true
    expected_result: "100"

  - name: "lang.callscript - non-existent script"
    description: "Calling non-existent script should fail"
    script: 'lang.callscript("nonexistentscript")'
    expected_success: false

  - name: "lang.callscript - no parameters"
    description: "Parameter validation: missing parameter should fail"
    script: 'lang.callscript()'
    expected_success: false

  # lang.msg - Display message for user interaction
  - name: "lang.msg - simple message"
    description: "Display simple message (should output to stdout and return true)"
    script: 'lang.msg("Hello from headless mode")'
    expected_success: true
    expected_result: "true"

  - name: "lang.msg - empty message"
    description: "Display empty message (no-op, returns true)"
    script: 'lang.msg("")'
    expected_success: true
    expected_result: "true"

  - name: "lang.msg - message with special characters"
    description: "Display message with special characters"
    script: 'lang.msg("Test: 1+1=2, \"quoted\", tab\ttab")'
    expected_success: true
    expected_result: "true"

  - name: "lang.msg - long message"
    description: "Display a longer message"
    script: 'lang.msg("This is a longer message to test that lang.msg() can handle strings of various lengths without issue.")'
    expected_success: true
    expected_result: "true"

  - name: "lang.msg - no parameters"
    description: "Parameter validation: missing parameter should fail"
    script: 'lang.msg()'
    expected_success: false
    expected_error_type: "script_error"

  # Phase 4: Date/Time Verbs

  # lang.timecreated - Get creation time of object
  - name: "lang.timecreated - table creation time"
    description: "Get creation time of a newly created table"
    script: |
      lang.new(tableType, @t);
      local (tc = lang.timecreated(@t));
      return typeof(tc) == "date"
    expected_success: true
    expected_result: "true"

  - name: "lang.timecreated - timestamp is recent"
    description: "Creation time should be close to current time"
    script: |
      lang.new(tableType, @t);
      local (tc = lang.timecreated(@t));
      local (now = clock.now());
      return (now - tc) < 10
    expected_success: true
    expected_result: "true"

  - name: "lang.timecreated - timestamp not zero"
    description: "Creation time should not be zero"
    script: |
      lang.new(tableType, @t);
      return lang.timecreated(@t) > 0
    expected_success: true
    expected_result: "true"

  - name: "lang.timecreated - timestamp not in future"
    description: "Creation time should not be in the future"
    script: |
      lang.new(tableType, @t);
      local (tc = lang.timecreated(@t));
      local (now = clock.now());
      return tc <= now
    expected_success: true
    expected_result: "true"

  - name: "lang.timecreated - no parameters"
    description: "Parameter validation: missing parameter should fail"
    script: 'lang.timecreated()'
    expected_success: false
    expected_error_type: "script_error"

  # lang.timemodified - Get modification time of object
  - name: "lang.timemodified - table modification time"
    description: "Get modification time of a newly created table"
    script: |
      lang.new(tableType, @t);
      local (tm = lang.timemodified(@t));
      return typeof(tm) == "date"
    expected_success: true
    expected_result: "true"

  - name: "lang.timemodified - timestamp is recent"
    description: "Modification time should be close to current time"
    script: |
      lang.new(tableType, @t);
      local (tm = lang.timemodified(@t));
      local (now = clock.now());
      return (now - tm) < 10
    expected_success: true
    expected_result: "true"

  - name: "lang.timemodified - equals timecreated initially"
    description: "For new table, timemodified should equal timecreated"
    script: |
      lang.new(tableType, @t);
      local (tc = lang.timecreated(@t));
      local (tm = lang.timemodified(@t));
      return tc == tm
    expected_success: true
    expected_result: "true"

  - name: "lang.timemodified - no parameters"
    description: "Parameter validation: missing parameter should fail"
    script: 'lang.timemodified()'
    expected_success: false
    expected_error_type: "script_error"

  # lang.settimecreated - Set creation time
  - name: "lang.settimecreated - set to 1 year ago"
    description: "Set creation time to 1 year ago and verify"
    script: |
      lang.new(tableType, @t);
      local (oneyearago = clock.now() - (60*60*24*365));
      lang.settimecreated(@t, oneyearago);
      local (tc = lang.timecreated(@t));
      return (tc - oneyearago) < 2
    expected_success: true
    expected_result: "true"

  - name: "lang.settimecreated - returns boolean true"
    description: "settimecreated should return true on success"
    script: |
      lang.new(tableType, @t);
      return lang.settimecreated(@t, clock.now() - 1000)
    expected_success: true
    expected_result: "true"

  - name: "lang.settimecreated - custom timestamp persists"
    description: "Set custom timestamp and verify it persists"
    script: |
      lang.new(tableType, @t);
      local (customtime = 1000000000);
      lang.settimecreated(@t, customtime);
      return lang.timecreated(@t) == customtime
    expected_success: true
    expected_result: "true"

  - name: "lang.settimecreated - no parameters"
    description: "Parameter validation: missing parameters should fail"
    script: 'lang.settimecreated()'
    expected_success: false
    expected_error_type: "script_error"

  - name: "lang.settimecreated - one parameter only"
    description: "Parameter validation: need both address and date"
    script: |
      lang.new(tableType, @t);
      lang.settimecreated(@t)
    expected_success: false
    expected_error_type: "script_error"

  # lang.settimemodified - Set modification time
  - name: "lang.settimemodified - set to 100 days ago"
    description: "Set modification time to 100 days ago and verify"
    script: |
      lang.new(tableType, @t);
      local (hundreddays = clock.now() - (60*60*24*100));
      lang.settimemodified(@t, hundreddays);
      local (tm = lang.timemodified(@t));
      return (tm - hundreddays) < 2
    expected_success: true
    expected_result: "true"

  - name: "lang.settimemodified - returns boolean true"
    description: "settimemodified should return true on success"
    script: |
      lang.new(tableType, @t);
      return lang.settimemodified(@t, clock.now() - 5000)
    expected_success: true
    expected_result: "true"

  - name: "lang.settimemodified - custom timestamp persists"
    description: "Set custom timestamp and verify it persists"
    script: |
      lang.new(tableType, @t);
      local (customtime = 2000000000);
      lang.settimemodified(@t, customtime);
      return lang.timemodified(@t) == customtime
    expected_success: true
    expected_result: "true"

  - name: "lang.settimemodified - independent of timecreated"
    description: "Setting timemodified should not affect timecreated"
    script: |
      lang.new(tableType, @t);
      local (tc = lang.timecreated(@t));
      lang.settimemodified(@t, clock.now() - 100000);
      return lang.timecreated(@t) == tc
    expected_success: true
    expected_result: "true"

  - name: "lang.settimemodified - no parameters"
    description: "Parameter validation: missing parameters should fail"
    script: 'lang.settimemodified()'
    expected_success: false
    expected_error_type: "script_error"

  - name: "lang.settimemodified - one parameter only"
    description: "Parameter validation: need both address and date"
    script: |
      lang.new(tableType, @t);
      lang.settimemodified(@t)
    expected_success: false
    expected_error_type: "script_error"

  # ====================================================================
  # Phase 5: Type Conversion Verbs (15 verbs)
  # ====================================================================

  # lang.boolean - Convert to boolean type
  - name: "lang.boolean - integer 1 to true"
    description: "Convert non-zero integer to boolean true"
    script: 'typeof(lang.boolean(1))'
    expected_success: true
    expected_result: "bool"

  - name: "lang.boolean - integer 0 to false"
    description: "Convert zero to boolean false"
    script: 'typeof(lang.boolean(0))'
    expected_success: true
    expected_result: "bool"

  - name: "lang.boolean - string 'true'"
    description: "Convert string 'true' to boolean"
    script: 'typeof(lang.boolean("true"))'
    expected_success: true
    expected_result: "bool"

  - name: "lang.boolean - string 'false'"
    description: "Convert string 'false' to boolean"
    script: 'typeof(lang.boolean("false"))'
    expected_success: true
    expected_result: "bool"

  - name: "lang.boolean - no parameters"
    description: "Parameter validation: missing parameter should fail"
    script: 'lang.boolean()'
    expected_success: false
    expected_error_type: "script_error"

  # lang.char - Convert to character type
  - name: "lang.char - integer to char"
    description: "Convert ASCII value to character"
    script: 'typeof(lang.char(65))'
    expected_success: true
    expected_result: "char"

  - name: "lang.char - string to char"
    description: "Convert single character string to char"
    script: 'typeof(lang.char("H"))'
    expected_success: true
    expected_result: "char"

  - name: "lang.char - no parameters"
    description: "Parameter validation: missing parameter should fail"
    script: 'lang.char()'
    expected_success: false
    expected_error_type: "script_error"

  # lang.short - Convert to short integer (64-bit, equivalent to long)
  - name: "lang.short - integer conversion"
    description: "Convert integer to short (returns 64-bit long type)"
    script: 'lang.short(42)'
    expected_success: true
    expected_result: "42"

  - name: "lang.short - typeof returns long"
    description: "Verify lang.short returns long type (64-bit internally)"
    script: 'typeof(lang.short(100))'
    expected_success: true
    expected_result: "long"

  - name: "lang.short - double to short"
    description: "Convert double to short (truncates decimals)"
    script: 'lang.short(42.9)'
    expected_success: true
    expected_result: "42"

  - name: "lang.short - string to short"
    description: "Convert numeric string to short"
    script: 'lang.short("9999")'
    expected_success: true
    expected_result: "9999"

  - name: "lang.short - negative value"
    description: "Convert negative number to short"
