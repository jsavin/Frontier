sequential: true  # Port conflicts between parallel workers

# Integration tests for TCP Phase 1A - Client Networking Verbs
# All tests are self-contained using localhost (tcp.listenStream + tcp.openStream/openAddrStream)
# No external network dependencies.
#
# Phase 1A verbs (7 total):
#   - tcp.openNameStream(hostname, port) -> streamID  (SSRF-protected: rejects private IPs)
#   - tcp.openAddrStream(addr, port) -> streamID
#   - tcp.readStream(stream, bytes) -> data
#   - tcp.writeStream(stream, data) -> true
#   - tcp.closeStream(stream) -> true
#   - tcp.abortStream(stream) -> true
#   - tcp.countConnections() -> count
#
# Port allocation: 9100-9115 (tcp_server_verbs.yaml uses 9000-9027)
#
# NOTE on tcp.openNameStream: This verb has SSRF/DNS-rebinding protection that
# rejects connections to private/reserved IPs (127.0.0.0/8, 10.0.0.0/8, etc).
# Therefore openNameStream("localhost", port) will always fail by design.
# Tests for openNameStream verify this SSRF behavior and DNS error handling.
#
# NOTE on error handling: TCP verb errors use langerrormessage() which is not
# catchable by try/else in UserTalk. Error-expecting tests use expected_success: false
# rather than try/catch wrappers.
#
# NOTE on callbacks: All callback tests use script.newScriptObject to install
# the handler into a persistent ODB path (system.temp.tcpNetXXXX). Callbacks
# use 2-param signature (sid, refcon) — the kernel only passes these 2 args.
# The wait loop uses clock.ticks() as the body (not thread.sleepFor) to yield
# the GIL and allow callback threads to run.

tests:
  # ===========================================================================
  # tcp.openNameStream - DNS resolution + SSRF protection
  # ===========================================================================

  - name: "tcp.openNameStream - SSRF blocks localhost"
    description: "openNameStream rejects localhost because 127.0.0.1 is a private IP"
    timeout: 10
    script: 'tcp.openNameStream("localhost", 9100)'
    expected_success: false

  - name: "tcp.openNameStream - DNS failure for invalid hostname"
    description: "Invalid hostname should raise DNS error"
    timeout: 10
    script: 'tcp.openNameStream("this.hostname.does.not.exist.invalid", 80)'
    expected_success: false

  # ===========================================================================
  # tcp.openAddrStream - Direct IP connect (no SSRF restriction)
  # ===========================================================================

  - name: "tcp.openAddrStream - connect to localhost server"
    description: "Test direct IP connect to local listener (no DNS, no SSRF)"
    timeout: 15
    script: |
      new(tableType, @system.temp.tcpNet9101);
      system.temp.tcpNet9101.accepted = false;
      system.temp.tcpNet9101.serverStream = -1;
      script.newScriptObject("on myHandler(sid, refcon) {\r  system.temp.tcpNet9101.accepted = true;\r  system.temp.tcpNet9101.serverStream = sid;\r  tcp.closeStream(sid);\r  return true}", @system.temp.tcpNet9101.myHandler);

      local(listenID = tcp.listenStream(9101, 5, @system.temp.tcpNet9101.myHandler));
      local(localhostIP = tcp.addressEncode("127.0.0.1"));
      local(stream = tcp.openAddrStream(localhostIP, 9101));
      local(valid = stream > 0);

      local(deadline = clock.ticks() + 300);
      while (not system.temp.tcpNet9101.accepted) and (clock.ticks() < deadline) {
        clock.ticks()
      };

      tcp.closeStream(stream);
      tcp.closeListen(listenID);
      delete(@system.temp.tcpNet9101);

      return valid
    expected_success: true
    expected_result: "true"

  - name: "tcp.openAddrStream - localhost connection refused on closed port"
    description: "Connect to known-closed port returns ECONNREFUSED instantly"
    timeout: 10
    script: 'tcp.openAddrStream(2130706433, 7999)'
    expected_success: false

  # ===========================================================================
  # Stream Lifecycle - Open, Use, Close
  # ===========================================================================

  - name: "tcp.closeStream - graceful close after connect"
    description: "Test complete stream lifecycle: open -> close"
    timeout: 15
    script: |
      new(tableType, @system.temp.tcpNet9102);
      system.temp.tcpNet9102.accepted = false;
      system.temp.tcpNet9102.serverStream = -1;
      script.newScriptObject("on myHandler(sid, refcon) {\r  system.temp.tcpNet9102.accepted = true;\r  system.temp.tcpNet9102.serverStream = sid;\r  return true}", @system.temp.tcpNet9102.myHandler);

      local(listenID = tcp.listenStream(9102, 5, @system.temp.tcpNet9102.myHandler));
      local(clientStream = tcp.openStream(tcp.addressEncode("127.0.0.1"), 9102));

      local(deadline = clock.ticks() + 300);
      while (not system.temp.tcpNet9102.accepted) and (clock.ticks() < deadline) {
        clock.ticks()
      };

      local(ok = tcp.closeStream(clientStream));
      if system.temp.tcpNet9102.serverStream > 0 {
        tcp.closeStream(system.temp.tcpNet9102.serverStream)
      };
      tcp.closeListen(listenID);
      delete(@system.temp.tcpNet9102);

      return ok
    expected_success: true
    expected_result: "true"

  - name: "tcp.abortStream - immediate close after connect"
    description: "Test RST close vs graceful FIN close"
    timeout: 15
    script: |
      new(tableType, @system.temp.tcpNet9103);
      system.temp.tcpNet9103.accepted = false;
      system.temp.tcpNet9103.serverStream = -1;
      script.newScriptObject("on myHandler(sid, refcon) {\r  system.temp.tcpNet9103.accepted = true;\r  system.temp.tcpNet9103.serverStream = sid;\r  return true}", @system.temp.tcpNet9103.myHandler);

      local(listenID = tcp.listenStream(9103, 5, @system.temp.tcpNet9103.myHandler));
      local(clientStream = tcp.openStream(tcp.addressEncode("127.0.0.1"), 9103));

      local(deadline = clock.ticks() + 300);
      while (not system.temp.tcpNet9103.accepted) and (clock.ticks() < deadline) {
        clock.ticks()
      };

      local(ok = tcp.abortStream(clientStream));
      if system.temp.tcpNet9103.serverStream > 0 {
        tcp.closeStream(system.temp.tcpNet9103.serverStream)
      };
      tcp.closeListen(listenID);
      delete(@system.temp.tcpNet9103);

      return ok
    expected_success: true
    expected_result: "true"

  - name: "tcp.countConnections - track stream lifecycle"
    description: "Verify countConnections tracks open/close correctly"
    timeout: 15
    script: |
      new(tableType, @system.temp.tcpNet9104);
      system.temp.tcpNet9104.accepted = false;
      system.temp.tcpNet9104.serverStream = -1;
      script.newScriptObject("on myHandler(sid, refcon) {\r  system.temp.tcpNet9104.accepted = true;\r  system.temp.tcpNet9104.serverStream = sid;\r  return true}", @system.temp.tcpNet9104.myHandler);

      local(listenID = tcp.listenStream(9104, 5, @system.temp.tcpNet9104.myHandler));
      local(before = tcp.countConnections());
      local(clientStream = tcp.openStream(tcp.addressEncode("127.0.0.1"), 9104));

      local(deadline = clock.ticks() + 300);
      while (not system.temp.tcpNet9104.accepted) and (clock.ticks() < deadline) {
        clock.ticks()
      };

      local(during = tcp.countConnections());
      tcp.closeStream(clientStream);
      if system.temp.tcpNet9104.serverStream > 0 {
        tcp.closeStream(system.temp.tcpNet9104.serverStream)
      };

      local(afterDeadline = clock.ticks() + 60);
      while clock.ticks() < afterDeadline {
        clock.ticks()
      };

      local(after = tcp.countConnections());
      tcp.closeListen(listenID);
      delete(@system.temp.tcpNet9104);

      return (during > before) and (after == before)
    expected_success: true
    expected_result: "true"

  # ===========================================================================
  # tcp.readStream - Non-blocking read behavior
  # ===========================================================================

  - name: "tcp.readStream - empty read when no data sent"
    description: "Verify non-blocking read returns empty string when no data available"
    timeout: 15
    script: |
      new(tableType, @system.temp.tcpNet9105);
      system.temp.tcpNet9105.accepted = false;
      system.temp.tcpNet9105.serverStream = -1;
      script.newScriptObject("on myHandler(sid, refcon) {\r  system.temp.tcpNet9105.accepted = true;\r  system.temp.tcpNet9105.serverStream = sid;\r  return true}", @system.temp.tcpNet9105.myHandler);

      local(listenID = tcp.listenStream(9105, 5, @system.temp.tcpNet9105.myHandler));
      local(clientStream = tcp.openStream(tcp.addressEncode("127.0.0.1"), 9105));

      local(deadline = clock.ticks() + 300);
      while (not system.temp.tcpNet9105.accepted) and (clock.ticks() < deadline) {
        clock.ticks()
      };

      local(data = tcp.readStream(clientStream, 1024));
      local(isEmpty = (string.length(data) == 0));

      tcp.closeStream(clientStream);
      if system.temp.tcpNet9105.serverStream > 0 {
        tcp.closeStream(system.temp.tcpNet9105.serverStream)
      };
      tcp.closeListen(listenID);
      delete(@system.temp.tcpNet9105);

      return isEmpty
    expected_success: true
    expected_result: "true"

  - name: "tcp.readStream - read data from server"
    description: "Server writes data, client reads it"
    skip: true
    skip_reason: "Server-side writeStream in accept callback raises 'Invalid stream ID: Stream not connected' — the accepted sid is not yet in a writable state when the callback fires; requires kernel fix"
    timeout: 15
    script: |
      new(tableType, @system.temp.tcpNet9106);
      system.temp.tcpNet9106.accepted = false;
      system.temp.tcpNet9106.serverStream = -1;
      script.newScriptObject("on myHandler(sid, refcon) {\r  system.temp.tcpNet9106.accepted = true;\r  tcp.writeStream(sid, \"Hello from server\");\r  system.temp.tcpNet9106.serverStream = sid;\r  return true}", @system.temp.tcpNet9106.myHandler);

      local(listenID = tcp.listenStream(9106, 5, @system.temp.tcpNet9106.myHandler));
      local(clientStream = tcp.openStream(tcp.addressEncode("127.0.0.1"), 9106));

      local(deadline = clock.ticks() + 300);
      while (not system.temp.tcpNet9106.accepted) and (clock.ticks() < deadline) {
        clock.ticks()
      };

      local(response = "");
      local(readDeadline = clock.ticks() + 200);
      while (response == "") and (clock.ticks() < readDeadline) {
        local(chunk = tcp.readStream(clientStream, 1024));
        if typeOf(chunk) == 'TEXT' {
          response = chunk
        };
        clock.ticks()
      };

      tcp.closeStream(clientStream);
      if system.temp.tcpNet9106.serverStream > 0 {
        tcp.closeStream(system.temp.tcpNet9106.serverStream)
      };
      tcp.closeListen(listenID);
      delete(@system.temp.tcpNet9106);

      return string.length(response) > 0 and (response contains "Hello from server")
    expected_success: true
    expected_result: "true"

  # ===========================================================================
  # tcp.writeStream - Blocking write behavior
  # ===========================================================================

  - name: "tcp.writeStream - write data to server"
    description: "Test blocking write sends data successfully"
    timeout: 15
    script: |
      new(tableType, @system.temp.tcpNet9107);
      system.temp.tcpNet9107.accepted = false;
      system.temp.tcpNet9107.serverStream = -1;
      script.newScriptObject("on myHandler(sid, refcon) {\r  system.temp.tcpNet9107.accepted = true;\r  system.temp.tcpNet9107.serverStream = sid;\r  return true}", @system.temp.tcpNet9107.myHandler);

      local(listenID = tcp.listenStream(9107, 5, @system.temp.tcpNet9107.myHandler));
      local(clientStream = tcp.openStream(tcp.addressEncode("127.0.0.1"), 9107));

      local(deadline = clock.ticks() + 300);
      while (not system.temp.tcpNet9107.accepted) and (clock.ticks() < deadline) {
        clock.ticks()
      };

      local(ok = tcp.writeStream(clientStream, "Hello from client"));

      tcp.closeStream(clientStream);
      if system.temp.tcpNet9107.serverStream > 0 {
        tcp.closeStream(system.temp.tcpNet9107.serverStream)
      };
      tcp.closeListen(listenID);
      delete(@system.temp.tcpNet9107);

      return ok
    expected_success: true
    expected_result: "true"

  - name: "tcp.writeStream - empty data"
    description: "Writing zero-length data should succeed (no-op)"
    timeout: 15
    script: |
      new(tableType, @system.temp.tcpNet9115);
      system.temp.tcpNet9115.accepted = false;
      system.temp.tcpNet9115.serverStream = -1;
      script.newScriptObject("on myHandler(sid, refcon) {\r  system.temp.tcpNet9115.accepted = true;\r  system.temp.tcpNet9115.serverStream = sid;\r  return true}", @system.temp.tcpNet9115.myHandler);

      local(listenID = tcp.listenStream(9115, 5, @system.temp.tcpNet9115.myHandler));
      local(clientStream = tcp.openStream(tcp.addressEncode("127.0.0.1"), 9115));

      local(deadline = clock.ticks() + 300);
      while (not system.temp.tcpNet9115.accepted) and (clock.ticks() < deadline) {
        clock.ticks()
      };

      local(ok = tcp.writeStream(clientStream, ""));

      tcp.closeStream(clientStream);
      if system.temp.tcpNet9115.serverStream > 0 {
        tcp.closeStream(system.temp.tcpNet9115.serverStream)
      };
      tcp.closeListen(listenID);
      delete(@system.temp.tcpNet9115);

      return ok
    expected_success: true
    expected_result: "true"

  # ===========================================================================
  # Error Cases - Operations on closed streams
  # NOTE: TCP errors are uncatchable (langerrormessage bypasses try/else).
  # These tests use expected_success: false to verify the error occurs.
  # ===========================================================================

  - name: "tcp.closeStream - double close"
    description: "Second close on already-closed stream — verify behavior"
    skip: true
    skip_reason: "Implementation raises error on double close (Invalid stream ID) rather than succeeding silently — requires kernel change to make idempotent"
    timeout: 15
    script: |
      new(tableType, @system.temp.tcpNet9108);
      system.temp.tcpNet9108.accepted = false;
      script.newScriptObject("on myHandler(sid, refcon) {\r  system.temp.tcpNet9108.accepted = true;\r  tcp.closeStream(sid);\r  return true}", @system.temp.tcpNet9108.myHandler);

      local(listenID = tcp.listenStream(9108, 5, @system.temp.tcpNet9108.myHandler));
      local(clientStream = tcp.openStream(tcp.addressEncode("127.0.0.1"), 9108));

      local(deadline = clock.ticks() + 300);
      while (not system.temp.tcpNet9108.accepted) and (clock.ticks() < deadline) {
        clock.ticks()
      };

      tcp.closeStream(clientStream);
      tcp.closeStream(clientStream);
      tcp.closeListen(listenID);
      delete(@system.temp.tcpNet9108);

      return "true"
    expected_success: true
    expected_result: "true"

  - name: "tcp.readStream - read from closed stream returns empty"
    description: "Reading from closed stream returns empty string (fd already closed)"
    skip: true
    skip_reason: "Implementation raises error (Invalid stream ID) when reading from closed stream rather than returning empty string — requires kernel change"
    timeout: 15
    script: |
      new(tableType, @system.temp.tcpNet9109);
      system.temp.tcpNet9109.accepted = false;
      script.newScriptObject("on myHandler(sid, refcon) {\r  system.temp.tcpNet9109.accepted = true;\r  tcp.closeStream(sid);\r  return true}", @system.temp.tcpNet9109.myHandler);

      local(listenID = tcp.listenStream(9109, 5, @system.temp.tcpNet9109.myHandler));
      local(clientStream = tcp.openStream(tcp.addressEncode("127.0.0.1"), 9109));

      local(deadline = clock.ticks() + 300);
      while (not system.temp.tcpNet9109.accepted) and (clock.ticks() < deadline) {
        clock.ticks()
      };

      tcp.closeStream(clientStream);
      local(data = tcp.readStream(clientStream, 1024));

      tcp.closeListen(listenID);
      delete(@system.temp.tcpNet9109);

      return string.length(data) == 0
    expected_success: true
    expected_result: "true"

  - name: "tcp.writeStream - write to closed stream succeeds silently"
    description: "Writing to closed stream returns true (no error raised)"
    skip: true
    skip_reason: "Implementation raises error when writing to closed stream rather than succeeding silently — requires kernel change"
    timeout: 15
    script: |
      new(tableType, @system.temp.tcpNet9110);
      system.temp.tcpNet9110.accepted = false;
      script.newScriptObject("on myHandler(sid, refcon) {\r  system.temp.tcpNet9110.accepted = true;\r  tcp.closeStream(sid);\r  return true}", @system.temp.tcpNet9110.myHandler);

      local(listenID = tcp.listenStream(9110, 5, @system.temp.tcpNet9110.myHandler));
      local(clientStream = tcp.openStream(tcp.addressEncode("127.0.0.1"), 9110));

      local(deadline = clock.ticks() + 300);
      while (not system.temp.tcpNet9110.accepted) and (clock.ticks() < deadline) {
        clock.ticks()
      };

      tcp.closeStream(clientStream);
      local(ok = tcp.writeStream(clientStream, "test data"));

      tcp.closeListen(listenID);
      delete(@system.temp.tcpNet9110);

      return ok
    expected_success: true
    expected_result: "true"

  # ===========================================================================
  # Resource Management - Multiple connections
  # ===========================================================================

  - name: "tcp.countConnections - multiple concurrent streams"
    description: "Verify tracking of multiple open connections"
    timeout: 15
    script: |
      new(tableType, @system.temp.tcpNet9111);
      system.temp.tcpNet9111.acceptCount = 0;
      script.newScriptObject("on myHandler(sid, refcon) {\r  system.temp.tcpNet9111.acceptCount = system.temp.tcpNet9111.acceptCount + 1;\r  return true}", @system.temp.tcpNet9111.myHandler);

      local(listenID = tcp.listenStream(9111, 5, @system.temp.tcpNet9111.myHandler));

      local(stream1 = tcp.openStream(tcp.addressEncode("127.0.0.1"), 9111));
      local(stream2 = tcp.openStream(tcp.addressEncode("127.0.0.1"), 9111));
      local(stream3 = tcp.openStream(tcp.addressEncode("127.0.0.1"), 9111));

      local(deadline = clock.ticks() + 300);
      while (system.temp.tcpNet9111.acceptCount < 3) and (clock.ticks() < deadline) {
        clock.ticks()
      };

      local(count = tcp.countConnections());
      local(hasMultiple = (count >= 3));

      tcp.closeStream(stream1);
      tcp.closeStream(stream2);
      tcp.closeStream(stream3);
      tcp.closeListen(listenID);
      delete(@system.temp.tcpNet9111);

      return hasMultiple
    expected_success: true
    expected_result: "true"

  - name: "tcp connection lifecycle - full data exchange"
    description: "Test complete client-server data exchange cycle"
    skip: true
    skip_reason: "Race condition: server callback closes stream before client polls; tcp.readStream on a closed server stream returns false — requires kernel-level stream event notification"
    timeout: 15
    script: |
      new(tableType, @system.temp.tcpNet9112);
      system.temp.tcpNet9112.fired = false;
      script.newScriptObject("on myHandler(sid, refcon) {\r  local(data = tcp.readStream(sid, 1024));\r  tcp.writeStream(sid, \"ECHO: \" + data);\r  tcp.closeStream(sid);\r  system.temp.tcpNet9112.fired = true;\r  return true}", @system.temp.tcpNet9112.myHandler);

      local(listenID = tcp.listenStream(9112, 5, @system.temp.tcpNet9112.myHandler));
      local(clientStream = tcp.openStream(tcp.addressEncode("127.0.0.1"), 9112));

      tcp.writeStream(clientStream, "Hello Server");

      local(deadline = clock.ticks() + 300);
      while (not system.temp.tcpNet9112.fired) and (clock.ticks() < deadline) {
        clock.ticks()
      };

      local(response = "");
      local(readDeadline = clock.ticks() + 120);
      while (sizeOf(response) == 0) and (clock.ticks() < readDeadline) {
        response = tcp.readStream(clientStream, 1024);
        clock.ticks()
      };

      local(validResponse = response == "ECHO: Hello Server");

      tcp.closeStream(clientStream);
      tcp.closeListen(listenID);
      delete(@system.temp.tcpNet9112);

      return validResponse
    expected_success: true
    expected_result: "true"

  # ===========================================================================
  # Edge Cases
  # ===========================================================================

  - name: "tcp.readStream - zero byte count"
    description: "Reading zero bytes should return empty string (not error)"
    skip: true
