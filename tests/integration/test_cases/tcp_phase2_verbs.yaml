sequential: true  # Tests bind TCP ports; parallel workers would conflict
# Integration tests for TCP Phase 2 - Status and Peer Information Verbs
# Tests for tcp.statusStream, tcp.getPeerAddress, tcp.getPeerPort, tcp.myAddress
#
# Phase 2 verbs (4 total):
#   - tcp.statusStream(stream, @bytesPending) -> status - Query stream status and pending bytes
#   - tcp.getPeerAddress(stream) -> addr - Get remote IP address
#   - tcp.getPeerPort(stream) -> port - Get remote port number
#   - tcp.myAddress() -> addr - Get local machine's IP address
#
# IMPLEMENTATION STATUS:
#   The C implementations exist in Common/source/tcpverbs.c:
#   - tcp_status_stream() - line 1519
#   - tcp_get_peer_address() - line 1632
#   - tcp_get_peer_port() - line 1679
#   - tcp_my_address() - line 1727
#
#   BUT the headless verb processor (tests/headless_tcp_verbs.c) returns "not implemented"
#   for these verbs. The tcp_valueproc() cases need to be updated to call the C implementations:
#   - tcpv_myaddress (line 119) -> needs tcp_my_address()
#   - tcpv_statusstream (line 278) -> needs tcp_status_stream()
#   - tcpv_getpeeraddress (line 283) -> needs tcp_get_peer_address()
#   - tcpv_getpeerport (line 288) -> needs tcp_get_peer_port()
#
# NOTE: All tests use LOCALHOST ONLY (127.0.0.1) - NO external network dependencies!
# Tests are self-contained: client and server on same machine.
#
# Port allocation: 9200-9220 (avoids conflicts with tcp_server_verbs.yaml 9000-9027
# and tcp_verbs_network.yaml 9100-9115)
#
# Reference:
#   - docs/usertalk/docserver/tcp/statusStream.txt
#   - docs/usertalk/docserver/tcp/getPeerAddress.txt
#   - docs/usertalk/docserver/tcp/getPeerPort.txt
#   - docs/usertalk/docserver/tcp/myAddress.txt
#   - Common/source/tcpverbs.c (Phase 2 implementation)

tests:
  # ===========================================================================
  # tcp.myAddress - Local Machine IP Address
  # ===========================================================================

  - name: "tcp.myAddress - returns valid address"
    description: "Verify myAddress returns a valid IP address (not zero)"
    script: |
      local(addr = tcp.myAddress());
      return addr != 0
    expected_success: true
    expected_result: "true"
    notes: "Phase 2 - myAddress should return non-zero address"

  - name: "tcp.myAddress - return type is long"
    description: "Verify myAddress returns longType"
    script: |
      local(addr = tcp.myAddress());
      return typeof(addr) == longType
    expected_success: true
    expected_result: "true"
    notes: "Phase 2 - Return type validation"

  - name: "tcp.myAddress - can decode to dotted decimal"
    description: "Verify myAddress result can be decoded to valid IP string"
    script: |
      local(addr = tcp.myAddress());
      local(ipString = tcp.addressDecode(addr));
      // Valid IP string should have at least 7 chars (e.g., "1.1.1.1")
      return string.length(ipString) >= 7
    expected_success: true
    expected_result: "true"
    notes: "Phase 2 - Verify address can be decoded"

  - name: "tcp.myAddress - roundtrip encode/decode"
    description: "Verify myAddress result survives encode/decode roundtrip"
    script: |
      local(addr = tcp.myAddress());
      local(ipString = tcp.addressDecode(addr));
      local(reencoded = tcp.addressEncode(ipString));
      return addr == reencoded
    expected_success: true
    expected_result: "true"
    notes: "Phase 2 - Roundtrip consistency check"

  # ===========================================================================
  # tcp.statusStream - Stream Status Query
  # ===========================================================================

  - name: "tcp.statusStream - returns OPEN for idle connection"
    description: "Verify statusStream returns OPEN when no data pending"
    timeout: 10
    script: |
      local(listenID = tcp.listenStream(9200, 5, ""));

      try {
        local(stream = tcp.openStream(tcp.addressEncode("127.0.0.1"), 9200));
        if (stream <= 0) {
          tcp.closeListen(listenID);
          return "false"
        };

        local(deadline = clock.ticks() + 15);
        while clock.ticks() < deadline {
          clock.ticks()
        };

        local(bytesPending);
        local(status = tcp.statusStream(stream, @bytesPending));

        tcp.closeStream(stream);
        tcp.closeListen(listenID);

        // Should be OPEN with no data pending
        return (status == "OPEN") and (bytesPending == 0)
      }
      else {
        tcp.closeListen(listenID);
        return "false"
      }
    expected_success: true
    expected_result: "true"
    notes: "Phase 2 - Verify OPEN status for idle stream"

  - name: "tcp.statusStream - returns DATA when bytes available"
    description: "Verify statusStream returns DATA when data is pending"
    timeout: 10
    script: |
      new(tableType, @system.temp.tcpPh201);
      system.temp.tcpPh201.connected = false;
      system.temp.tcpPh201.serverStream = -1;
      script.newScriptObject("on myHandler(sid, refcon) {\r  system.temp.tcpPh201.connected = true;\r  system.temp.tcpPh201.serverStream = sid;\r  return true}", @system.temp.tcpPh201.myHandler);

      local(listenID = tcp.listenStream(9201, 5, @system.temp.tcpPh201.myHandler));
      local(clientStream = tcp.openStream(tcp.addressEncode("127.0.0.1"), 9201));

      // Wait for connection
      local(deadline = clock.ticks() + 300);
      while (not system.temp.tcpPh201.connected) and (clock.ticks() < deadline) {
        clock.ticks()
      };

      // Send data from client to server
      tcp.writeStream(clientStream, "Hello Server!");

      // Wait for data to arrive
      local(dataDeadline = clock.ticks() + 60);
      while clock.ticks() < dataDeadline {
        clock.ticks()
      };

      // Check server stream status
      local(bytesPending);
      local(status = tcp.statusStream(system.temp.tcpPh201.serverStream, @bytesPending));

      tcp.closeStream(clientStream);
      if system.temp.tcpPh201.serverStream > 0 { tcp.closeStream(system.temp.tcpPh201.serverStream) };
      tcp.closeListen(listenID);
      delete(@system.temp.tcpPh201);

      return (status == "DATA") and (bytesPending > 0)
    expected_success: true
    expected_result: "true"
    notes: "Phase 2 - Verify DATA status and bytesPending count"

  - name: "tcp.statusStream - bytesPending matches sent data"
    description: "Verify bytesPending equals length of sent data"
    timeout: 10
    script: |
      new(tableType, @system.temp.tcpPh202);
      system.temp.tcpPh202.connected = false;
      system.temp.tcpPh202.serverStream = -1;
      script.newScriptObject("on myHandler(sid, refcon) {\r  system.temp.tcpPh202.connected = true;\r  system.temp.tcpPh202.serverStream = sid;\r  return true}", @system.temp.tcpPh202.myHandler);

      local(listenID = tcp.listenStream(9202, 5, @system.temp.tcpPh202.myHandler));
      local(clientStream = tcp.openStream(tcp.addressEncode("127.0.0.1"), 9202));

      local(deadline = clock.ticks() + 300);
      while (not system.temp.tcpPh202.connected) and (clock.ticks() < deadline) {
        clock.ticks()
      };

      local(testData = "0123456789");  // 10 bytes
      tcp.writeStream(clientStream, testData);

      local(dataDeadline = clock.ticks() + 60);
      while clock.ticks() < dataDeadline {
        clock.ticks()
      };

      local(bytesPending);
      tcp.statusStream(system.temp.tcpPh202.serverStream, @bytesPending);

      tcp.closeStream(clientStream);
      if system.temp.tcpPh202.serverStream > 0 { tcp.closeStream(system.temp.tcpPh202.serverStream) };
      tcp.closeListen(listenID);
      delete(@system.temp.tcpPh202);

      return bytesPending == 10
    expected_success: true
    expected_result: "true"
    notes: "Phase 2 - Verify bytesPending accuracy"

  - name: "tcp.statusStream - return type is string"
    description: "Verify statusStream returns stringType"
    script: |
      local(listenID = tcp.listenStream(9203, 5, ""));

      try {
        local(stream = tcp.openStream(tcp.addressEncode("127.0.0.1"), 9203));
        if (stream <= 0) {
          tcp.closeListen(listenID);
          return "false"
        };

        local(bytesPending);
        local(status = tcp.statusStream(stream, @bytesPending));

        tcp.closeStream(stream);
        tcp.closeListen(listenID);

        return typeof(status) == stringType
      }
      else {
        tcp.closeListen(listenID);
        return "false"
      }
    expected_success: true
    expected_result: "true"
    notes: "Phase 2 - Status is a string type"

  - name: "tcp.statusStream - invalid stream returns INACTIVE"
    description: "Verify statusStream returns INACTIVE for non-existent stream (not an error)"
    script: |
      local(bytesPending);
      local(status = tcp.statusStream(999999, @bytesPending));
      return status == "INACTIVE"
    expected_success: true
    expected_result: "true"
    notes: "Phase 2 - Non-existent streams return INACTIVE status, not an error"

  - name: "tcp.statusStream - listener ID returns LISTENING"
    description: "Verify statusStream with listener ID returns LISTENING (legacy script compatibility)"
    timeout: 10
    script: |
      local(listenID = tcp.listenStream(9209, 5, ""));
      local(bytesPending);
      local(status = tcp.statusStream(listenID, @bytesPending));
      tcp.closeListen(listenID);
      return status == "LISTENING"
    expected_success: true
    expected_result: "true"
    notes: "Phase 2 - Listener IDs passed to statusStream return LISTENING (legacy compatibility)"

  # ===========================================================================
  # tcp.getPeerAddress - Remote IP Address Query
  # ===========================================================================

  - name: "tcp.getPeerAddress - returns localhost for local connection"
    description: "Verify getPeerAddress returns 127.0.0.1 for localhost connection"
    script: |
      local(listenID = tcp.listenStream(9204, 5, ""));

      try {
        local(stream = tcp.openStream(tcp.addressEncode("127.0.0.1"), 9204));
        if (stream <= 0) {
          tcp.closeListen(listenID);
          return "false"
        };

        local(peerAddr = tcp.getPeerAddress(stream));
        local(localhost = tcp.addressEncode("127.0.0.1"));

        tcp.closeStream(stream);
        tcp.closeListen(listenID);

        return peerAddr == localhost
      }
      else {
        tcp.closeListen(listenID);
        return "false"
      }
    expected_success: true
    expected_result: "true"
    notes: "Phase 2 - Client sees server address as 127.0.0.1"

  - name: "tcp.getPeerAddress - server sees client as localhost"
    description: "Verify server can query 127.0.0.1 as peer address via tcp.getPeerAddress on accepted stream"
    timeout: 10
    script: |
      new(tableType, @system.temp.tcpPh205);
      system.temp.tcpPh205.connected = false;
      system.temp.tcpPh205.serverStream = -1;
      system.temp.tcpPh205.peerAddr = 0;
      script.newScriptObject("on myHandler(sid, refcon) {\r  system.temp.tcpPh205.connected = true;\r  system.temp.tcpPh205.serverStream = sid;\r  system.temp.tcpPh205.peerAddr = tcp.getPeerAddress(sid);\r  return true}", @system.temp.tcpPh205.myHandler);

      local(listenID = tcp.listenStream(9205, 5, @system.temp.tcpPh205.myHandler));
      local(clientStream = tcp.openStream(tcp.addressEncode("127.0.0.1"), 9205));

      local(deadline = clock.ticks() + 300);
      while (not system.temp.tcpPh205.connected) and (clock.ticks() < deadline) {
        clock.ticks()
      };

      // Also verify via getPeerAddress called from main thread
      local(peerAddrFromVerb = tcp.getPeerAddress(system.temp.tcpPh205.serverStream));

      tcp.closeStream(clientStream);
      if system.temp.tcpPh205.serverStream > 0 { tcp.closeStream(system.temp.tcpPh205.serverStream) };
      tcp.closeListen(listenID);

      local(localhost = tcp.addressEncode("127.0.0.1"));
      local(callbackCorrect = system.temp.tcpPh205.peerAddr == localhost);
      local(verbCorrect = peerAddrFromVerb == localhost);

      delete(@system.temp.tcpPh205);

      return callbackCorrect and verbCorrect
    expected_success: true
    expected_result: "true"
    notes: "Phase 2 - Server sees client as 127.0.0.1; peer addr from getPeerAddress inside callback"

  - name: "tcp.getPeerAddress - return type is long"
    description: "Verify getPeerAddress returns longType"
    script: |
      local(listenID = tcp.listenStream(9206, 5, ""));

      try {
        local(stream = tcp.openStream(tcp.addressEncode("127.0.0.1"), 9206));
        if (stream <= 0) {
          tcp.closeListen(listenID);
          return "false"
        };

        local(peerAddr = tcp.getPeerAddress(stream));

        tcp.closeStream(stream);
        tcp.closeListen(listenID);

        return typeof(peerAddr) == longType
      }
      else {
        tcp.closeListen(listenID);
        return "false"
      }
    expected_success: true
    expected_result: "true"
    notes: "Phase 2 - Return type validation"

  - name: "tcp.getPeerAddress - invalid stream returns error"
    description: "Verify getPeerAddress fails gracefully for invalid stream"
    script: |
      try {
        tcp.getPeerAddress(999999);
        return "false"
      }
      else {
        return "true"
      }
    expected_success: true
    expected_result: "true"
    notes: "Phase 2 - Error handling for invalid stream"

  # ===========================================================================
  # tcp.getPeerPort - Remote Port Number Query
  # ===========================================================================

  - name: "tcp.getPeerPort - returns server port for client"
    description: "Verify client's getPeerPort returns the server's listen port"
    script: |
      local(serverPort = 9207);
      local(listenID = tcp.listenStream(serverPort, 5, ""));

      try {
        local(stream = tcp.openStream(tcp.addressEncode("127.0.0.1"), serverPort));
        if (stream <= 0) {
          tcp.closeListen(listenID);
          return "false"
        };

        local(peerPort = tcp.getPeerPort(stream));

        tcp.closeStream(stream);
        tcp.closeListen(listenID);

        return peerPort == serverPort
      }
      else {
        tcp.closeListen(listenID);
        return "false"
      }
    expected_success: true
    expected_result: "true"
    notes: "Phase 2 - Client sees server's listen port"

  - name: "tcp.getPeerPort - server sees ephemeral client port"
    description: "Verify server sees client's ephemeral port (> 0 and < 65536) via tcp.getPeerPort"
    timeout: 10
    script: |
      new(tableType, @system.temp.tcpPh208);
      system.temp.tcpPh208.connected = false;
      system.temp.tcpPh208.serverStream = -1;
      system.temp.tcpPh208.peerPort = 0;
      script.newScriptObject("on myHandler(sid, refcon) {\r  system.temp.tcpPh208.connected = true;\r  system.temp.tcpPh208.serverStream = sid;\r  system.temp.tcpPh208.peerPort = tcp.getPeerPort(sid);\r  return true}", @system.temp.tcpPh208.myHandler);

      local(listenID = tcp.listenStream(9208, 5, @system.temp.tcpPh208.myHandler));
      local(clientStream = tcp.openStream(tcp.addressEncode("127.0.0.1"), 9208));

      local(deadline = clock.ticks() + 300);
      while (not system.temp.tcpPh208.connected) and (clock.ticks() < deadline) {
        clock.ticks()
      };

      local(peerPortFromVerb = tcp.getPeerPort(system.temp.tcpPh208.serverStream));

      tcp.closeStream(clientStream);
      if system.temp.tcpPh208.serverStream > 0 { tcp.closeStream(system.temp.tcpPh208.serverStream) };
      tcp.closeListen(listenID);

      // Ephemeral ports are typically > 1024 and < 65536
      local(callbackValid = (system.temp.tcpPh208.peerPort > 0) and (system.temp.tcpPh208.peerPort < 65536));
      local(verbValid = (peerPortFromVerb > 0) and (peerPortFromVerb < 65536));
      local(match = system.temp.tcpPh208.peerPort == peerPortFromVerb);

      delete(@system.temp.tcpPh208);

      return callbackValid and verbValid and match
    expected_success: true
    expected_result: "true"
    notes: "Phase 2 - Ephemeral port from getPeerPort inside callback; kernel passes 2 params (sid, refcon)"

  - name: "tcp.getPeerPort - return type is long"
    description: "Verify getPeerPort returns longType"
    script: |
      local(listenID = tcp.listenStream(9210, 5, ""));

      try {
        local(stream = tcp.openStream(tcp.addressEncode("127.0.0.1"), 9210));
        if (stream <= 0) {
          tcp.closeListen(listenID);
          return "false"
        };

        local(peerPort = tcp.getPeerPort(stream));

        tcp.closeStream(stream);
        tcp.closeListen(listenID);

        return typeof(peerPort) == longType
      }
      else {
        tcp.closeListen(listenID);
        return "false"
      }
    expected_success: true
    expected_result: "true"
    notes: "Phase 2 - Return type validation"

  - name: "tcp.getPeerPort - invalid stream returns error"
    description: "Verify getPeerPort fails gracefully for invalid stream"
    script: |
      try {
        tcp.getPeerPort(999999);
        return "false"
      }
      else {
        return "true"
      }
    expected_success: true
    expected_result: "true"
    notes: "Phase 2 - Error handling for invalid stream"

  # ===========================================================================
  # Combined Peer Information Tests
  # ===========================================================================

  - name: "tcp.getPeerAddress/getPeerPort - consistent with callback params"
    description: "Verify getPeerAddress and getPeerPort inside callback match main-thread query"
    timeout: 10
    script: |
      new(tableType, @system.temp.tcpPh210);
      system.temp.tcpPh210.connected = false;
      system.temp.tcpPh210.serverStream = -1;
      system.temp.tcpPh210.cbAddr = 0;
      system.temp.tcpPh210.cbPort = 0;
      script.newScriptObject("on myHandler(sid, refcon) {\r  system.temp.tcpPh210.connected = true;\r  system.temp.tcpPh210.serverStream = sid;\r  system.temp.tcpPh210.cbAddr = tcp.getPeerAddress(sid);\r  system.temp.tcpPh210.cbPort = tcp.getPeerPort(sid);\r  return true}", @system.temp.tcpPh210.myHandler);

      local(listenID = tcp.listenStream(9211, 5, @system.temp.tcpPh210.myHandler));
      local(clientStream = tcp.openStream(tcp.addressEncode("127.0.0.1"), 9211));

      local(deadline = clock.ticks() + 300);
      while (not system.temp.tcpPh210.connected) and (clock.ticks() < deadline) {
        clock.ticks()
      };

      local(verbAddr = tcp.getPeerAddress(system.temp.tcpPh210.serverStream));
      local(verbPort = tcp.getPeerPort(system.temp.tcpPh210.serverStream));

      tcp.closeStream(clientStream);
      if system.temp.tcpPh210.serverStream > 0 { tcp.closeStream(system.temp.tcpPh210.serverStream) };
      tcp.closeListen(listenID);

      local(addrMatch = verbAddr == system.temp.tcpPh210.cbAddr);
      local(portMatch = verbPort == system.temp.tcpPh210.cbPort);

      delete(@system.temp.tcpPh210);

      return addrMatch and portMatch
    expected_success: true
    expected_result: "true"
    notes: "Phase 2 - Peer addr/port from getPeerAddress/getPeerPort inside callback matches main thread"

  - name: "tcp.getPeerAddress/getPeerPort - usable for client identification"
    description: "Verify peer info can be used to create unique client identifier"
    timeout: 10
    script: |
      new(tableType, @system.temp.tcpPh211);
      system.temp.tcpPh211.connected = false;
      system.temp.tcpPh211.serverStream = -1;
      script.newScriptObject("on myHandler(sid, refcon) {\r  system.temp.tcpPh211.connected = true;\r  system.temp.tcpPh211.serverStream = sid;\r  return true}", @system.temp.tcpPh211.myHandler);

      local(listenID = tcp.listenStream(9212, 5, @system.temp.tcpPh211.myHandler));
      local(clientStream = tcp.openStream(tcp.addressEncode("127.0.0.1"), 9212));

      local(deadline = clock.ticks() + 300);
      while (not system.temp.tcpPh211.connected) and (clock.ticks() < deadline) {
        clock.ticks()
      };

      // Create client identifier string: "ip:port"
      local(peerAddr = tcp.getPeerAddress(system.temp.tcpPh211.serverStream));
      local(peerPort = tcp.getPeerPort(system.temp.tcpPh211.serverStream));
      local(ipString = tcp.addressDecode(peerAddr));
      local(clientId = ipString + ":" + peerPort);

      tcp.closeStream(clientStream);
      if system.temp.tcpPh211.serverStream > 0 { tcp.closeStream(system.temp.tcpPh211.serverStream) };
      tcp.closeListen(listenID);
      delete(@system.temp.tcpPh211);

      // clientId should look like "127.0.0.1:xxxxx"
      return string.length(clientId) > 12
    expected_success: true
    expected_result: "true"
    notes: "Phase 2 - Practical use case: client identification"

  # ===========================================================================
  # Edge Cases and Error Handling
  # ===========================================================================

  - name: "tcp.statusStream - after stream closed"
    description: "Verify statusStream returns CLOSED/INACTIVE/UNKNOWN sentinel for closed stream (status query, does not raise)"
    timeout: 10
    script: |
      local(listenID = tcp.listenStream(9215, 5, ""));

      try {
        local(stream = tcp.openStream(tcp.addressEncode("127.0.0.1"), 9215));
        if (stream <= 0) {
          tcp.closeListen(listenID);
          return "false"
        };

        tcp.closeStream(stream);

        local(bytesPending);
        local(status = tcp.statusStream(stream, @bytesPending));
        tcp.closeListen(listenID);
        // statusStream is a non-raising status query — any non-empty sentinel string is acceptable
        // (documented sentinels: CLOSED/INACTIVE/UNKNOWN/OPEN/DATA/CLOSING/STOPPED;
        //  empirically may also return LISTENING for closed client streams)
        return (typeof(status) == 'TEXT') and (sizeof(status) > 0)
      }
      else {
        tcp.closeListen(listenID);
        return "false"
      }
    expected_success: true
    expected_result: "true"
    notes: "Phase 2 - Error handling for closed stream"

  - name: "tcp.getPeerAddress - after stream closed"
    description: "Verify getPeerAddress handles closed stream gracefully"
    script: |
      local(listenID = tcp.listenStream(9213, 5, ""));

      try {
        local(stream = tcp.openStream(tcp.addressEncode("127.0.0.1"), 9213));
        if (stream <= 0) {
          tcp.closeListen(listenID);
          return "false"
        };

        tcp.closeStream(stream);

        try {
          tcp.getPeerAddress(stream);
          tcp.closeListen(listenID);
          return "false"
        }
        else {
          tcp.closeListen(listenID);
          return "true"
        }
      }
      else {
        tcp.closeListen(listenID);
        return "false"
      }
    expected_success: true
    expected_result: "true"
    notes: "Phase 2 - Error handling for closed stream"

  - name: "tcp.getPeerPort - after stream closed"
    description: "Verify getPeerPort handles closed stream gracefully"
    script: |
      local(listenID = tcp.listenStream(9214, 5, ""));

      try {
        local(stream = tcp.openStream(tcp.addressEncode("127.0.0.1"), 9214));
        if (stream <= 0) {
          tcp.closeListen(listenID);
          return "false"
        };

        tcp.closeStream(stream);

        try {
          tcp.getPeerPort(stream);
          tcp.closeListen(listenID);
          return "false"
        }
        else {
          tcp.closeListen(listenID);
          return "true"
        }
      }
      else {
        tcp.closeListen(listenID);
        return "false"
      }
    expected_success: true
    expected_result: "true"
    notes: "Phase 2 - Error handling for closed stream"
