      };
      return op.level()
    expected_success: true
    expected_result: "10"

  - name: "stress test - rapid insert and delete"
    description: "Rapidly insert and delete lines"
    script: |
      lang.new(outlineType, @workspace.outline);
      target.set(@workspace.outline);
