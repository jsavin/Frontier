  # ========================================
  # Round-trip and integration tests
  # ========================================

  - name: "xml - full round trip compile/decompile"
    script: |
      local(original = "<root><person><name>John</name><age>30</age></person></root>");
      local(t);
      new(tableType, @t);
      xml.compile(original, @t);
      local(reconstructed = xml.decompile(@t));
      return (string.patternMatch("<name>John</name>", reconstructed) > 0) and (string.patternMatch("<age>30</age>", reconstructed) > 0)
    expected_output: "true"
    expected_success: true

  - name: "xml - compile then navigate with getPathAddress"
    script: |
      local(xmlText = "<config><server><host>localhost</host><port>8080</port></server></config>");
      local(t);
      new(tableType, @t);
      xml.compile(xmlText, @t);
      local(configAddr = xml.getAddress(@t, "config"));
      local(serverAddr = xml.getAddress(configAddr, "server"));
      local(hostAddr = xml.getAddress(serverAddr, "host"));
      local(portAddr = xml.getAddress(serverAddr, "port"));
      return hostAddr^ + ":" + portAddr^
    expected_output: "localhost:8080"
    expected_success: true

  - name: "xml - build structure with addTable/addValue then decompile"
    script: |
      local(root);
      new(tableType, @root);
      xml.addTable(@root, "person");
      local(personAddr = xml.getAddress(@root, "person"));
      xml.addValue(personAddr, "name", "Jane");
      xml.addValue(personAddr, "age", 25);
      local(xmlResult = xml.decompile(@root));
      return (string.patternMatch("<name>Jane</name>", xmlResult) > 0) and (string.patternMatch("<i4>25</i4>", xmlResult) > 0)
    expected_output: "true"
    expected_success: true

  - name: "xml - compile with attributes then getAttribute"
    script: |
      local(xmlText = "<root><item id=\"123\" type=\"test\">Value</item></root>");
      local(t);
      new(tableType, @t);
      xml.compile(xmlText, @t);
      local(rootAddr = xml.getAddress(@t, "root"));
      local(itemAddr = xml.getAddress(rootAddr, "item"));
      local(id = xml.getAttributeValue(itemAddr, "id"));
      local(type = xml.getAttributeValue(itemAddr, "type"));
      return id + ":" + type
    expected_output: "123:test"
    expected_success: true

  - name: "xml - getAddressList and iterate"
    script: |
      local(xmlText = "<root><num>1</num><num>2</num><num>3</num></root>");
      new(tableType, @workspace.xmltest);
      xml.compile(xmlText, @workspace.xmltest);
      local(rootAddr = xml.getAddress(@workspace.xmltest, "root"));
      local(addrList);
      new(listType, @addrList);
      xml.getAddressList(rootAddr, "num", @addrList);
      local(sum = 0);
      local(i);
      for i = 1 to sizeof(addrList) {
        sum = sum + long(addrList[i]^)
      };
      return sum
    expected_output: "6"
    expected_success: true

  # ========================================
  # Entity Encoding Roundtrip Test (Security)
  # ========================================

  - name: "xml - entity encoding roundtrip (encode→decode = identity)"
    script: |
      local(xmlWithEntities = "<root><data>Test &lt;tag&gt; &amp; text &amp; ]]&gt; sequence</data></root>");
      local(t);
      new(tableType, @t);
      xml.compile(xmlWithEntities, @t);
      local(rootAddr = xml.getAddress(@t, "root"));
      local(dataAddr = xml.getAddress(rootAddr, "data"));
      local(decoded = dataAddr^);
      local(expected = "Test <tag> & text & ]]> sequence");
      return decoded == expected
    expected_output: "true"
    expected_success: true
