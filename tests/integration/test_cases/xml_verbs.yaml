# Integration tests for xml.* verbs
#
# Test suite for XML processor verb implementations
# Coverage: xml.frontiervaluetotaggedtext (complete coverage of all value types)

processor: "xml"

tests:
  # ========================================
  # xml.frontiervaluetotaggedtext - String values
  # ========================================

  - name: "xml.frontiervaluetotaggedtext - simple string"
    script: |
      local(s = "hello");
      return xml.frontiervaluetotaggedtext(@s, 0)
    expected_output: "hello"
    expected_success: true

  - name: "xml.frontiervaluetotaggedtext - string with XML entities"
    script: |
      local(s = "a < b & c > d");
      return xml.frontiervaluetotaggedtext(@s, 0)
    expected_output: "a &lt; b &amp; c &gt; d"
    expected_success: true

  - name: "xml.frontiervaluetotaggedtext - string with quotes"
    script: |
      local(s = "say \"hello\"");
      return xml.frontiervaluetotaggedtext(@s, 0)
    expected_output: "say \"hello\""
    expected_success: true

  - name: "xml.frontiervaluetotaggedtext - empty string"
    script: |
      local(s = "");
      return xml.frontiervaluetotaggedtext(@s, 0)
    expected_output: ""
    expected_success: true

  # ========================================
  # xml.frontiervaluetotaggedtext - Integer values
  # ========================================

  - name: "xml.frontiervaluetotaggedtext - positive integer"
    script: |
      local(n = 42);
      return xml.frontiervaluetotaggedtext(@n, 0)
    expected_output: "<i4>42</i4>"
    expected_success: true

  - name: "xml.frontiervaluetotaggedtext - negative integer"
    script: |
      local(n = -100);
      return xml.frontiervaluetotaggedtext(@n, 0)
    expected_output: "<i4>-100</i4>"
    expected_success: true

  - name: "xml.frontiervaluetotaggedtext - zero"
    script: |
      local(n = 0);
      return xml.frontiervaluetotaggedtext(@n, 0)
    expected_output: "<i4>0</i4>"
    expected_success: true

  # ========================================
  # xml.frontiervaluetotaggedtext - Boolean values
  # ========================================

  - name: "xml.frontiervaluetotaggedtext - boolean true"
    script: |
      local(b = true);
      return xml.frontiervaluetotaggedtext(@b, 0)
    expected_output: "<boolean>1</boolean>"
    expected_success: true

  - name: "xml.frontiervaluetotaggedtext - boolean false"
    script: |
      local(b = false);
      return xml.frontiervaluetotaggedtext(@b, 0)
    expected_output: "<boolean>0</boolean>"
    expected_success: true

  # ========================================
  # xml.frontiervaluetotaggedtext - Double values
  # ========================================

  - name: "xml.frontiervaluetotaggedtext - double value"
    script: |
      local(d = 3.14159);
      return xml.frontiervaluetotaggedtext(@d, 0)
    expected_pattern: "^<double>3\\.14159.*</double>$"
    expected_success: true

  - name: "xml.frontiervaluetotaggedtext - negative double"
    script: |
      local(d = -2.5);
      return xml.frontiervaluetotaggedtext(@d, 0)
    expected_pattern: "^<double>-2\\.5.*</double>$"
    expected_success: true

  # ========================================
  # xml.frontiervaluetotaggedtext - Date values
  # ========================================

  - name: "xml.frontiervaluetotaggedtext - date value"
    script: |
      local(dt = date.set(2024, 1, 15, 10, 30, 0));
      return xml.frontiervaluetotaggedtext(@dt, 0)
    expected_pattern: "^<dateTime\\.iso8601>20240115T10:30:00</dateTime\\.iso8601>$"
    expected_success: true

  # ========================================
  # xml.frontiervaluetotaggedtext - Table (struct) values
  # ========================================

  - name: "xml.frontiervaluetotaggedtext - simple table"
    script: |
      local(t);
      new(tableType, @t);
      t.name = "John";
      t.age = 30;
      return xml.frontiervaluetotaggedtext(@t, 0)
    expected_contains:
      - "<struct>"
      - "<member>"
      - "<name>name</name>"
      - "<value><string>John</string></value>"
      - "<name>age</name>"
      - "<value><i4>30</i4></value>"
      - "</member>"
      - "</struct>"
    expected_success: true

  - name: "xml.frontiervaluetotaggedtext - empty table"
    script: |
      local(t);
      new(tableType, @t);
      return xml.frontiervaluetotaggedtext(@t, 0)
    expected_output: "<struct></struct>"
    expected_success: true

  - name: "xml.frontiervaluetotaggedtext - nested table"
    script: |
      local(t);
      new(tableType, @t);
      new(tableType, @t.address);
      t.address.city = "Boston";
      t.address.zip = 02101;
      return xml.frontiervaluetotaggedtext(@t, 0)
    expected_contains:
      - "<struct>"
      - "<member>"
      - "<name>address</name>"
      - "<value><struct>"
      - "<name>city</name>"
      - "<value><string>Boston</string></value>"
      - "<name>zip</name>"
      - "<value><i4>2101</i4></value>"
      - "</struct></value>"
      - "</member>"
      - "</struct>"
    expected_success: true

  # ========================================
  # xml.frontiervaluetotaggedtext - List (array) values
  # ========================================

  - name: "xml.frontiervaluetotaggedtext - simple list"
    script: |
      local(lst);
      new(listType, @lst);
      lst[1] = 10;
      lst[2] = 20;
      lst[3] = 30;
      return xml.frontiervaluetotaggedtext(@lst, 0)
    expected_contains:
      - "<array>"
      - "<data>"
      - "<value><i4>10</i4></value>"
      - "<value><i4>20</i4></value>"
      - "<value><i4>30</i4></value>"
      - "</data>"
      - "</array>"
    expected_success: true

  - name: "xml.frontiervaluetotaggedtext - empty list"
    script: |
      local(lst);
      new(listType, @lst);
      return xml.frontiervaluetotaggedtext(@lst, 0)
    expected_output: "<array><data></data></array>"
    expected_success: true

  - name: "xml.frontiervaluetotaggedtext - mixed type list"
    script: |
      local(lst);
      new(listType, @lst);
      lst[1] = "hello";
      lst[2] = 42;
      lst[3] = true;
      return xml.frontiervaluetotaggedtext(@lst, 0)
    expected_contains:
      - "<array>"
      - "<data>"
      - "<value><string>hello</string></value>"
      - "<value><i4>42</i4></value>"
      - "<value><boolean>1</boolean></value>"
      - "</data>"
      - "</array>"
    expected_success: true

  # ========================================
  # xml.frontiervaluetotaggedtext - Indent level parameter
  # ========================================

  - name: "xml.frontiervaluetotaggedtext - with indent level 0"
    script: |
      local(s = "test");
      return xml.frontiervaluetotaggedtext(@s, 0)
    expected_output: "<string>test</string>"
    expected_success: true

  - name: "xml.frontiervaluetotaggedtext - with indent level 1"
    script: |
      local(t);
      new(tableType, @t);
      t.key = "value";
      local(result = xml.frontiervaluetotaggedtext(@t, 1));
      return string.countFields(result, string.filledString("\t", 1))
    expected_output: "6"
    expected_success: true

  # ========================================
  # xml.frontiervaluetotaggedtext - Complex nested structures
  # ========================================

  # Test 1: Local variable shadows global (Issue #280 fix - Approach C)
  # This test verifies that external variable resolution now checks local scope
  # before global scope, allowing local variables to properly shadow globals.
  # Note: Uses "testroot" instead of "root" since "root" is reserved in Frontier.
  - name: "xml.frontiervaluetotaggedtext - local variable with nested external"
    script: |
      local(testroot);
      new(tableType, @testroot);
      testroot.title = "Test";
      new(listType, @testroot.items);
      testroot.items[1] = "a";
      testroot.items[2] = "b";
      return xml.frontiervaluetotaggedtext(@testroot, 0)
    expected_contains:
      - "<struct>"
      - "<name>title</name>"
      - "<value>Test</value>"
      - "<name>items</name>"
      - "<value><array>"
      - "<data>"
      - "<value>a</value>"
      - "<value>b</value>"
      - "</data>"
      - "</array></value>"
      - "</struct>"
    expected_success: true

  # Test 2: No local shadowing (backward compatibility)
  - name: "xml.frontiervaluetotaggedtext - global variable (no local shadow)"
    script: |
      new(tableType, @workspace.globaltest);
      workspace.globaltest.value = 42;
      local(result = xml.frontiervaluetotaggedtext(@workspace.globaltest, 0));
      delete(@workspace.globaltest);
      return result
    expected_contains:
      - "<struct>"
      - "<name>value</name>"
      - "<value><i4>42</i4></value>"
      - "</struct>"
    expected_success: true

  # Test 3: Nested scopes (with statement)
  - name: "xml.frontiervaluetotaggedtext - with statement scope"
    script: |
      new(tableType, @workspace.outer);
      local(data);
      new(tableType, @data);
      data.value = "inner";
      with workspace.outer {
        local(data);
        new(tableType, @data);
        data.value = "test";
        local(result = xml.frontiervaluetotaggedtext(@data, 0));
        delete(@workspace.outer);
        return result
      }
    expected_contains:
      - "<name>value</name>"
      - "<value>test</value>"
    expected_success: true

  # Test 4: Deep nesting (multiple levels)
  - name: "xml.frontiervaluetotaggedtext - deeply nested local structure"
    script: |
      local(obj);
      new(tableType, @obj);
      new(tableType, @obj.level1);
      new(tableType, @obj.level1.level2);
      obj.level1.level2.value = "deep";
      return xml.frontiervaluetotaggedtext(@obj, 0)
    expected_contains:
      - "<name>level1</name>"
      - "<name>level2</name>"
      - "<name>value</name>"
      - "<value>deep</value>"
    expected_success: true

  # ========================================
  # xml.frontiervaluetotaggedtext - Edge cases
  # ========================================

  - name: "xml.frontiervaluetotaggedtext - table with special chars in keys"
    script: |
      local(t);
      new(tableType, @t);
      t.["key<>&"] = "value";
      return xml.frontiervaluetotaggedtext(@t, 0)
    expected_contains:
      - "<struct>"
      - "<member>"
      - "<name>key&lt;&gt;&amp;</name>"
      - "<value><string>value</string></value>"
      - "</member>"
      - "</struct>"
    expected_success: true

  - name: "xml.frontiervaluetotaggedtext - deeply nested tables"
    script: |
      local(t);
      new(tableType, @t);
      new(tableType, @t.level1);
      new(tableType, @t.level1.level2);
      new(tableType, @t.level1.level2.level3);
      t.level1.level2.level3.value = "deep";
      return xml.frontiervaluetotaggedtext(@t, 0)
    expected_contains:
      - "<struct>"
      - "<name>level1</name>"
      - "<name>level2</name>"
      - "<name>level3</name>"
      - "<name>value</name>"
      - "<value><string>deep</string></value>"
    expected_success: true

  # ========================================
  # xml.compile - Parse XML string into database structure
  # ========================================

  - name: "xml.compile - simple element"
    script: |
      local(xmlText = "<root><name>John</name></root>");
      local(result);
      new(tableType, @result);
      if xml.compile(xmlText, @result) {
        return result.name
      }
    expected_output: "John"
    expected_success: true

  - name: "xml.compile - multiple elements"
    script: |
      local(xmlText = "<root><first>John</first><last>Doe</last></root>");
      local(result);
      new(tableType, @result);
      if xml.compile(xmlText, @result) {
        return result.first + " " + result.last
      }
    expected_output: "John Doe"
    expected_success: true

  - name: "xml.compile - nested elements"
    script: |
      local(xmlText = "<root><person><name>John</name><age>30</age></person></root>");
      local(result);
      new(tableType, @result);
      if xml.compile(xmlText, @result) {
        return result.person.name
      }
    expected_output: "John"
    expected_success: true

  - name: "xml.compile - element with attributes"
    script: |
      local(xmlText = "<root><item id=\"123\" type=\"test\">Value</item></root>");
      local(result);
      new(tableType, @result);
      if xml.compile(xmlText, @result) {
        return defined(result.item)
      }
    expected_output: "true"
    expected_success: true

  - name: "xml.compile - XML entities"
    script: |
      local(xmlText = "<root><text>a &lt; b &amp; c &gt; d</text></root>");
      local(result);
      new(tableType, @result);
      if xml.compile(xmlText, @result) {
        return result.text
      }
    expected_output: "a < b & c > d"
    expected_success: true

  - name: "xml.compile - empty element"
    script: |
      local(xmlText = "<root><empty/></root>");
      local(result);
      new(tableType, @result);
      if xml.compile(xmlText, @result) {
        return defined(result.empty)
      }
    expected_output: "true"
    expected_success: true

  - name: "xml.compile - malformed XML"
    script: |
      local(xmlText = "<root><unclosed>");
      local(result);
      new(tableType, @result);
      return xml.compile(xmlText, @result)
    expected_output: "false"
    expected_success: true

  # ========================================
  # xml.decompile - Convert database structure to XML string
  # ========================================

  - name: "xml.decompile - simple structure"
    script: |
      local(t);
      new(tableType, @t);
      t.name = "John";
      return xml.decompile(@t)
    expected_contains:
      - "<name>John</name>"
    expected_success: true

  - name: "xml.decompile - nested structure"
    script: |
      local(t);
      new(tableType, @t);
      new(tableType, @t.person);
      t.person.name = "John";
      t.person.age = 30;
      return xml.decompile(@t)
    expected_contains:
      - "<person>"
      - "<name>John</name>"
      - "<age>30</age>"
      - "</person>"
    expected_success: true

  - name: "xml.decompile - round trip with compile"
    script: |
      local(xmlText = "<root><item>test</item></root>");
      local(temp);
      new(tableType, @temp);
      xml.compile(xmlText, @temp);
      local(result = xml.decompile(@temp));
      return string.contains(result, "<item>test</item>")
    expected_output: "true"
    expected_success: true

  - name: "xml.decompile - empty table"
    script: |
      local(t);
      new(tableType, @t);
      return xml.decompile(@t)
    expected_success: true

  - name: "xml.decompile - special characters"
    script: |
      local(t);
      new(tableType, @t);
      t.text = "a < b & c > d";
      local(result = xml.decompile(@t));
      return string.contains(result, "&lt;") and string.contains(result, "&amp;") and string.contains(result, "&gt;")
    expected_output: "true"
    expected_success: true

  # ========================================
  # xml.getAddress - Find first element by name
  # ========================================

  - name: "xml.getAddress - simple lookup"
    script: |
      local(xmlText = "<root><name>John</name><age>30</age></root>");
      local(t);
      new(tableType, @t);
      xml.compile(xmlText, @t);
      local(adr);
      if xml.getAddress(@t, "name", @adr) {
        return @adr^
      }
    expected_output: "John"
    expected_success: true

  - name: "xml.getAddress - nested element"
    script: |
      local(xmlText = "<root><person><name>John</name></person></root>");
      local(t);
      new(tableType, @t);
      xml.compile(xmlText, @t);
      local(adr);
      if xml.getAddress(@t, "person", @adr) {
        return defined(@adr^.name)
      }
    expected_output: "true"
    expected_success: true

  - name: "xml.getAddress - element not found"
    script: |
      local(xmlText = "<root><name>John</name></root>");
      local(t);
      new(tableType, @t);
      xml.compile(xmlText, @t);
      local(adr);
      return xml.getAddress(@t, "missing", @adr)
    expected_output: "false"
    expected_success: true

  - name: "xml.getAddress - multiple elements (returns first)"
    script: |
      local(xmlText = "<root><item>first</item><item>second</item></root>");
      local(t);
      new(tableType, @t);
      xml.compile(xmlText, @t);
      local(adr);
      if xml.getAddress(@t, "item", @adr) {
        return @adr^
      }
    expected_output: "first"
    expected_success: true

  # ========================================
  # xml.getAddressList - Find all elements with same name
  # ========================================

  - name: "xml.getAddressList - multiple elements"
    script: |
      local(xmlText = "<root><item>a</item><item>b</item><item>c</item></root>");
      local(t);
      new(tableType, @t);
      xml.compile(xmlText, @t);
      local(addrList);
      new(listType, @addrList);
      if xml.getAddressList(@t, "item", @addrList) {
        return sizeof(addrList)
      }
    expected_output: "3"
    expected_success: true

  - name: "xml.getAddressList - single element"
    script: |
      local(xmlText = "<root><item>single</item></root>");
      local(t);
      new(tableType, @t);
      xml.compile(xmlText, @t);
      local(addrList);
      new(listType, @addrList);
      if xml.getAddressList(@t, "item", @addrList) {
        return sizeof(addrList)
      }
    expected_output: "1"
    expected_success: true

  - name: "xml.getAddressList - no matching elements"
    script: |
      local(xmlText = "<root><other>value</other></root>");
      local(t);
      new(tableType, @t);
      xml.compile(xmlText, @t);
      local(addrList);
      new(listType, @addrList);
      if xml.getAddressList(@t, "item", @addrList) {
        return sizeof(addrList)
      } else {
        return 0
      }
    expected_output: "0"
    expected_success: true

  - name: "xml.getAddressList - verify list contents"
    script: |
      local(xmlText = "<root><item>first</item><item>second</item></root>");
      local(t);
      new(tableType, @t);
      xml.compile(xmlText, @t);
      local(addrList);
      new(listType, @addrList);
      if xml.getAddressList(@t, "item", @addrList) {
        return addrList[1]^ + "," + addrList[2]^
      }
    expected_output: "first,second"
    expected_success: true

  # ========================================
  # xml.getAttribute - Get attribute table by name
  # ========================================

  - name: "xml.getAttribute - simple attribute"
    script: |
      local(xmlText = "<root><item id=\"123\">Value</item></root>");
      local(t);
      new(tableType, @t);
      xml.compile(xmlText, @t);
      local(adr);
      xml.getAddress(@t, "item", @adr);
      local(atts);
      if xml.getAttribute(@adr, "id", @atts) {
        return @atts^
      }
    expected_output: "123"
    expected_success: true

  - name: "xml.getAttribute - multiple attributes"
    script: |
      local(xmlText = "<root><item id=\"123\" type=\"test\" active=\"true\">Value</item></root>");
      local(t);
      new(tableType, @t);
      xml.compile(xmlText, @t);
      local(adr);
      xml.getAddress(@t, "item", @adr);
      local(atts);
      if xml.getAttribute(@adr, "type", @atts) {
        return @atts^
      }
    expected_output: "test"
    expected_success: true

  - name: "xml.getAttribute - attribute not found"
    script: |
      local(xmlText = "<root><item id=\"123\">Value</item></root>");
      local(t);
      new(tableType, @t);
      xml.compile(xmlText, @t);
      local(adr);
      xml.getAddress(@t, "item", @adr);
      local(atts);
      return xml.getAttribute(@adr, "missing", @atts)
    expected_output: "false"
    expected_success: true

  - name: "xml.getAttribute - no attributes"
    script: |
      local(xmlText = "<root><item>Value</item></root>");
      local(t);
      new(tableType, @t);
      xml.compile(xmlText, @t);
      local(adr);
      xml.getAddress(@t, "item", @adr);
      local(atts);
      return xml.getAttribute(@adr, "id", @atts)
    expected_output: "false"
    expected_success: true

  # ========================================
  # xml.getAttributeValue - Get attribute value directly
  # ========================================

  - name: "xml.getAttributeValue - simple attribute"
    script: |
      local(xmlText = "<root><item id=\"123\">Value</item></root>");
      local(t);
      new(tableType, @t);
      xml.compile(xmlText, @t);
      local(adr);
      xml.getAddress(@t, "item", @adr);
      return xml.getAttributeValue(@adr, "id")
    expected_output: "123"
    expected_success: true

  - name: "xml.getAttributeValue - numeric attribute"
    script: |
      local(xmlText = "<root><item count=\"42\">Value</item></root>");
      local(t);
      new(tableType, @t);
      xml.compile(xmlText, @t);
      local(adr);
      xml.getAddress(@t, "item", @adr);
      return xml.getAttributeValue(@adr, "count")
    expected_output: "42"
    expected_success: true

  - name: "xml.getAttributeValue - attribute with entities"
    script: |
      local(xmlText = "<root><item text=\"a &lt; b\">Value</item></root>");
      local(t);
      new(tableType, @t);
      xml.compile(xmlText, @t);
      local(adr);
      xml.getAddress(@t, "item", @adr);
      return xml.getAttributeValue(@adr, "text")
    expected_output: "a < b"
    expected_success: true

  - name: "xml.getAttributeValue - attribute not found"
    script: |
      local(xmlText = "<root><item id=\"123\">Value</item></root>");
      local(t);
      new(tableType, @t);
      xml.compile(xmlText, @t);
      local(adr);
      xml.getAddress(@t, "item", @adr);
      return xml.getAttributeValue(@adr, "missing")
    expected_output: ""
    expected_success: true

  # ========================================
  # xml.getPathAddress - Navigate slash-separated path
  # ========================================

  - name: "xml.getPathAddress - simple path"
    script: |
      local(xmlText = "<root><person><name>John</name></person></root>");
      local(t);
      new(tableType, @t);
      xml.compile(xmlText, @t);
      local(adr);
      if xml.getPathAddress(@t, "person/name", @adr) {
        return @adr^
      }
    expected_output: "John"
    expected_success: true

  - name: "xml.getPathAddress - deep path"
    script: |
      local(xmlText = "<root><a><b><c><d>deep</d></c></b></a></root>");
      local(t);
      new(tableType, @t);
      xml.compile(xmlText, @t);
      local(adr);
      if xml.getPathAddress(@t, "a/b/c/d", @adr) {
        return @adr^
      }
    expected_output: "deep"
    expected_success: true

  - name: "xml.getPathAddress - path not found"
    script: |
      local(xmlText = "<root><person><name>John</name></person></root>");
      local(t);
      new(tableType, @t);
      xml.compile(xmlText, @t);
      local(adr);
      return xml.getPathAddress(@t, "person/missing", @adr)
    expected_output: "false"
    expected_success: true

  - name: "xml.getPathAddress - single element path"
    script: |
      local(xmlText = "<root><name>John</name></root>");
      local(t);
      new(tableType, @t);
      xml.compile(xmlText, @t);
      local(adr);
      if xml.getPathAddress(@t, "name", @adr) {
        return @adr^
      }
    expected_output: "John"
    expected_success: true

  - name: "xml.getPathAddress - path with array index"
    script: |
      local(xmlText = "<root><items><item>first</item><item>second</item></items></root>");
      local(t);
      new(tableType, @t);
      xml.compile(xmlText, @t);
      local(adr);
      if xml.getPathAddress(@t, "items/item[2]", @adr) {
        return @adr^
      }
    expected_output: "second"
