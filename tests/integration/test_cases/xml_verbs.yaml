  - name: "xml.getPathAddress - array index [0] (invalid, treated as literal)"
    script: |
      local(xmlText = "<root><items><item>first</item><item>second</item></items></root>");
      local(t);
      new(tableType, @t);
      xml.compile(xmlText, @t);
      local(adr);
      if xml.getPathAddress(@t, "root/items/item[0]", @adr) {
        return "found"
      } else {
        return "not found"
      }
    expected_output: "not found"
    expected_success: true

  - name: "xml.getPathAddress - array index out of bounds"
    script: |
      local(xmlText = "<root><items><item>first</item><item>second</item></items></root>");
      local(t);
      new(tableType, @t);
      xml.compile(xmlText, @t);
      local(adr);
      if xml.getPathAddress(@t, "root/items/item[999]", @adr) {
        return "found"
      } else {
        return "not found"
      }
    expected_output: "not found"
    expected_success: true

  - name: "xml.getPathAddress - malformed array index (empty brackets)"
    script: |
