  # ========================================
  # xml.addTable - Create sub-table element
  # ========================================

  - name: "xml.addTable - add to empty parent"
    script: |
      local(parent);
      new(tableType, @parent);
      xml.addTable(@parent, "child");
      local(childAddr = xml.getAddress(@parent, "child"));
      return defined(childAddr)
    expected_output: "true"
    expected_success: true

  - name: "xml.addTable - add multiple children"
    script: |
      local(parent);
      new(tableType, @parent);
      xml.addTable(@parent, "first");
      xml.addTable(@parent, "second");
      local(firstAddr = xml.getAddress(@parent, "first"));
      local(secondAddr = xml.getAddress(@parent, "second"));
      return defined(firstAddr) and defined(secondAddr)
    expected_output: "true"
    expected_success: true

  - name: "xml.addTable - nested tables"
    script: |
      local(root);
      new(tableType, @root);
      xml.addTable(@root, "level1");
      local(level1Addr = xml.getAddress(@root, "level1"));
      xml.addTable(level1Addr, "level2");
      local(level2Addr = xml.getAddress(level1Addr, "level2"));
      return defined(level2Addr)
    expected_output: "true"
    expected_success: true

  - name: "xml.addTable - verify table type"
    script: |
      local(parent);
      new(tableType, @parent);
      xml.addTable(@parent, "child");
      local(childAddr = xml.getAddress(@parent, "child"));
      return typeof(childAddr^) == "tabl"
    expected_output: "true"
    expected_success: true

