  # ========================================
  # xml.valToString - Convert scalar to XML-RPC format
  # ========================================

  - name: "xml.valToString - string value"
    script: |
      local(s = "hello");
      return xml.valToString(s, 0)
    expected_output: "hello"
    expected_success: true

  - name: "xml.valToString - integer value"
    script: |
      local(n = 42);
      return xml.valToString(n, 0)
    expected_output: "<i4>42</i4>"
    expected_success: true

  - name: "xml.valToString - boolean value"
    script: |
      local(b = true);
      return xml.valToString(b, 0)
    expected_output: "<boolean>1</boolean>"
    expected_success: true

  - name: "xml.valToString - with indent level"
    script: |
      local(n = 10);
      local(result = xml.valToString(n, 1));
      return result
    expected_output: "<i4>10</i4>"
    expected_success: true
    # Note: indent level parameter is not implemented (#pragma unused in langxml.c)

  - name: "xml.valToString - entity encoding"
    script: |
      local(s = "a < b & c > d");
      return xml.valToString(s, 0)
    expected_contains:
      - "&lt;"
      - "&amp;"
    expected_success: true

