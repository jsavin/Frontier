      xml.compile(xmlText, @t);
      local(adr);
      if xml.getPathAddress(@t, "root/name", @adr) {
        return adr^
      }
    expected_output: "John"
    expected_success: true

  - name: "xml.getPathAddress - path with array index"
    script: |
      local(xmlText = "<root><items><item>first</item><item>second</item></items></root>");
      local(t);
      new(tableType, @t);
      xml.compile(xmlText, @t);
      local(adr);
      if xml.getPathAddress(@t, "root/items/item[2]", @adr) {
        return adr^
      }
    expected_output: "second"
    expected_success: true

  - name: "xml.getPathAddress - array index [1] (first element)"
    script: |
      local(xmlText = "<root><items><item>first</item><item>second</item></items></root>");
      local(t);
      new(tableType, @t);
      xml.compile(xmlText, @t);
