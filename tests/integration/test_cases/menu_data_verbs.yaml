# Integration tests for menu data manipulation verbs in headless mode
#
# These tests verify that Category A menu verbs (data manipulation) work in
# headless mode. Currently these verbs are NOT compiled in headless builds,
# so tests are expected to FAIL until implementation is complete.
#
# Reference: planning/phase3/HEADLESS_MENU_OPERATIONS_PLAN.md
#
# Category A - Data Manipulation Verbs (MUST WORK HEADLESS):
#   - menu.addMenuCommand() - Add item to menu
#   - menu.deleteMenuCommand() - Remove item from menu
#   - menu.getScript() - Get script text from menu item (cursor-based)
#   - menu.setScript() - Set script text for menu item (cursor-based)
#   - menu.getCommandKey() - Get keyboard shortcut (cursor-based)
#   - menu.setCommandKey() - Set keyboard shortcut (cursor-based)
#
# TDD Strategy:
#   - Tests are written FIRST to specify expected behavior
#   - Tests will FAIL initially (menu verbs not in headless build)
#   - Implementation should make these tests pass
#
# Test Dependencies:
#   - Requires lang.new() to create menubarType objects
#   - Cursor-based verbs require target.set() for menubar navigation
#   - Script uses scratch tables for temporary storage

tests:
  # ==========================================================================
  # menu.addMenuCommand() Tests
  # ==========================================================================

  - name: "menu.addMenuCommand - create new menu and add item"
    description: "Add a command to a new menubar, creating the menu if it doesn't exist"
    skip: true
    skip_reason: "TDD: Menu verb implementations pending in headless_menu_verbs.c"
    script: |
      new(menubarType, @workspace.testMenu);
      local(ok = menu.addMenuCommand(@workspace.testMenu, "File", "New", "dialog.alert(\"New!\")"));
      delete(@workspace.testMenu);
      return ok
    expected_success: true
    expected_result: "true"

  - name: "menu.addMenuCommand - add multiple items to same menu"
    description: "Add multiple commands to the same menu"
    skip: true
    skip_reason: "TDD: Menu verb implementations pending in headless_menu_verbs.c"
    script: |
      new(menubarType, @workspace.testMenu);
      menu.addMenuCommand(@workspace.testMenu, "Edit", "Cut", "edit.cut()");
      menu.addMenuCommand(@workspace.testMenu, "Edit", "Copy", "edit.copy()");
      local(ok = menu.addMenuCommand(@workspace.testMenu, "Edit", "Paste", "edit.paste()"));
      delete(@workspace.testMenu);
      return ok
    expected_success: true
    expected_result: "true"

  - name: "menu.addMenuCommand - replace existing item script"
    description: "Adding an item that already exists should replace its script"
    skip: true
    skip_reason: "TDD: Menu verb implementations pending in headless_menu_verbs.c"
    script: |
      new(menubarType, @workspace.testMenu);

      # Add initial item
      menu.addMenuCommand(@workspace.testMenu, "File", "Open", "oldScript()");

      # Replace with new script
      local(ok = menu.addMenuCommand(@workspace.testMenu, "File", "Open", "newScript()"));

      delete(@workspace.testMenu);
      return ok
    expected_success: true
    expected_result: "true"

  - name: "menu.addMenuCommand - create multiple menus"
    description: "Add items to different menus in the same menubar"
