# Thread Verb Integration Tests - Phase 1
#
# Foundation tests for thread verb functionality.
# Validates basic thread operations: creation, execution, sleep, kill, error handling.
#
# These tests form the basis for deterministic testing infrastructure.
# Currently validates thread behavior through observable side effects.
# Future: Will integrate with tick-control harness for true determinism.
#
# Run with: python3 runner.py --filter thread_verbs

description: "Thread Verb Integration Tests - Phase 1 Foundation"

setup: |
  # Initialize test data structures
  lang.new(tableType, @system.test.threadData)
  lang.new(tableType, @system.test.threadFlags)
  lang.new(tableType, @system.test.threadTiming)

cleanup: |
  # Clean up test data
  delete(@system.test.threadData)
  delete(@system.test.threadFlags)
  delete(@system.test.threadTiming)

tests:
  # Test 1: Basic thread creation and execution
  - name: "thread.call - execute simple script in new thread"
    description: |
      Verify that thread.call() creates a new thread, executes the provided
      script, and completes successfully.
    script: |
      thread.call("basicThread", {
        system.test.threadFlags.basicThreadRan = true
      })

      // Give thread time to execute
      for i = 0; i < 10; i++ {
        sys.systemTask()
      }

      return system.test.threadFlags.basicThreadRan
    expected_result: true
    expected_success: true
    timeout: 5

  # Test 2: Thread with return value via shared storage
  - name: "thread.call - return value from thread"
    description: |
      Verify that values computed in a thread can be captured via shared
      table storage (since thread.call doesn't return directly).
    script: |
      thread.call("calculatingThread", {
        system.test.threadData.result = 42
        system.test.threadData.message = "computation complete"
      })

      // Give thread time to execute
      for i = 0; i < 10; i++ {
        sys.systemTask()
      }

      return system.test.threadData.result == 42 and \
             system.test.threadData.message == "computation complete"
    expected_result: true
    expected_success: true
    timeout: 5

  # Test 3: Thread sleep and wake
  - name: "thread.sleepFor - thread sleeps and wakes"
    description: |
      Verify that thread.sleepFor(N) causes thread to sleep.
      This test validates the sleep mechanism works (not exact timing).
    script: |
      thread.call("sleepingThread", {
        thread.sleepFor(100)
        system.test.threadFlags.sleepCompleted = true
      })

      // Give thread time to sleep and wake
      for i = 0; i < 20; i++ {
        sys.systemTask()
      }

      return system.test.threadFlags.sleepCompleted
    expected_result: true
    expected_success: true
    timeout: 5

  # Test 4: Thread wake - manually wake sleeping thread
  - name: "thread.wake - wake sleeping thread"
    description: |
      Verify that thread.wake() wakes a sleeping thread.
    script: |
      thread.call("earlySleeper", {
        thread.sleepFor(10000)  // Long sleep
        system.test.threadFlags.wokByWake = true
      })

      // Let thread start sleeping
      for i = 0; i < 5; i++ {
        sys.systemTask()
      }

      // Wake the thread
      thread.wake("earlySleeper")

      // Let thread execute and mark completion
      for i = 0; i < 10; i++ {
        sys.systemTask()
      }

      return system.test.threadFlags.wokByWake
    expected_result: true
    expected_success: true
    timeout: 5

  # Test 5: Thread kill - terminate thread
  - name: "thread.kill - terminate thread"
    description: |
      Verify that thread.kill() terminates a thread.
    script: |
      thread.call("expendableThread", {
        system.test.threadFlags.threadStarted = true
        thread.sleepFor(10000)  // Long sleep
        system.test.threadFlags.threadCompletedAfterKill = true
      })

      // Let thread start and start sleeping
      for i = 0; i < 5; i++ {
        sys.systemTask()
      }

      // Kill the thread
      thread.kill("expendableThread")

      // Let system process
      for i = 0; i < 10; i++ {
        sys.systemTask()
      }

      return system.test.threadFlags.threadStarted and \
             not (system.test.threadFlags.threadCompletedAfterKill)
    expected_result: true
    expected_success: true
    timeout: 5

  # Test 6: Error handling in thread
  - name: "thread.call - script error in thread is handled gracefully"
    description: |
      Verify that script errors in thread context don't crash the system.
    script: |
      thread.call("errorThread", {
        system.test.threadFlags.errorThreadStarted = true
        scriptError("intentional error")
        system.test.threadFlags.neverExecute = true
      })

      // Let thread run and error
      for i = 0; i < 10; i++ {
        sys.systemTask()
      }

      // System should still be responsive
      system.test.threadFlags.systemStillWorks = true

      return system.test.threadFlags.errorThreadStarted and \
             not (system.test.threadFlags.neverExecute) and \
             system.test.threadFlags.systemStillWorks
    expected_result: true
    expected_success: true
    timeout: 5

  # Test 7: Multiple threads independent operation
  - name: "thread.call - multiple threads run independently"
    description: |
      Verify that multiple threads can run simultaneously without interference.
    script: |
      thread.call("thread1", {
        system.test.threadFlags.thread1Ran = true
      })

      thread.call("thread2", {
        system.test.threadFlags.thread2Ran = true
      })

      // Give threads time to execute
      for i = 0; i < 20; i++ {
        sys.systemTask()
      }

      return system.test.threadFlags.thread1Ran and \
             system.test.threadFlags.thread2Ran
    expected_result: true
    expected_success: true
    timeout: 5

  # Test 8: Thread accessing ODB
  - name: "thread.call - safely modify ODB during execution"
    description: |
      Verify that threads can safely create and modify ODB structures.
    script: |
      thread.call("odobThread", {
        lang.new(tableType, @system.test.threadData.innerTable)
        system.test.threadData.innerTable.a = 10
        system.test.threadData.innerTable.b = 20
        system.test.threadData.innerTable.c = system.test.threadData.innerTable.a + system.test.threadData.innerTable.b
      })

      // Give thread time to execute
      for i = 0; i < 10; i++ {
        sys.systemTask()
      }

      return system.test.threadData.innerTable.a == 10 and \
             system.test.threadData.innerTable.b == 20 and \
             system.test.threadData.innerTable.c == 30
    expected_result: true
    expected_success: true
    timeout: 5

  # Test 9: Thread count reporting
  - name: "thread.getCount - report active thread count"
    description: |
      Verify that thread.getCount() reports number of active threads.
    script: |
      local(countBefore = thread.getCount())

      thread.call("countThread", {
        system.test.threadData.countDuringThread = thread.getCount()
        for i = 0; i < 10; i++ {
          sys.systemTask()
        }
      })

      // Should have at least 1 thread (the new one)
      for i = 0; i < 15; i++ {
        sys.systemTask()
      }

      local(countAfter = thread.getCount())

      return countDuringThread >= 1 and countAfter >= 0
    expected_result: true
    expected_success: true
    timeout: 5

  # Test 10: Thread getCurrentID reports valid ID
  - name: "thread.getCurrentID - get current thread ID"
    description: |
      Verify that thread.getCurrentID() returns valid thread ID.
    script: |
      local(mainThreadID = thread.getCurrentID())

      thread.call("idThread", {
        system.test.threadData.threadIDInThread = thread.getCurrentID()
      })

      // Let thread execute
      for i = 0; i < 10; i++ {
        sys.systemTask()
      }

      return mainThreadID > 0 and system.test.threadData.threadIDInThread > 0
    expected_result: true
    expected_success: true
    timeout: 5
