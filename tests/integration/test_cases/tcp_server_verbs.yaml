sequential: true  # Tests bind TCP ports; parallel workers would conflict
# Integration tests for TCP Phase 3 - Server Operations
# Tests tcp.listenStream(), tcp.closeListen(), and callback infrastructure
#
# Phase 3 verbs (3 total):
#   - tcp.listenStream(port, depth, callback, refcon, addr) → listenID - Start listening for connections
#   - tcp.closeListen(listenID) → true - Stop listening
#   - tcp.statusStream(stream, @bytes) → status - Query pending bytes (Phase 1A verb with Phase 3 use)
#
# NOTE: All tests use LOCALHOST ONLY (127.0.0.1) - NO external network dependencies!
# Tests are self-contained: client and server on same machine.
#
# Reference:
#   - planning/phase4/networking/TCP_VERBS_ANALYSIS.md (API documentation)
#   - planning/phase4/p0a-critical-thread-safety/CALLBACK_INFRASTRUCTURE.md (Callback infrastructure)
#   - Common/source/tcpverbs.c (Phase 1A implementation reference)
#
# ============================================================================
# CATEGORY 1: Listen/Accept Basic Operations (Happy Path)
# ============================================================================

tests:
  - name: "tcp.listenStream - basic listener startup"
    description: "Start listener on localhost port 9000 and verify listenID returned"
    script: |
      local(listenID = tcp.listenStream(9000, 5, ""));
      local(valid = listenID > 0);
      tcp.closeListen(listenID);
      return valid
    expected_success: true
    expected_result: "true"
    notes: "Phase 3 - Requires tcp.listenStream() implementation"

  - name: "tcp.listenStream - return type validation"
    description: "listenStream returns long type (listenID)"
    script: |
      local(listenID = tcp.listenStream(9001, 5, ""));
      local(valid = typeof(listenID) == longType);
      tcp.closeListen(listenID);
      return valid
    expected_success: true
    expected_result: "true"
    notes: "Phase 3 - Verify return type is long (listenID)"

  - name: "tcp.closeListen - basic listener shutdown"
    description: "Start listener, close it, verify returns true"
    script: |
      local(listenID = tcp.listenStream(9002, 5, ""));
      local(result = tcp.closeListen(listenID));
      return result == true
    expected_success: true
    expected_result: "true"
    notes: "Phase 3 - Verify closeListen returns boolean true"

  - name: "tcp.listenStream - callback receives connection"
    description: "Verify callback is invoked when client connects"
    timeout: 10
    script: |
      new(tableType, @system.temp.tcpSrv03);
      system.temp.tcpSrv03.fired = false;
      system.temp.tcpSrv03.sid = -1;
      script.newScriptObject("on myHandler(sid, refcon) {\r  system.temp.tcpSrv03.fired = true;\r  system.temp.tcpSrv03.sid = sid;\r  tcp.closeStream(sid);\r  return true}", @system.temp.tcpSrv03.myHandler);

      local(listenID = tcp.listenStream(9003, 5, @system.temp.tcpSrv03.myHandler));
      local(clientStream = tcp.openStream(tcp.addressEncode("127.0.0.1"), 9003));

      local(deadline = clock.ticks() + 300);
      while (not system.temp.tcpSrv03.fired) and (clock.ticks() < deadline) {
        clock.ticks()
      };

      local(invoked = system.temp.tcpSrv03.fired);
      local(validStream = system.temp.tcpSrv03.sid > 0);

      tcp.closeStream(clientStream);
      tcp.closeListen(listenID);
      delete(@system.temp.tcpSrv03);

      return invoked and validStream
    expected_success: true
    expected_result: "true"
    notes: "Phase 3 - Callback installed via script.newScriptObject; 2-param signature (sid, refcon)"

  - name: "tcp.listenStream - callback receives correct remote address"
    description: "Verify server can query 127.0.0.1 as peer address via tcp.getPeerAddress on accepted stream"
    timeout: 10
    script: |
      new(tableType, @system.temp.tcpSrv04);
      system.temp.tcpSrv04.fired = false;
      system.temp.tcpSrv04.peerAddr = 0;
      script.newScriptObject("on myHandler(sid, refcon) {\r  system.temp.tcpSrv04.fired = true;\r  system.temp.tcpSrv04.peerAddr = tcp.getPeerAddress(sid);\r  tcp.closeStream(sid);\r  return true}", @system.temp.tcpSrv04.myHandler);

      local(listenID = tcp.listenStream(9004, 5, @system.temp.tcpSrv04.myHandler));
      local(clientStream = tcp.openStream(tcp.addressEncode("127.0.0.1"), 9004));

      local(deadline = clock.ticks() + 300);
      while (not system.temp.tcpSrv04.fired) and (clock.ticks() < deadline) {
        clock.ticks()
      };

      local(validAddr = system.temp.tcpSrv04.peerAddr == tcp.addressEncode("127.0.0.1"));

      tcp.closeStream(clientStream);
      tcp.closeListen(listenID);
      delete(@system.temp.tcpSrv04);

      return validAddr
    expected_success: true
    expected_result: "true"
    notes: "Phase 3 - Remote addr obtained via tcp.getPeerAddress(sid) inside callback"

  - name: "tcp.listenStream - callback receives correct remote port"
    description: "Verify server sees ephemeral port number from client via tcp.getPeerPort"
    timeout: 10
    script: |
      new(tableType, @system.temp.tcpSrv05);
      system.temp.tcpSrv05.fired = false;
      system.temp.tcpSrv05.peerPort = 0;
      script.newScriptObject("on myHandler(sid, refcon) {\r  system.temp.tcpSrv05.fired = true;\r  system.temp.tcpSrv05.peerPort = tcp.getPeerPort(sid);\r  tcp.closeStream(sid);\r  return true}", @system.temp.tcpSrv05.myHandler);

      local(listenID = tcp.listenStream(9005, 5, @system.temp.tcpSrv05.myHandler));
      local(clientStream = tcp.openStream(tcp.addressEncode("127.0.0.1"), 9005));

      local(deadline = clock.ticks() + 300);
      while (not system.temp.tcpSrv05.fired) and (clock.ticks() < deadline) {
        clock.ticks()
      };

      local(validPort = (system.temp.tcpSrv05.peerPort > 0) and (system.temp.tcpSrv05.peerPort < 65536));

      tcp.closeStream(clientStream);
      tcp.closeListen(listenID);
      delete(@system.temp.tcpSrv05);

      return validPort
    expected_success: true
    expected_result: "true"
    notes: "Phase 3 - Remote port obtained via tcp.getPeerPort(sid) inside callback"

  - name: "tcp.listenStream - read/write on accepted connection"
    description: "Verify data can be read and written on accepted connection"
    timeout: 10
    script: |
      new(tableType, @system.temp.tcpSrv06);
      system.temp.tcpSrv06.fired = false;
      script.newScriptObject("on myHandler(sid, refcon) {\r  local(data = tcp.readStream(sid, 1024));\r  tcp.writeStream(sid, \"ECHO: \" + data);\r  tcp.closeStream(sid);\r  system.temp.tcpSrv06.fired = true;\r  return true}", @system.temp.tcpSrv06.myHandler);

      local(listenID = tcp.listenStream(9006, 5, @system.temp.tcpSrv06.myHandler));
      local(clientStream = tcp.openStream(tcp.addressEncode("127.0.0.1"), 9006));

      tcp.writeStream(clientStream, "Hello Server");

      local(deadline = clock.ticks() + 300);
      while (not system.temp.tcpSrv06.fired) and (clock.ticks() < deadline) {
        clock.ticks()
      };

      local(response = "");
      local(readDeadline = clock.ticks() + 120);
      while (sizeOf(response) == 0) and (clock.ticks() < readDeadline) {
        response = tcp.readStream(clientStream, 1024);
        clock.ticks()
      };

      local(validResponse = response == "ECHO: Hello Server");

      tcp.closeStream(clientStream);
      tcp.closeListen(listenID);
      delete(@system.temp.tcpSrv06);

      return validResponse
    expected_success: true
    expected_result: "true"
    notes: "Phase 3 - Verify read/write operations work on accepted connections"

  - name: "tcp.listenStream - connection closes after callback returns"
    description: "Verify connection properly closes when callback writes response and closes stream"
    timeout: 10
    script: |
      new(tableType, @system.temp.tcpSrv07);
      system.temp.tcpSrv07.fired = false;
      script.newScriptObject("on myHandler(sid, refcon) {\r  tcp.writeStream(sid, \"OK\");\r  tcp.closeStream(sid);\r  system.temp.tcpSrv07.fired = true;\r  return true}", @system.temp.tcpSrv07.myHandler);

      local(listenID = tcp.listenStream(9007, 5, @system.temp.tcpSrv07.myHandler));
      local(clientStream = tcp.openStream(tcp.addressEncode("127.0.0.1"), 9007));

      local(deadline = clock.ticks() + 300);
      while (not system.temp.tcpSrv07.fired) and (clock.ticks() < deadline) {
        clock.ticks()
      };

      local(response = "");
      local(readDeadline = clock.ticks() + 120);
      while (sizeOf(response) == 0) and (clock.ticks() < readDeadline) {
        response = tcp.readStream(clientStream, 1024);
        clock.ticks()
      };

      local(validResponse = response == "OK");

      tcp.closeStream(clientStream);
      tcp.closeListen(listenID);
      delete(@system.temp.tcpSrv07);

      return validResponse
    expected_success: true
    expected_result: "true"
    notes: "Phase 3 - Verify graceful connection close in callback"

  - name: "tcp.listenStream - listener restart on same port"
    description: "Verify listener can be stopped and restarted on same port"
    timeout: 10
    script: |
      local(listenID1 = tcp.listenStream(9008, 5, ""));

      tcp.closeListen(listenID1);

      local(deadline = clock.ticks() + 30);
      while clock.ticks() < deadline {
        clock.ticks()
      };

      local(listenID2 = tcp.listenStream(9008, 5, ""));
      local(validRestart = listenID2 > 0);

      tcp.closeListen(listenID2);

      return validRestart
    expected_success: true
    expected_result: "true"
    notes: "Phase 3 - Verify SO_REUSEADDR allows port reuse"

# ============================================================================
# CATEGORY 2: Multiple Connections
# ============================================================================

  - name: "tcp.listenStream - sequential connections"
    description: "Verify listener accepts multiple connections sequentially"
    timeout: 15
    script: |
      new(tableType, @system.temp.tcpSrv09);
      system.temp.tcpSrv09.count = 0;
      script.newScriptObject("on myHandler(sid, refcon) {\r  system.temp.tcpSrv09.count = system.temp.tcpSrv09.count + 1;\r  tcp.writeStream(sid, \"OK\");\r  tcp.closeStream(sid);\r  return true}", @system.temp.tcpSrv09.myHandler);

      local(listenID = tcp.listenStream(9009, 5, @system.temp.tcpSrv09.myHandler));

      local(i);
      for i = 1 to 3 {
        local(stream = tcp.openStream(tcp.addressEncode("127.0.0.1"), 9009));
        local(response = "");
        local(readDeadline = clock.ticks() + 120);
        while (sizeOf(response) == 0) and (clock.ticks() < readDeadline) {
          response = tcp.readStream(stream, 1024);
          clock.ticks()
        };
        tcp.closeStream(stream)
      };

      local(countDeadline = clock.ticks() + 120);
      while (system.temp.tcpSrv09.count < 3) and (clock.ticks() < countDeadline) {
        clock.ticks()
      };

      local(allAccepted = system.temp.tcpSrv09.count == 3);

      tcp.closeListen(listenID);
      delete(@system.temp.tcpSrv09);

      return allAccepted
    expected_success: true
    expected_result: "true"
    notes: "Phase 3 - Verify listener can accept multiple sequential connections"

  - name: "tcp.listenStream - concurrent connections"
    description: "Verify listener accepts multiple concurrent connections"
    timeout: 15
    script: |
      new(tableType, @system.temp.tcpSrv10);
      system.temp.tcpSrv10.count = 0;
      script.newScriptObject("on myHandler(sid, refcon) {\r  system.temp.tcpSrv10.count = system.temp.tcpSrv10.count + 1;\r  tcp.writeStream(sid, \"OK\");\r  tcp.closeStream(sid);\r  return true}", @system.temp.tcpSrv10.myHandler);

      local(listenID = tcp.listenStream(9010, 5, @system.temp.tcpSrv10.myHandler));

      local(stream1 = tcp.openStream(tcp.addressEncode("127.0.0.1"), 9010));
      local(stream2 = tcp.openStream(tcp.addressEncode("127.0.0.1"), 9010));
      local(stream3 = tcp.openStream(tcp.addressEncode("127.0.0.1"), 9010));

      local(deadline = clock.ticks() + 300);
      while (system.temp.tcpSrv10.count < 3) and (clock.ticks() < deadline) {
        clock.ticks()
      };

      local(allAccepted = system.temp.tcpSrv10.count == 3);

      tcp.closeStream(stream1);
      tcp.closeStream(stream2);
      tcp.closeStream(stream3);
      tcp.closeListen(listenID);
      delete(@system.temp.tcpSrv10);

      return allAccepted
    expected_success: true
    expected_result: "true"
    notes: "Phase 3 - Verify listener handles concurrent connections"

  - name: "tcp.listenStream - queue depth limiting"
    description: "Verify queue depth (backlog) parameter is respected"
    script: |
      local(listenID = tcp.listenStream(9011, 1, ""));

      local(validListen = listenID > 0);

      tcp.closeListen(listenID);

      return validListen
    expected_success: true
    expected_result: "true"
    notes: "Phase 3 - Behavioral spec: depth parameter controls accept queue backlog"

  - name: "tcp.countConnections - includes accepted connections"
    description: "Verify countConnections includes server-accepted connections"
    timeout: 10
    script: |
      new(tableType, @system.temp.tcpSrv12);
      system.temp.tcpSrv12.connected = false;
      system.temp.tcpSrv12.serverStream = -1;
      script.newScriptObject("on myHandler(sid, refcon) {\r  system.temp.tcpSrv12.connected = true;\r  system.temp.tcpSrv12.serverStream = sid;\r  return true}", @system.temp.tcpSrv12.myHandler);

      local(initialCount = tcp.countConnections());

      local(listenID = tcp.listenStream(9012, 5, @system.temp.tcpSrv12.myHandler));
      local(clientStream = tcp.openStream(tcp.addressEncode("127.0.0.1"), 9012));

      local(deadline = clock.ticks() + 300);
      while (not system.temp.tcpSrv12.connected) and (clock.ticks() < deadline) {
        clock.ticks()
      };

      local(newCount = tcp.countConnections());
      local(countIncreased = newCount >= initialCount + 2);

      tcp.closeStream(clientStream);
      tcp.closeStream(system.temp.tcpSrv12.serverStream);
      tcp.closeListen(listenID);
      delete(@system.temp.tcpSrv12);

      return countIncreased
    expected_success: true
    expected_result: "true"
    notes: "Phase 3 - Verify countConnections tracks all connections (client and server)"

# ============================================================================
# CATEGORY 3: Error Handling
# ============================================================================

  - name: "tcp.listenStream - invalid port (negative)"
    description: "Negative port number should raise error"
    script: |
      try {
        tcp.listenStream(-1, 5, "");
        return "false"
      }
      else {
        return "true"
      }
    expected_success: true
    expected_result: "true"
    notes: "Phase 3 - Validate port number range"

  - name: "tcp.listenStream - invalid port (zero)"
    description: "Port 0 should raise error for explicit listen (OS may allow for ephemeral assignment)"
    script: |
      try {
        tcp.listenStream(0, 5, "");
        return "false"
      }
      else {
        return "true"
      }
    expected_success: true
    expected_result: "true"
    notes: "Phase 3 - Port 0 is invalid for explicit listen (ephemeral ports are OS-assigned)"

  - name: "tcp.listenStream - invalid port (too large)"
    description: "Port > 65535 should raise error"
    script: |
      try {
        tcp.listenStream(70000, 5, "");
        return "false"
      }
      else {
        return "true"
      }
    expected_success: true
    expected_result: "true"
    notes: "Phase 3 - Port must be in valid range (1-65535)"

  - name: "tcp.listenStream - port already in use"
    description: "Attempting to listen on already-bound port should raise error"
    timeout: 10
    script: |
      local(listenID = tcp.listenStream(9013, 5, ""));

      try {
        tcp.listenStream(9013, 5, "");
        tcp.closeListen(listenID);
        return "false"
      }
      else {
        tcp.closeListen(listenID);
        return "true"
      }
    expected_success: true
    expected_result: "true"
    notes: "Phase 3 - Verify bind() fails when port already in use"

  - name: "tcp.listenStream - invalid queue depth (negative)"
    description: "Negative queue depth should raise error"
    script: |
      try {
        tcp.listenStream(9014, -1, "");
        return "false"
      }
      else {
        return "true"
      }
    expected_success: true
    expected_result: "true"
    notes: "Phase 3 - Queue depth must be positive"

  - name: "tcp.listenStream - invalid queue depth (zero)"
    description: "Zero queue depth should raise error (must be at least 1)"
    script: |
      try {
        tcp.listenStream(9015, 0, "");
        return "false"
      }
      else {
        return "true"
      }
    expected_success: true
    expected_result: "true"
    notes: "Phase 3 - Queue depth must be positive (>= 1)"

  - name: "tcp.closeListen - invalid listenID (negative)"
    description: "Negative listenID should raise error"
    script: |
      try {
        tcp.closeListen(-1);
        return "false"
      }
      else {
        return "true"
      }
    expected_success: true
    expected_result: "true"
    notes: "Phase 3 - Validate listenID parameter"

  - name: "tcp.closeListen - invalid listenID (zero)"
    description: "Zero listenID should raise error"
    script: |
      try {
        tcp.closeListen(0);
        return "false"
      }
      else {
        return "true"
      }
    expected_success: true
    expected_result: "true"
    notes: "Phase 3 - ListenID 0 is invalid (reserved)"

  - name: "tcp.closeListen - listener not found"
    description: "Closing non-existent listenID should raise error"
    script: |
      try {
        tcp.closeListen(999999);
        return "false"
      }
      else {
        return "true"
      }
    expected_success: true
    expected_result: "true"
    notes: "Phase 3 - Verify error when listenID doesn't exist"

# ============================================================================
# CATEGORY 4: Lifecycle & Resource Management
# ============================================================================

  - name: "tcp.closeListen - idempotent behavior"
    description: "Calling closeListen twice on same listenID should be safe (idempotent)"
    timeout: 10
    script: |
      local(listenID = tcp.listenStream(9016, 5, ""));

      local(result1 = tcp.closeListen(listenID));

      local(validFirstClose = result1 == true);

      try {
        tcp.closeListen(listenID);
        local(validSecondClose = true)
      }
      else {
        local(validSecondClose = true)  // Expected to fail
      };

      return validFirstClose and validSecondClose
    expected_success: true
    expected_result: "true"
    notes: "Phase 3 - Behavioral spec: closeListen should be idempotent or fail gracefully"

  - name: "tcp.listenStream - connections survive listener close"
    description: "Verify accepted connections remain open after listener closes"
    timeout: 10
    script: |
      new(tableType, @system.temp.tcpSrv17);
      system.temp.tcpSrv17.connected = false;
      system.temp.tcpSrv17.serverStream = -1;
      script.newScriptObject("on myHandler(sid, refcon) {\r  system.temp.tcpSrv17.connected = true;\r  system.temp.tcpSrv17.serverStream = sid;\r  return true}", @system.temp.tcpSrv17.myHandler);

      local(listenID = tcp.listenStream(9017, 5, @system.temp.tcpSrv17.myHandler));
      local(clientStream = tcp.openStream(tcp.addressEncode("127.0.0.1"), 9017));

      local(deadline = clock.ticks() + 300);
      while (not system.temp.tcpSrv17.connected) and (clock.ticks() < deadline) {
        clock.ticks()
      };

      tcp.closeListen(listenID);

      tcp.writeStream(clientStream, "test");
      tcp.writeStream(system.temp.tcpSrv17.serverStream, "response");

      local(response = "");
      local(readDeadline = clock.ticks() + 120);
      while (sizeOf(response) == 0) and (clock.ticks() < readDeadline) {
        response = tcp.readStream(clientStream, 1024);
        clock.ticks()
      };

      local(connectionSurvived = response == "response");

      tcp.closeStream(clientStream);
      tcp.closeStream(system.temp.tcpSrv17.serverStream);
      delete(@system.temp.tcpSrv17);

      return connectionSurvived
    expected_success: true
    expected_result: "true"
    notes: "Phase 3 - Verify closeListen only stops accepting new connections, doesn't close established ones"

  - name: "tcp.listenStream - graceful shutdown (close all before closeListen)"
    description: "Verify pattern: close all accepted connections before closing listener"
    timeout: 15
    script: |
      new(tableType, @system.temp.tcpSrv18);
      system.temp.tcpSrv18.count = 0;
      system.temp.tcpSrv18.s1 = -1;
      system.temp.tcpSrv18.s2 = -1;
      script.newScriptObject("on myHandler(sid, refcon) {\r  if system.temp.tcpSrv18.s1 == -1 {\r    system.temp.tcpSrv18.s1 = sid\r  } else {\r    system.temp.tcpSrv18.s2 = sid\r  };\r  system.temp.tcpSrv18.count = system.temp.tcpSrv18.count + 1;\r  return true}", @system.temp.tcpSrv18.myHandler);

      local(listenID = tcp.listenStream(9018, 5, @system.temp.tcpSrv18.myHandler));

      local(client1 = tcp.openStream(tcp.addressEncode("127.0.0.1"), 9018));
      local(client2 = tcp.openStream(tcp.addressEncode("127.0.0.1"), 9018));

      local(deadline = clock.ticks() + 300);
      while (system.temp.tcpSrv18.count < 2) and (clock.ticks() < deadline) {
        clock.ticks()
      };

      if system.temp.tcpSrv18.s1 > 0 {
        tcp.closeStream(system.temp.tcpSrv18.s1)
      };
      if system.temp.tcpSrv18.s2 > 0 {
        tcp.closeStream(system.temp.tcpSrv18.s2)
      };

      tcp.closeStream(client1);
      tcp.closeStream(client2);

      local(result = tcp.closeListen(listenID));

      delete(@system.temp.tcpSrv18);

      return result == true
    expected_success: true
    expected_result: "true"
    notes: "Phase 3 - Best practice: close all connections before listener shutdown"

  - name: "tcp.listenStream - new connections rejected after closeListen"
    description: "Verify no new connections accepted after listener is closed"
    timeout: 10
    script: |
      local(listenID = tcp.listenStream(9019, 5, ""));

      tcp.closeListen(listenID);

      local(deadline = clock.ticks() + 15);
      while clock.ticks() < deadline {
        clock.ticks()
      };

      try {
        tcp.openStream(tcp.addressEncode("127.0.0.1"), 9019);
        return "false"  // Should not succeed
      }
      else {
        return "true"  // Expected connection refused
      }
    expected_success: true
    expected_result: "true"
    notes: "Phase 3 - Verify listener stops accepting connections after closeListen"

# ============================================================================
# CATEGORY 5: Callback Threading & Safety
# ============================================================================

  - name: "tcp.listenStream - callback executes in separate thread"
    description: "Behavioral spec: callback executes asynchronously in worker thread"
    timeout: 10
    script: |
      new(tableType, @system.temp.tcpSrv20);
      system.temp.tcpSrv20.callbackComplete = false;
      script.newScriptObject("on myHandler(sid, refcon) {\r  system.temp.tcpSrv20.callbackComplete = true;\r  tcp.closeStream(sid);\r  return true}", @system.temp.tcpSrv20.myHandler);

      local(listenID = tcp.listenStream(9020, 5, @system.temp.tcpSrv20.myHandler));
      local(clientStream = tcp.openStream(tcp.addressEncode("127.0.0.1"), 9020));

      local(mainThreadContinued = true);

      local(deadline = clock.ticks() + 300);
      while (not system.temp.tcpSrv20.callbackComplete) and (clock.ticks() < deadline) {
        clock.ticks()
      };

      local(callbackRan = system.temp.tcpSrv20.callbackComplete);

      tcp.closeStream(clientStream);
      tcp.closeListen(listenID);
      delete(@system.temp.tcpSrv20);

      return mainThreadContinued and callbackRan
    expected_success: true
    expected_result: "true"
    notes: "Phase 3 - Behavioral spec: callbacks execute asynchronously in worker threads"

  - name: "tcp.listenStream - callback parameter types"
    description: "Verify callback sid parameter is longType; peer info via tcp.getPeerAddress/getPeerPort"
    timeout: 10
    script: |
      new(tableType, @system.temp.tcpSrv21);
      system.temp.tcpSrv21.fired = false;
      system.temp.tcpSrv21.streamType = "";
      system.temp.tcpSrv21.peerAddr = 0;
      system.temp.tcpSrv21.peerPort = 0;
      script.newScriptObject("on myHandler(sid, refcon) {\r  system.temp.tcpSrv21.fired = true;\r  system.temp.tcpSrv21.streamType = typeof(sid);\r  system.temp.tcpSrv21.peerAddr = tcp.getPeerAddress(sid);\r  system.temp.tcpSrv21.peerPort = tcp.getPeerPort(sid);\r  tcp.closeStream(sid);\r  return true}", @system.temp.tcpSrv21.myHandler);

      local(listenID = tcp.listenStream(9021, 5, @system.temp.tcpSrv21.myHandler));
      local(clientStream = tcp.openStream(tcp.addressEncode("127.0.0.1"), 9021));

      local(deadline = clock.ticks() + 300);
      while (not system.temp.tcpSrv21.fired) and (clock.ticks() < deadline) {
        clock.ticks()
      };

      local(validTypes = (system.temp.tcpSrv21.streamType == longType) and
                         (typeof(system.temp.tcpSrv21.peerAddr) == longType) and
                         (typeof(system.temp.tcpSrv21.peerPort) == longType));

      tcp.closeStream(clientStream);
      tcp.closeListen(listenID);
      delete(@system.temp.tcpSrv21);

      return validTypes
    expected_success: true
    expected_result: "true"
    notes: "Phase 3 - Verify sid is longType; peer addr/port retrieved via verbs (2-param callback)"

# ============================================================================
# CATEGORY 6: tcp.statusStream Integration (Phase 1A verb with Phase 3 use)
# ============================================================================

  - name: "tcp.statusStream - query pending bytes on accepted connection"
    description: "Verify statusStream works on server-accepted connections"
    timeout: 10
    script: |
      new(tableType, @system.temp.tcpSrv22);
      system.temp.tcpSrv22.connected = false;
      system.temp.tcpSrv22.serverStream = -1;
      script.newScriptObject("on myHandler(sid, refcon) {\r  system.temp.tcpSrv22.connected = true;\r  system.temp.tcpSrv22.serverStream = sid;\r  return true}", @system.temp.tcpSrv22.myHandler);

      local(listenID = tcp.listenStream(9022, 5, @system.temp.tcpSrv22.myHandler));
      local(clientStream = tcp.openStream(tcp.addressEncode("127.0.0.1"), 9022));

      local(deadline = clock.ticks() + 300);
      while (not system.temp.tcpSrv22.connected) and (clock.ticks() < deadline) {
        clock.ticks()
      };

      tcp.writeStream(clientStream, "test data");

      local(writeDeadline = clock.ticks() + 60);
      while clock.ticks() < writeDeadline {
        clock.ticks()
      };

      local(bytesPending);
      local(status = tcp.statusStream(system.temp.tcpSrv22.serverStream, @bytesPending));

      local(hasData = bytesPending > 0);

      tcp.closeStream(clientStream);
      tcp.closeStream(system.temp.tcpSrv22.serverStream);
      tcp.closeListen(listenID);
      delete(@system.temp.tcpSrv22);

      return hasData
    expected_success: true
    expected_result: "true"
    notes: "Phase 3 - Verify statusStream works on accepted server connections"

