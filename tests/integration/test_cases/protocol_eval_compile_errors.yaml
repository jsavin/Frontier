# Integration tests for issue #618:
# protocol script/eval must surface compile errors as success: false.
#
# Background: repl_eval_with_variables_value wraps user code as
# `with system.temp.FrontierREPL.variables { ... }` and calls
# langruntraperror. When the inner code fails to compile (e.g. an illegal
# character like a bare LF in some parser paths), the compile error is
# emitted on stderr but the `with` wrapper's evaluation can still report
# success with the wrapper block's default truthy value. Result: callers
# (yaml integration tests, protocol clients) see success: true / value
# "true" / type "boolean" even though no user code ran.
#
# This created false-green test coverage. Issue #586 fix surfaces ~85
# yaml tests that pass on develop only because of this trap.
#
# Fix (Path A from issue #618): when langruntraperror sets an error_msg,
# repl_eval_with_variables_value returns false regardless of langrun's
# return value, and handle_script_eval forwards that as success: false.

tests:
  - name: "protocol script/eval - illegal-character compile error surfaces as failure"
    description: "A script body that doesn't compile must return success: false with an error message, not success: true / value: 'true'. Reproducer: UTF-8 em-dash (U+2014, bytes E2 80 94) inside an expression triggers the scanner's illegal-character error. Before #618, the parser kept going and the wrapper returned success: true with bogus value 'true' (see umbrella issue #620 for the false-greens this masked)."
    protocol_ops:
      - op: "script/eval"
        params:
          expression: "local(x — 1); return x"
        validate:
          success: false

  - name: "protocol script/eval - syntax garbage compile error surfaces as failure"
    description: "Truly malformed source returns success: false (this case already works on develop; included as a regression guard so the fix does not break clean cases)."
    protocol_ops:
      - op: "script/eval"
        params:
          expression: "@@@illegal@@@"
        validate:
          success: false

  - name: "protocol script/eval - clean expression returns success: true"
    description: "A valid expression must continue to return success: true with the right result type. Guards against the fix over-rejecting."
    protocol_ops:
      - op: "script/eval"
        params:
          expression: "1 + 1"
        validate:
          success: true
          result:
            value: "2"
            type: "long"

  # ============================================================
  # Issue #624: bare CR/LF treated as statement separator
  # ============================================================
  # UserTalk grammar: ';' is the ONLY statement separator.
  # \r and \n are whitespace (langscanner / parsepopblanks).
  # Without a ';' between statements, YACC error recovery silently
  # drops the second statement, and evaltree's default return value
  # (true) is what the caller observes.
  #
  # Fix: build_wrapped_script (or its caller) must normalize bare
  # \r and \n to ;\r / ;\n so newlines act as statement separators.
  # The fix must NOT double-insert ';' before a \r that's already
  # preceded by ';' or '{'.

  - name: "protocol script/eval - local across CR separator returns local value (#624)"
    description: "local (x = 5) followed by a bare CR then return x must return 5, not true. Before #624 fix: the CR is whitespace (not a statement separator), YACC error recovery drops 'return x', and evaltree's default true is the observed result."
    protocol_ops:
      - op: "script/eval"
        params:
          expression: "local (x = 5)\rreturn x"
        validate:
          success: true
          result:
            value: "5"
            type: "long"

  - name: "protocol script/eval - local across LF separator returns local value (#624)"
    description: "Same as the CR case but with bare LF. Confirms both line-ending styles are handled by the normalization."
    protocol_ops:
      - op: "script/eval"
        params:
          expression: "local (x = 99)\nreturn x"
        validate:
          success: true
          result:
            value: "99"
            type: "long"

  - name: "protocol script/eval - multi-statement CR-separated script uses last value (#624)"
    description: "Three statements separated by bare CRs: x=1, x=x+1, return x. Without the fix, only x=1 runs and true is returned. With the fix all three run and 2 is returned."
    protocol_ops:
      - op: "script/eval"
        params:
          expression: "local (x = 1)\rx = x + 1\rreturn x"
        validate:
          success: true
          result:
            value: "2"
            type: "long"

  - name: "protocol script/eval - semicolon-separated statements still work after #624 fix"
    description: "Regression guard: scripts that already use ';' must not get double-semicolons or other corruption from the newline normalization."
    protocol_ops:
      - op: "script/eval"
        params:
          expression: "local (x = 7); return x"
        validate:
          success: true
          result:
            value: "7"
            type: "long"
