# Integration tests for issue #618:
# protocol script/eval must surface compile errors as success: false.
#
# Background: repl_eval_with_variables_value wraps user code as
# `with system.temp.FrontierREPL.variables { ... }` and calls
# langruntraperror. When the inner code fails to compile (e.g. an illegal
# character like a bare LF in some parser paths), the compile error is
# emitted on stderr but the `with` wrapper's evaluation can still report
# success with the wrapper block's default truthy value. Result: callers
# (yaml integration tests, protocol clients) see success: true / value
# "true" / type "boolean" even though no user code ran.
#
# This created false-green test coverage. Issue #586 fix surfaces ~85
# yaml tests that pass on develop only because of this trap.
#
# Fix (Path A from issue #618): when langruntraperror sets an error_msg,
# repl_eval_with_variables_value returns false regardless of langrun's
# return value, and handle_script_eval forwards that as success: false.

tests:
  - name: "protocol script/eval - illegal-character compile error surfaces as failure"
    description: "A script body that doesn't compile must return success: false with an error message, not success: true / value: 'true'. Reproducer: UTF-8 em-dash (U+2014, bytes E2 80 94) inside an expression triggers the scanner's illegal-character error. Before #618, the parser kept going and the wrapper returned success: true with bogus value 'true' (see umbrella issue #620 for the false-greens this masked)."
    protocol_ops:
      - op: "script/eval"
        params:
          expression: "local(x — 1); return x"
        validate:
          success: false

  - name: "protocol script/eval - syntax garbage compile error surfaces as failure"
    description: "Truly malformed source returns success: false (this case already works on develop; included as a regression guard so the fix does not break clean cases)."
    protocol_ops:
      - op: "script/eval"
        params:
          expression: "@@@illegal@@@"
        validate:
          success: false

  - name: "protocol script/eval - clean expression returns success: true"
    description: "A valid expression must continue to return success: true with the right result type. Guards against the fix over-rejecting."
    protocol_ops:
      - op: "script/eval"
        params:
          expression: "1 + 1"
        validate:
          success: true
          result:
            value: "2"
            type: "long"

  # ============================================================
  # Issue #624: bare CR/LF treated as statement separator
  # ============================================================
  # UserTalk grammar: ';' is the ONLY statement separator.
  # \r and \n are whitespace (langscanner / parsepopblanks).
  # Without a ';' between statements, YACC error recovery silently
  # drops the second statement, and evaltree's default return value
  # (true) is what the caller observes.
  #
  # Fix: build_wrapped_script (or its caller) must normalize bare
  # \r and \n to ;\r / ;\n so newlines act as statement separators.
  # The fix must NOT double-insert ';' before a \r that's already
  # preceded by ';' or '{'.

  - name: "protocol script/eval - local across CR separator returns local value (#624)"
    description: "local (x = 5) followed by a bare CR then return x must return 5, not true. Before #624 fix: the CR is whitespace (not a statement separator), YACC error recovery drops 'return x', and evaltree's default true is the observed result."
    protocol_ops:
      - op: "script/eval"
        params:
          expression: "local (x = 5)\rreturn x"
        validate:
          success: true
          result:
            value: "5"
            type: "long"

  - name: "protocol script/eval - local across LF separator returns local value (#624)"
    description: "Same as the CR case but with bare LF. Confirms both line-ending styles are handled by the normalization."
    protocol_ops:
      - op: "script/eval"
        params:
          expression: "local (x = 99)\nreturn x"
        validate:
          success: true
          result:
            value: "99"
            type: "long"

  - name: "protocol script/eval - multi-statement CR-separated script uses last value (#624)"
    description: "Three statements separated by bare CRs: x=1, x=x+1, return x. Without the fix, only x=1 runs and true is returned. With the fix all three run and 2 is returned."
    protocol_ops:
      - op: "script/eval"
        params:
          expression: "local (x = 1)\rx = x + 1\rreturn x"
        validate:
          success: true
          result:
            value: "2"
            type: "long"

  - name: "protocol script/eval - semicolon-separated statements still work after #624 fix"
    description: "Regression guard: scripts that already use ';' must not get double-semicolons or other corruption from the newline normalization."
    protocol_ops:
      - op: "script/eval"
        params:
          expression: "local (x = 7); return x"
        validate:
          success: true
          result:
            value: "7"
            type: "long"

  - name: "protocol script/eval - CRLF line endings treated as single separator (#624)"
    description: "Windows-style CRLF must be treated as one statement separator, not two. The \\n is consumed after \\r so only one ';' is inserted and no double-semicolon results."
    protocol_ops:
      - op: "script/eval"
        params:
          expression: "local (x = 42)\r\nreturn x"
        validate:
          success: true
          result:
            value: "42"
            type: "long"

  - name: "protocol script/eval - if block with newline before closing brace (#624)"
    description: "A block-structured script with bare newlines before '}' must not get a spurious ';' before '}'. Grammar rule bracketedstatementlist: '{' statementlist '}' rejects a trailing ';' inside the block body. The '}' guard in normalize_newlines_to_semicolons prevents this."
    protocol_ops:
      - op: "script/eval"
        params:
          expression: "local (x = 0)\rif true {\rx = 1\r}\rreturn x"
        validate:
          success: true
          result:
            value: "1"
            type: "long"

  - name: "protocol script/eval - try/else across newlines does not get split by ';' (#624)"
    description: "When a try { } is followed by an else { }, the closing '}' of the try is followed by a newline before 'else'. Without a '}' in the guard, normalize_newlines_to_semicolons inserts a ';' between '}' and 'else', which splits the try from its else clause. The parser sees a standalone try (executes silently) followed by an orphan 'else' keyword, producing a parse error that the with-wrapper silently masks as 'true'. The fix is to treat '}' the same as ';' and '{' — newlines that follow it must not gain a ';'."
    protocol_ops:
      - op: "script/eval"
        params:
          expression: "local (result = \"ok\");\ntry {\n  local (x = 1 + 1)}\nelse {\n  result = \"error\"};\nreturn result"
        validate:
          success: true
          result:
            value: "ok"
            type: "string"

  - name: "protocol script/eval - try/else recovers from real error (#624)"
    description: "Companion to the previous test: when the try body DOES throw, the else block runs and result becomes 'caught'. Verifies the }-before-else fix doesn't break the error-recovery path."
    protocol_ops:
      - op: "script/eval"
        params:
          expression: "local (result = \"ok\");\ntry {\n  local (x = 1 / 0)}\nelse {\n  result = \"caught\"};\nreturn result"
        validate:
          success: true
          result:
            value: "caught"
            type: "string"

  - name: "protocol script/eval - if/else across newlines (#624)"
    description: "Same shape as try/else: an if's closing '}' followed by newline then 'else' must not gain a ';'. Locks in the same fix for if/else."
    protocol_ops:
      - op: "script/eval"
        params:
          expression: "local (result = \"none\");\nif false {\n  result = \"yes\"}\nelse {\n  result = \"no\"};\nreturn result"
        validate:
          success: true
          result:
            value: "no"
            type: "string"

  - name: "protocol script/eval - comment on own line between } and else (#635)"
    description: "A '//' line comment between the closing '}' of a try/if body and the 'else' on a separate line must not break the composite statement. The peek-past-noise loop needs to skip line comments to find 'else'. Without this, the normalizer sees '/' instead of 'else' and inserts ';' before the comment line — splitting try from else (same failure mode as the original #635 P0)."
    protocol_ops:
      - op: "script/eval"
        params:
          expression: "local (result = \"ok\");\ntry {\n  local (x = 1 / 0)}\n// recover gracefully\nelse {\n  result = \"caught\"};\nreturn result"
        validate:
          success: true
          result:
            value: "caught"
            type: "string"

  - name: "protocol script/eval - canonical inline '};' between try and else (#635)"
    description: "Canonical UT source inlines '};' at end of last statement of a block. 'try { body };\nelse { ... }' is the production-shape case (vs. the C-style multi-line cases in the previous tests). Verifies the normalizer handles the inline form correctly."
    protocol_ops:
      - op: "script/eval"
        params:
          expression: "local (result = \"ok\"); try { local (x = 1 / 0)}\nelse { result = \"caught\"}; return result"
        validate:
          success: true
          result:
            value: "caught"
            type: "string"

  - name: "protocol script/eval - nested try/else across newlines (#635)"
    description: "Two levels of nested try/else, each spanning a newline. Locks in correct lookahead behaviour through stacked '}}' transitions. Inner try catches, outer try sees no error and passes through."
    protocol_ops:
      - op: "script/eval"
        params:
          expression: "local (result = \"start\");\ntry {\n  try {\n    local (x = 1 / 0)}\n  else {\n    result = \"inner\"}}\nelse {\n  result = \"outer\"};\nreturn result"
        validate:
          success: true
          result:
            value: "inner"
            type: "string"

  - name: "protocol script/eval - case/else across newlines (#635)"
    description: "case statements use the same caseheader casebody elsetoken bracketedstatementlist grammar as try/else and if/else. The '}\\nelse' boundary should behave identically. Locks in the third UserTalk construct that exercises the }-else lookahead so future refactors can't silently regress it."
    protocol_ops:
      - op: "script/eval"
        params:
          expression: "local (n = 2);\nlocal (result = \"\");\ncase n {\n  1 { result = \"one\"};\n  2 { result = \"two\"}}\nelse {\n  result = \"other\"};\nreturn result"
        validate:
          success: true
          result:
            value: "two"
            type: "string"

  # ============================================================
  # Issue #620 burndown: newline-normalization regression sweep
  # ============================================================
  # Goal: lock in every composite/block grammar production where the
  # closing '}' of a block is followed by a continuation or where the
  # construct interacts with the protocol normalizer's bare-CR/LF -> ';'
  # rewrite. The grammar (langparser.y) productions audited are:
  #
  #   - handlerheader bracketedstatementlist        (on f () { ... })
  #   - loopheader bracketedstatementlist           (loop { ... }, while x { ... })
  #   - forloopheader / forinloopheader             (for i = 1 to 3 { ... })
  #   - ifheader bracketedstatementlist [elsetoken ...]
  #   - bundleheader bracketedstatementlist         (bundle { ... })
  #   - caseheader '{' casebody '}' [elsetoken ...]
  #   - withheader bracketedstatementlist           (with table { ... })
  #   - tryheader bracketedstatementlist [elsetoken ...]
  #
  # Only the three '... [elsetoken bracketedstatementlist]' forms
  # (if/case/try) attach a continuation to the closing '}'. All other
  # forms terminate at '}' — the next token starts a new statement and
  # requires a ';' separator. The default normalizer behavior (insert
  # ';' after '}' unless the lookahead sees else/;/}/EOF) is therefore
  # correct for the other forms. These tests pin that down so any future
  # change to the lookahead (e.g. broadening which tokens it suppresses
  # ';' before) can't silently regress these constructs.

  - name: "protocol script/eval - on handler def then call across newline (#620)"
    description: "on f () { body } is a handler definition. After the closing '}', the next statement (the call site) requires ';'. Default normalizer behavior must insert one. Regression guard for the handlerheader bracketedstatementlist grammar production."
    protocol_ops:
      - op: "script/eval"
        params:
          expression: "on f () {\n  return 42\n}\nreturn f()"
        validate:
          success: true
          result:
            value: "42"
            type: "long"

  - name: "protocol script/eval - loop { body } across newlines (#620)"
    description: "loop { body } body is a loopheader-bracketedstatementlist production. Closing '}' terminates the loop; the next statement (return) needs ';' between them, which the normalizer's default behavior provides. Includes break inside an if to exercise nested '}' boundaries."
    protocol_ops:
      - op: "script/eval"
        params:
          expression: "local (s = 0);\nlocal (i = 0);\nloop {\n  if i >= 3 {\n    break\n  };\n  s = s + i;\n  i = i + 1\n}\nreturn s"
        validate:
          success: true
          result:
            value: "3"
            type: "long"

  - name: "protocol script/eval - while header { body } across newlines (#620)"
    description: "while cond { body } reuses loopheader (whiletoken expr) production. Same '}\\nreturn' attachment pattern as the loop test. Regression guard."
    protocol_ops:
      - op: "script/eval"
        params:
          expression: "local (s = 0);\nlocal (i = 0);\nwhile i < 3 {\n  s = s + i;\n  i = i + 1\n}\nreturn s"
        validate:
          success: true
          result:
            value: "3"
            type: "long"

  - name: "protocol script/eval - for i = 1 to 3 across newlines (#620)"
    description: "forloopheader-bracketedstatementlist production. Closing '}' is terminal; default ';' insertion before return is correct."
    protocol_ops:
      - op: "script/eval"
        params:
          expression: "local (s = 0);\nfor i = 1 to 3 {\n  s = s + i\n}\nreturn s"
        validate:
          success: true
          result:
            value: "6"
            type: "long"

  - name: "protocol script/eval - with table { body } across newlines (#620)"
    description: "withheader-bracketedstatementlist production. The 'with' block has no else continuation. Closing '}' is terminal; '}' followed by '\\nreturn' must gain a ';'. Test uses a non-mutating witness — assigns to local 'q' inside the with block so the namespace push/pop exercises the production without writing into system.temp."
    protocol_ops:
      - op: "script/eval"
        params:
          expression: "local (r = 0);\nwith system.temp {\n  local (q = 7);\n  r = q\n}\nreturn r"
        validate:
          success: true
          result:
            value: "7"
            type: "long"

  - name: "protocol script/eval - bundle { body } across newlines (#620)"
    description: "bundleheader-bracketedstatementlist production groups statements without changing scope. Closing '}' is terminal; '}' before '\\nreturn' must get ';'."
    protocol_ops:
      - op: "script/eval"
        params:
          expression: "local (s = 0);\nbundle {\n  s = s + 1;\n  s = s + 2\n}\nreturn s"
        validate:
          success: true
          result:
            value: "3"
            type: "long"

  - name: "protocol script/eval - fileloop { body } across newlines (#620)"
    description: "fileloopheader-bracketedstatementlist production (langparser.y:652 — fileloop (var in fspec) {...}). No else continuation; closing '}' is terminal; '}' before '\\nreturn' must gain a ';'. Wrapped in 'if false' so the parser exercises the production without touching the filesystem (compile-time coverage, not behavioral iteration)."
    protocol_ops:
      - op: "script/eval"
        params:
          expression: "local (n = 0);\nif false {\n  fileloop (f in @system.temp) {\n    n = n + 1}}\nreturn n"
        validate:
          success: true
          result:
            value: "0"
            type: "long"

  - name: "protocol script/eval - try without else across newlines (#620)"
    description: "try { body } with NO else clause is a separate production (tryheader bracketedstatementlist, no elsetoken). The closing '}' is terminal — next statement requires ';'. Lookahead must NOT find 'else' here, because there isn't one — it's a return."
    protocol_ops:
      - op: "script/eval"
        params:
          expression: "local (s = 1);\ntry {\n  s = 2\n}\nreturn s"
        validate:
          success: true
          result:
            value: "2"
            type: "long"

  - name: "protocol script/eval - case without else, multiple clauses (#620)"
    description: "case header { ... } without an else clause. Inside casebody, case clauses are separated by ';' (grammar: casebody ';' expr optionalstatementlist). The closing '}' between one clause's body and the next clause's label needs a ';' inserted — the default normalizer behavior provides it. Without correct insertion, the parser cannot distinguish the second clause label from a stray expression."
    protocol_ops:
      - op: "script/eval"
        params:
          expression: "local (n = 2);\nlocal (r = \"\");\ncase n {\n  1 {\n    r = \"one\"\n  };\n  2 {\n    r = \"two\"\n  }\n}\nreturn r"
        validate:
          success: true
          result:
            value: "two"
            type: "string"

  # ------------------------------------------------------------
  # Whitespace and comment edge cases for the }-else lookahead
  # ------------------------------------------------------------
  # The peek loop in normalize_newlines_to_semicolons skips spaces, tabs,
  # CR, LF, '//' line comments, and UTF-8 '«...»' curly comments to find
  # the next real token after '}'. These tests pin down the corners.

  - name: "protocol script/eval - blank lines between } and else (#620)"
    description: "Multiple blank lines between try's closing '}' and 'else' must still attach. The peek loop's whitespace skip is greedy across CR/LF runs."
    protocol_ops:
      - op: "script/eval"
        params:
          expression: "local (r = \"ok\");\ntry {\n  local (x = 1 / 0)\n}\n\n\nelse {\n  r = \"caught\"\n}\nreturn r"
        validate:
          success: true
          result:
            value: "caught"
            type: "string"

  - name: "protocol script/eval - leading newlines at start of script (#620)"
    description: "Script that begins with bare CR/LF characters. prev_nonws starts at '\\0' which is in the no-insert guard, so leading newlines don't get spurious ';' prepended. Regression guard for the start-of-script case."
    protocol_ops:
      - op: "script/eval"
        params:
          expression: "\n\nlocal (x = 5)\nreturn x"
        validate:
          success: true
          result:
            value: "5"
            type: "long"

  - name: "protocol script/eval - // comment at very end of script, no trailing newline (#620)"
    description: "A '//' line comment as the final token in the script, with no trailing newline. Exercises the EOF-during-comment-skip path. The scanner ignores the comment; the result is the value returned before it."
    protocol_ops:
      - op: "script/eval"
        params:
          expression: "local (x = 5);\nreturn x\n// trailing comment"
        validate:
          success: true
          result:
            value: "5"
            type: "long"

  - name: "protocol script/eval - whitespace-only script does not crash (#620)"
    description: "A script consisting of only spaces, tabs, and bare newlines must not crash the normalizer or the parser. Documents whatever the normalizer produces — currently returns success: true with the with-wrapper's default truthy value (no user code ran). The exact value is incidental; what matters is the absence of a crash."
    protocol_ops:
      - op: "script/eval"
        params:
          expression: "   \n\n   "
        validate:
          success: true

  # ------------------------------------------------------------
  # Trailing-newline handling (#620 regression cluster)
  # ------------------------------------------------------------
  # YAML `|` block scalars always append a trailing newline to the script.
  # Before the fix, normalize_newlines_to_semicolons inserted a ';' before
  # that trailing '\n' (since prev_nonws was an identifier / paren / digit /
  # quote), producing 'lastexpr;\n'. The build_wrapped_script then appended
  # the suffix '\n}', giving the with-wrapper a trailing empty statement.
  # evaltree's default value for an empty trailing statement is the truthy
  # default the wrapper carries — the user observed 'true' instead of the
  # real last-expression value. This broke ~30+ callback_* and bigstring
  # tests after #635 tightened normalization.
  #
  # Fix: when peeking past whitespace and comments after a bare \r/\n, if
  # nothing real follows before EOF, suppress the ';' insertion. The
  # newline is purely trailing and has no statement after it.

  - name: "protocol script/eval - trailing newline after expression does not inject empty statement (#620)"
    description: "YAML | blocks add a trailing '\\n'. With prev_nonws being a digit/identifier/paren, the normalizer used to insert ';' before that trailing '\\n', then build_wrapped_script's '\\n}' suffix made the with-block end in an empty statement that evaluated to the wrapper's truthy default. The user's last expression value was lost. Reproducer: a multi-line callback definition followed by a call. Expected: the call's return value, not 'true'."
    protocol_ops:
      - op: "script/eval"
        params:
          expression: "on tcpHandler(stream, addr, port) {\n  local(s = stream);\n  local(a = addr);\n  local(p = port);\n  return s + a + p\n};\ntcpHandler(100, 200, 300)\n"
        validate:
          success: true
          result:
            value: "600"
            type: "long"

  - name: "protocol script/eval - trailing newline after simple expression preserves value (#620)"
    description: "Minimal reproducer: '1 + 2\\n' must return 3, not 'true'. Pins the trailing-newline behavior without any callback or block structure."
    protocol_ops:
      - op: "script/eval"
        params:
          expression: "1 + 2\n"
        validate:
          success: true
          result:
            value: "3"
            type: "long"

  - name: "protocol script/eval - trailing semicolon plus newline preserves last value (#620)"
    description: "When the user explicitly writes a trailing ';' followed by '\\n', the with-block still ends with an empty statement and used to evaluate to the wrapper default. After the fix, the parser sees a normal terminated last statement and the value of the preceding expression is returned."
    protocol_ops:
      - op: "script/eval"
        params:
          expression: "local(x = 5);\nx + 10;\n"
        validate:
          success: true
          result:
            value: "15"
            type: "long"

  - name: "protocol script/eval - trailing whitespace before EOF preserves last value (#620)"
    description: "Trailing spaces and tabs after the final '\\n' must not change the result. The normalizer's lookahead skips all inter-token noise (whitespace, line and curly comments) when deciding whether a real statement follows."
    protocol_ops:
      - op: "script/eval"
        params:
          expression: "local(x = 7);\nx * 2\n   \t  \n"
        validate:
          success: true
          result:
            value: "14"
            type: "long"

  - name: "protocol script/eval - trailing // comment after final expression preserves value (#620)"
    description: "A '//' line comment after the final expression's newline must not inject a spurious ';' that swallows the value. The lookahead recognises that no real statement follows."
    protocol_ops:
      - op: "script/eval"
        params:
          expression: "local(x = 4);\nx + 1\n// trailing comment after newline\n"
        validate:
          success: true
          result:
            value: "5"
            type: "long"

  - name: "protocol script/eval - string literal containing }\\nelse documents pre-existing scanner gap (#620)"
    description: "DOCUMENTS A KNOWN PRE-EXISTING LIMITATION (not a normalizer bug, tracked separately): the normalizer in repl_variables.c does not track string-literal state, so a '}\\nelse' inside a string literal triggers the '}' lookahead from #635 and suppresses ';' insertion. The observed net behavior is that the string content appears to collapse to '}else {' (7 chars) — the '\\n' has been dropped somewhere in the pipeline. Best current hypothesis is that the scanner consumes the bare LF as part of its CR/LF normalization, but this has not been verified end-to-end. File a follow-up issue if the exact scanner behavior needs to be pinned down. This test locks in the current OBSERVED output as the contract; any future change (string-state tracking in the normalizer, scanner LF preservation, or both) will surface as a test-update rather than a silent semantic shift."
    protocol_ops:
      - op: "script/eval"
        params:
          expression: "local (s = \"}\nelse {\");\nreturn s"
        validate:
          success: true
          result:
            value: "}else {"
            type: "string"

  # ------------------------------------------------------------
  # Transition-matrix coverage (refactor follow-up to #628/#635/#640)
  # ------------------------------------------------------------
  # The normalize_newlines_to_semicolons function makes its emit/suppress
  # decision from a (prev_kind, next_kind) pair where prev_kind is one of
  # {start, ';', '{', '}', other} and next_kind (after peek-past-noise) is
  # one of {EOF, 'else', ';', '}', other}. Earlier tests in this file cover
  # the most common cells (start×other, '}'×else, '}'×other, other×EOF, ...).
  # The tests below fill cells that were previously implicit — locking the
  # behavior in so a table-driven rewrite of the function can't silently
  # regress these transitions.

  - name: "protocol script/eval - matrix ';' x '}' explicit semicolon before newline-close-brace"
    description: "Cell (prev=';', next='}'): inside a block, the last inner statement is explicitly terminated with ';' followed by a newline before the closing '}'. Pattern: 'if true { y = 5;\\n}'. The ';' guard suppresses a synthetic ';' before the newline (already separated), so the parser sees a valid block with one terminated statement. Witnesses by reading the assigned-to variable after the block."
    protocol_ops:
      - op: "script/eval"
        params:
          expression: "local (y = 0);\nif true {\n  y = 5;\n}\nreturn y"
        validate:
          success: true
          result:
            value: "5"
            type: "long"

  - name: "protocol script/eval - matrix '{' x '}' empty block across newlines"
    description: "Cell (prev='{', next='}'): an empty block written on multiple lines — '{' then bare newline(s) then '}'. The '{' guard suppresses ';' before the newline, and the lookahead correctly identifies '}' as the next real byte. Result: the parser sees a valid empty block. The if-false branch never runs; the witness is the outer return value, confirming the script compiled and executed."
    protocol_ops:
      - op: "script/eval"
        params:
          expression: "if false {\n}\nreturn 7"
        validate:
          success: true
          result:
            value: "7"
            type: "long"

  - name: "protocol script/eval - matrix other x ';' bare newline followed by explicit semicolon"
    description: "Cell (prev=other, next=';'): an unterminated top-level statement followed by a bare newline followed by an explicit ';' on the next line. Pattern: 'local(x=3)\\n;return x'. prev_nonws after ')' is other; the lookahead sees ';' as the next real byte. The normalizer EMITS a synthetic ';' before the newline, producing 'local(x=3);\\n;return x'. The parser accepts an empty statement between the two semicolons and returns x."
    protocol_ops:
      - op: "script/eval"
        params:
          expression: "local (x = 3)\n;return x"
        validate:
          success: true
          result:
            value: "3"
            type: "long"

  - name: "protocol script/eval - matrix '}' x ';' closing brace followed by newline then explicit semicolon"
    description: "Cell (prev='}', next=';'): a block's closing '}' is followed by a bare newline, then an explicit ';' on the next line. The '}' guard's lookahead sees ';' and suppresses the synthetic ';' insertion (the explicit ';' already provides the separator). Without the guard, the output would be '}\\n;;next' — the parser would see an extra empty statement that, while syntactically harmless, is not what the user wrote. This pins down that '}' x ';' is a suppression cell, not an emission cell."
    protocol_ops:
      - op: "script/eval"
        params:
          expression: "local (z = 0);\nif true {\n  z = 9\n}\n;return z"
        validate:
          success: true
          result:
            value: "9"
            type: "long"

  # ------------------------------------------------------------
  # PREV_BINOP class (5th normalizer hole, #620 burndown)
  # ------------------------------------------------------------
  # When a line ends with a binary-operator token (boolean 'and'/'or',
  # relational '==' '>=' '<=' '!=' '>' '<', arithmetic '+' '-' '*' '/',
  # comma, or open paren), the next line is a continuation of the same
  # expression — not a new statement. Earlier versions of the normalizer
  # treated these as PREV_OTHER and emitted a synthetic ';' before the
  # newline, producing source like 'x and; y' that the parser rejects.
  # The fix introduces a PREV_BINOP prev-kind that suppresses ';' for
  # every next-kind: a continuation is a continuation regardless of what
  # follows.

  - name: "protocol script/eval - PREV_BINOP boolean 'and' at EOL allows continuation"
    description: "Pattern: 'return true and\\n true'. Before the PREV_BINOP fix, the normalizer treated trailing 'and' as PREV_OTHER and inserted ';' before the newline ('and;'), which is a parse error. With PREV_BINOP, the ';' is suppressed and the expression evaluates correctly to true."
    protocol_ops:
      - op: "script/eval"
        params:
          expression: "return true and\n true"
        validate:
          success: true
          result:
            value: "true"
            type: "boolean"

  - name: "protocol script/eval - PREV_BINOP boolean 'or' at EOL allows continuation"
    description: "Pattern: 'return false or\\n true'. Mirrors the 'and' case — 'or' is a binary operator token, so a newline immediately after it must not introduce a ';'."
    protocol_ops:
      - op: "script/eval"
        params:
          expression: "return false or\n true"
        validate:
          success: true
          result:
            value: "true"
            type: "boolean"

  - name: "protocol script/eval - PREV_BINOP relational '==' at EOL allows continuation"
    description: "Pattern: 'return 1 ==\\n 1'. The multi-char '==' token ends in '=' — single '=' would be assignment, but the byte before is also '=', so the trailing token is '=='. PREV_BINOP must distinguish == (relational) from = (assignment) by walking back through the output buffer."
    protocol_ops:
      - op: "script/eval"
        params:
          expression: "return 1 ==\n 1"
        validate:
          success: true
          result:
            value: "true"
            type: "boolean"

  - name: "protocol script/eval - PREV_BINOP arithmetic '+' at EOL allows continuation"
    description: "Pattern: 'return 1 +\\n 2'. Single-character arithmetic operators are unambiguous as continuations — '+' as the last non-whitespace byte at EOL means another operand follows."
    protocol_ops:
      - op: "script/eval"
        params:
          expression: "return 1 +\n 2"
        validate:
          success: true
          result:
            value: "3"
            type: "long"

  - name: "protocol script/eval - PREV_BINOP comma at EOL allows continuation"
    description: "Pattern: 'string.padwithzeros (5,\\n 3)'. Comma is a list/argument separator; a newline after it must NOT terminate the call."
    protocol_ops:
      - op: "script/eval"
        params:
          expression: "return string.padwithzeros (5,\n 3)"
        validate:
          success: true
          result:
            value: "005"
            type: "string"

  - name: "protocol script/eval - PREV_BINOP open paren at EOL allows continuation"
    description: "Pattern: 'string.padwithzeros (\\n 5, 3)'. Open paren is the start of a parenthesized expression / argument list; the bytes after the newline are the body. PREV_BINOP must not be confused with PREV_LBRACE — '(' is paren, '{' is block-open."
    protocol_ops:
      - op: "script/eval"
        params:
          expression: "return string.padwithzeros (\n 5, 3)"
        validate:
          success: true
          result:
            value: "005"
            type: "string"

  - name: "protocol script/eval - PREV_BINOP word-boundary 'and' not confused with identifier"
    description: "Regression guard: the PREV_BINOP detector must require a word boundary before 'and'/'or' so identifiers like 'band' or 'kand' don't trigger continuation behavior. Pattern: 'local (band = 7)\\n return band' — the variable 'band' ends in 'and' but the byte before 'and' is 'b' (identifier-continuing), so this is a regular statement followed by 'return', and ';' MUST be inserted."
    protocol_ops:
      - op: "script/eval"
        params:
          expression: "local (band = 7)\n return band"
        validate:
          success: true
          result:
            value: "7"
            type: "long"

  - name: "protocol script/eval - PREV_BINOP single '=' assignment NOT treated as binop"
    description: "Regression guard: a single trailing '=' must NOT be treated as a binary operator (which would suppress ';' insertion). Without the byte-before-'=' disambiguation in prev_is_binop, this lookup could misclassify single '=' as the tail of '==' / '>=' / '<=' / '!=' and incorrectly trigger BINOP. By checking the byte before '=' and requiring it to be one of '=','>','<','!', we preserve the existing behavior: 'x =\\n 5' is a parse error (the normalizer emits ';' producing 'x =;' which the parser rejects). This pins down that the BINOP class does not accidentally subsume bare assignment."
    protocol_ops:
      - op: "script/eval"
        params:
          expression: "local (x = 0); x =\n 5; return x"
        validate:
          success: false
