# Thread Verb Integration Tests - Phase 1
#
# Foundation tests for thread verb functionality.
# Validates basic thread operations: creation, execution, sleep, kill, error handling.
#
# These tests validate thread behavior through observable side effects using wall-clock timing.
# Phase 2 will integrate tick-control harness for controlled timing.
#
# Timeouts set to 3s (tests complete in ~1s, margin for CI stability)
#
# Run with: python3 runner.py --filter thread_verbs

description: "Thread Verb Integration Tests - Phase 1 Foundation"

setup: |
  # Initialize test data structures
  new(tableType, @system.temp.threadData)
  new(tableType, @system.temp.threadFlags)
  new(tableType, @system.temp.threadTiming)

cleanup: |
  # Clean up test data (defensive - handles cases where setup fails midway)
  if defined(@system.temp.threadData) { delete(@system.temp.threadData) }
  if defined(@system.temp.threadFlags) { delete(@system.temp.threadFlags) }
  if defined(@system.temp.threadTiming) { delete(@system.temp.threadTiming) }

tests:
  # Test 1: Basic thread creation and execution
  - name: "thread.evaluate - execute simple script in new thread"
    description: |
      Verify that thread.evaluate() creates a new thread, executes the provided
      script, and completes successfully.
    script: |
      thread.evaluate("system.temp.threadFlags.basicThreadRan = true")

      // Give thread time to execute
      clock.waitSeconds(1)

      return system.temp.threadFlags.basicThreadRan
    expected_result: true
    expected_success: true
    timeout: 3

  # Test 2: Thread with return value via shared storage
  - name: "thread.evaluate - return value from thread"
    description: |
      Verify that values computed in a thread can be captured via shared
      table storage (since thread.evaluate doesn't return directly).
    script: |
      thread.evaluate("system.temp.threadData.result = 42; system.temp.threadData.message = \"computation complete\"")

      // Give thread time to execute
      clock.waitSeconds(1)

      return system.temp.threadData.result == 42 and \
             system.temp.threadData.message == "computation complete"
    expected_result: true
    expected_success: true
    timeout: 3

  # Test 3: Thread sleep and wake
  - name: "thread.sleepFor - thread sleeps and wakes"
    description: |
      Verify that thread.sleepFor(N) causes thread to sleep.
      This test validates the sleep mechanism works (not exact timing).
    script: |
      thread.evaluate("thread.sleepFor(100); system.temp.threadFlags.sleepCompleted = true")

      // Give thread time to sleep and wake
      clock.waitSeconds(2)

      return system.temp.threadFlags.sleepCompleted
    expected_result: true
    expected_success: true
    timeout: 3

  # Test 4: Thread wake - manually wake sleeping thread
  - name: "thread.wake - wake sleeping thread"
    description: |
      Verify that thread.wake() wakes a sleeping thread.
    script: |
      local(threadID = thread.evaluate("thread.sleepFor(10000); system.temp.threadFlags.wokByWake = true"))

      // Let thread start sleeping
      clock.waitSeconds(1)

      // Wake the thread
      thread.wake(threadID)

      // Let thread execute and mark completion
      clock.waitSeconds(1)

      return system.temp.threadFlags.wokByWake
    expected_result: true
    expected_success: true
    timeout: 3

  # Test 5: Thread kill - terminate thread
  - name: "thread.kill - terminate thread"
    description: |
      Verify that thread.kill() terminates a thread.
    script: |
      local(threadID = thread.evaluate("system.temp.threadFlags.threadStarted = true; thread.sleepFor(10000); system.temp.threadFlags.threadCompletedAfterKill = true"))

      // Let thread start and start sleeping
      clock.waitSeconds(1)

      // Kill the thread
      thread.kill(threadID)

      // Let system process
      clock.waitSeconds(1)

      return system.temp.threadFlags.threadStarted and \
             not (system.temp.threadFlags.threadCompletedAfterKill)
    expected_result: true
    expected_success: true
    timeout: 3

  # Test 6: Error handling in thread
  - name: "thread.evaluate - script error in thread is handled gracefully"
    description: |
      Verify that script errors in thread context don't crash the system.
    script: |
      thread.evaluate("system.temp.threadFlags.errorThreadStarted = true; scriptError(\\\"intentional error\\\"); system.temp.threadFlags.neverExecute = true")

      // Let thread run and error
      clock.waitSeconds(1)

      // System should still be responsive
      system.temp.threadFlags.systemStillWorks = true

      return system.temp.threadFlags.errorThreadStarted and \
             not (system.temp.threadFlags.neverExecute) and \
             system.temp.threadFlags.systemStillWorks
    expected_result: true
    expected_success: true
    timeout: 3

  # Test 7: Multiple threads independent operation
  - name: "thread.evaluate - multiple threads run independently"
    description: |
      Verify that multiple threads can run simultaneously without interference.
    script: |
      thread.evaluate("system.temp.threadFlags.thread1Ran = true")
      thread.evaluate("system.temp.threadFlags.thread2Ran = true")

      // Give threads time to execute
      clock.waitSeconds(2)

      return system.temp.threadFlags.thread1Ran and \
             system.temp.threadFlags.thread2Ran
    expected_result: true
    expected_success: true
    timeout: 3

  # Test 8: Thread accessing ODB
  - name: "thread.evaluate - safely modify ODB during execution"
    description: |
      Verify that threads can safely create and modify ODB structures.
    script: |
      thread.evaluate("new(tableType, @system.temp.threadData.innerTable); system.temp.threadData.innerTable.a = 10; system.temp.threadData.innerTable.b = 20; system.temp.threadData.innerTable.c = system.temp.threadData.innerTable.a + system.temp.threadData.innerTable.b")

      // Give thread time to execute
      clock.waitSeconds(1)

      return system.temp.threadData.innerTable.a == 10 and \
             system.temp.threadData.innerTable.b == 20 and \
             system.temp.threadData.innerTable.c == 30
    expected_result: true
    expected_success: true
    timeout: 3

  # Test 9: Thread count reporting
  - name: "thread.getCount - report active thread count"
    description: |
      Verify that thread.getCount() reports number of active threads.
    script: |
      local(countBefore = thread.getCount())

      thread.evaluate("system.temp.threadData.countDuringThread = thread.getCount(); clock.waitSeconds(1)")

      // Should have at least 1 thread (the new one)
      clock.waitSeconds(2)

      local(countAfter = thread.getCount())

      return system.temp.threadData.countDuringThread >= 1 and countAfter >= 0
    expected_result: true
    expected_success: true
    timeout: 3

  # Test 10: Thread getCurrentID reports valid ID
  - name: "thread.getCurrentID - get current thread ID"
    description: |
      Verify that thread.getCurrentID() returns valid thread ID.
    script: |
      local(mainThreadID = thread.getCurrentID())

      thread.evaluate("system.temp.threadData.threadIDInThread = thread.getCurrentID()")

      // Let thread execute
      clock.waitSeconds(1)

      return mainThreadID > 0 and system.temp.threadData.threadIDInThread > 0
    expected_result: true
    expected_success: true
    timeout: 3
