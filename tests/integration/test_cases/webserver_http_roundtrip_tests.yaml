  - name: "HTTP round-trip - large response body"
    skip: true
    skip_reason: "Accept-callback echo pattern still broken after unit-2-2 landed (re-verified 2026-08-10 on develop 1cc71bc3b): a single non-blocking tcp.readStream + tcp.writeStream inside a tcp.listenStream callback never delivers the response to the client, so the assertion returns false. Same residual root-cause family as the baselined tcp client_verbs/server_verbs echo failures (issues #710, #333). Un-skip when that family is fixed, or migrate the handlers to the state-driven tcp.readStreamBytes pattern unit-2-2 recommends."
    description: "Server returns a response body larger than 255 bytes"
    timeout: 15
    script: |
      on httpHandler(streamID, remoteAddr, remotePort) {
        local(request = tcp.readStream(streamID, 4096));
        local(body = string.filledString("X", 500));
        local(response = "HTTP/1.1 200 OK\r\nContent-Length: 500\r\nConnection: close\r\n\r\n" + body);
        tcp.writeStream(streamID, response);
        tcp.closeStream(streamID);
        return true
      };

      local(listenID = tcp.listenStream(49206, 5, @httpHandler));

      try {
        local(clientStream = tcp.openStream(tcp.addressEncode("127.0.0.1"), 49206));
        tcp.writeStream(clientStream, "GET /big HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n");

        thread.sleepFor(100);

        local(response = "");
        local(startTicks = clock.ticks());
        while (sizeOf(response) == 0) and ((clock.ticks() - startTicks) < 200) {
          response = tcp.readStream(clientStream, 4096);
          thread.sleepFor(10)
        };

        tcp.closeStream(clientStream);
        tcp.closeListen(listenID);

        local(headersOK = (response contains "200 OK") and (response contains "Content-Length: 500"));
        local(bodyStart = string.patternMatch("\r\n\r\n", response) + 4);
        local(body = string.mid(response, bodyStart, sizeOf(response) - bodyStart + 1));
        local(bodyDelivered = sizeOf(body) >= 500);
        local(bodyContent = response contains string.filledString("X", 500));
        return headersOK and bodyDelivered and bodyContent
      }
      else {
        tcp.closeListen(listenID);
        scriptError(tryError)
      }
    expected_success: true
    expected_result: "true"
    notes: "Validates responses larger than bigstring limit (255 bytes) work over TCP - checks headers, size, and body content"

  # =============================================================================
  # CATEGORY 2: Full Webserver Stack (inetd + webserver dispatch)
  # These tests exercise the complete inetd/webserver infrastructure.
  #
  # Un-skipped in Unit 3.3.  Their previous skip_reason ("fwsNetEvent* functions
  # are stubbed in headless mode; requires migration to tcp_* API") is stale:
  # that migration has landed -- Common/source/langhtml.c now maps the
  # fwsNetEvent* entry points onto the tcp_* API for headless builds, and Unit
  # 3.1 demonstrated the full inetd -> webserver.server -> webserver.dispatch
  # chain serving pages (webserver_inetd_e2e.yaml).
  #
  # Both tests also carried three bugs that would have failed them even with the
  # stack working, all fixed here:
  #   - thread.sleepFor (N) takes SECONDS, so sleepFor(100) parked the test for
  #     100s and blew the 30s timeout. Now thread.sleepTicks (N) (60/sec).
  #   - the single-shot read loop exited on the first non-empty read, which can
  #     land mid-response. Now the same two-phase read the other webserver E2E
  #     files use: accumulate to end-of-headers, then read until close.
  #   - 'contains' is a LITERAL substring match with no wildcards, so the
  #     second test's `response contains "HTTP/1."` only ever matched by luck of
  #     the status line's spelling. It now asserts the real status text.
  # Both restore user.inetd.config.http.port on every exit path (#852).
  # =============================================================================

  - name: "webserver stack - inetd start and HTTP GET via webserver dispatch"
    description: "Full stack: inetd.startOne -> HTTP request -> webserver.dispatch -> responder -> response"
    requires_system_root: true
    timeout: 30
    script: |
      webserver.init();

      local(port = 49207);

      // ALL pre-state reads happen before ANY write, so every snapshot records
      // the true pre-test value. Reading preHelloEnabled after the port write
      // would still be correct today, but the read-then-write ordering is the
      // invariant worth keeping -- it is what makes the restores below sound.
      local(originalPort = user.inetd.config.http.port);
      // Dispatch iterates user.webserver.responders -- enabling only the
      // webserver.data copy (as this test originally did) has no effect.
      local(preHelloEnabled = user.webserver.responders.helloWorld.enabled);

      local(hasStatus200 = false);
      local(hasBody = false);
      local(stream = 0);
      local(listenerUp = false);

      // Mutations live inside the try so a throw during setup still restores
      // the port and the responder-enabled flag into the shared session.
      try {
        user.inetd.config.http.port = port;
        user.webserver.responders.helloWorld.enabled = true;

        if not inetd.startOne(@user.inetd.config.http) {
          scriptError("inetd.startOne failed for port " + port)
        };
        listenerUp = true;
        thread.sleepTicks(50);

        stream = tcp.openAddrStream(tcp.addressEncode("127.0.0.1"), port);
        tcp.writeStream(stream, "GET /helloworld HTTP/1.0\r\nHost: localhost\r\nConnection: close\r\n\r\n");

        local(response = "");
        local(startTicks = clock.ticks());
        local(headersComplete = false);
        local(connectionClosed = false);
        while (not connectionClosed) and ((clock.ticks() - startTicks) < 300) {
          local(chunk = tcp.readStream(stream, 4096));
          if sizeOf(chunk) > 0 {
            response = response + chunk
          }
          else {
            if headersComplete {
              connectionClosed = true
            }
          };
          if (not headersComplete) and (response contains "\r\n\r\n") {
            headersComplete = true
          };
          thread.sleepTicks(10)
        };

        tcp.closeStream(stream);
        stream = 0;

        if not connectionClosed {
          scriptError("read loop timed out -- server never closed connection on port " + port)
        };

        hasStatus200 = response contains "200 OK";
        hasBody = response contains "Hello World"
      }
      else {
        if stream != 0 {
          tcp.closeStream(stream);
          stream = 0
        };
        if listenerUp {
          inetd.stopOne(@user.inetd.config.http);
          thread.sleepTicks(30)
        };
        user.webserver.responders.helloWorld.enabled = preHelloEnabled;
        user.inetd.config.http.port = originalPort;
        scriptError(tryError)
      };

      inetd.stopOne(@user.inetd.config.http);
      thread.sleepTicks(30);
      user.webserver.responders.helloWorld.enabled = preHelloEnabled;
      user.inetd.config.http.port = originalPort;

      return hasStatus200 and hasBody
    expected_success: true
    expected_result: "true"
    notes: |
      Validates the entire HTTP pipeline through the built-in helloWorld
      responder: inetd listener -> webserver.server -> webserver.dispatch ->
      responder -> response.

  - name: "webserver stack - dynamic responder script via dispatch"
    description: "Test custom responder script invoked via webserver dispatch"
    requires_system_root: true
    timeout: 30
    script: |
      webserver.init();

      local(port = 49208);

      // All pre-state reads before any write -- see the 49207 test above.
      local(originalPort = user.inetd.config.http.port);
      // Bare-path form: defined(@x.y) is parent-resolution only and would be
      // true even when the responder does not exist, so the cleanup below
      // would delete a responder this test did not create.
      local(preCustom = defined (user.webserver.responders.customDispatch));

      local(routedToCustom = false);
      local(stream = 0);
      local(listenerUp = false);

      // Mutations inside the try so a throw during setup still restores the
      // port and removes the responder.
      try {
        user.inetd.config.http.port = port;

        // Install a responder for /custom so this test asserts on ITS OWN body
        // rather than on whatever the default responder happens to return --
        // the point of the test is that dispatch routes by URL path.
        if not preCustom {
          new (tableType, @user.webserver.responders.customDispatch)
        };
        user.webserver.responders.customDispatch.enabled = true;
        script.newScriptObject(
          "on condition (adrParamTable) {" + cr +
          tab + "return (adrParamTable^.path beginsWith \"/custom\")}",
          @user.webserver.responders.customDispatch.condition);
        if not defined (user.webserver.responders.customDispatch.methods) {
          new (tableType, @user.webserver.responders.customDispatch.methods)
        };
        script.newScriptObject(
          "on GET (adrParamTable) {" + cr +
          tab + "adrParamTable^.code = 200;" + cr +
          tab + "adrParamTable^.responseHeaders.[\"Content-Type\"] = \"text/plain\";" + cr +
          tab + "adrParamTable^.responseBody = \"custom dispatch body\";" + cr +
          tab + "return (true)}",
          @user.webserver.responders.customDispatch.methods.GET);

        if not inetd.startOne(@user.inetd.config.http) {
          scriptError("inetd.startOne failed for port " + port)
        };
        listenerUp = true;
        thread.sleepTicks(50);

        stream = tcp.openAddrStream(tcp.addressEncode("127.0.0.1"), port);
        tcp.writeStream(stream, "GET /custom HTTP/1.0\r\nHost: localhost\r\nConnection: close\r\n\r\n");

        local(response = "");
        local(startTicks = clock.ticks());
        local(headersComplete = false);
        local(connectionClosed = false);
        while (not connectionClosed) and ((clock.ticks() - startTicks) < 300) {
          local(chunk = tcp.readStream(stream, 4096));
          if sizeOf(chunk) > 0 {
            response = response + chunk
          }
          else {
            if headersComplete {
              connectionClosed = true
            }
          };
          if (not headersComplete) and (response contains "\r\n\r\n") {
            headersComplete = true
          };
          thread.sleepTicks(10)
        };

        tcp.closeStream(stream);
        stream = 0;

        if not connectionClosed {
          scriptError("read loop timed out -- server never closed connection on port " + port)
        };

        // Assert on the custom responder's own body: that is what proves
        // dispatch routed by path. A bare status-line check would pass even if
        // the default responder answered.
        routedToCustom = (response contains "200 OK") and (response contains "custom dispatch body")
      }
      else {
        if stream != 0 {
          tcp.closeStream(stream);
          stream = 0
        };
        if listenerUp {
          inetd.stopOne(@user.inetd.config.http);
          thread.sleepTicks(30)
        };
        if not preCustom { try { delete(@user.webserver.responders.customDispatch) } };
        user.inetd.config.http.port = originalPort;
        scriptError(tryError)
      };

      inetd.stopOne(@user.inetd.config.http);
      thread.sleepTicks(30);
      if not preCustom { try { delete(@user.webserver.responders.customDispatch) } };
      user.inetd.config.http.port = originalPort;

      return routedToCustom
    expected_success: true
    expected_result: "true"
    notes: |
      Verifies webserver.dispatch routes to the correct responder based on URL
      path, asserting on that responder's own response body.
