    script: |
      new(tableType, @system.temp.httpTest);
      system.temp.httpTest.requestPath = "";

      on httpHandler(streamID, remoteAddr, remotePort) {
        local(request = tcp.readStream(streamID, 4096));

        local(firstLine = string.nthField(request, "\r\n", 1));
        local(path = string.nthField(firstLine, " ", 2));
        system.temp.httpTest.requestPath = path;

        local(response = "HTTP/1.1 200 OK\r\nContent-Length: 2\r\nConnection: close\r\n\r\nOK");
        tcp.writeStream(streamID, response);
        tcp.closeStream(streamID);
        return true
      };

      local(listenID = tcp.listenStream(49203, 5, @httpHandler));

      try {
        local(clientStream = tcp.openStream(tcp.addressEncode("127.0.0.1"), 49203));
        tcp.writeStream(clientStream, "GET /helloworld HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n");

        thread.sleepFor(100);

        local(response = "");
        local(startTicks = clock.ticks());
        while (sizeOf(response) == 0) and ((clock.ticks() - startTicks) < 200) {
          response = tcp.readStream(clientStream, 4096);
          thread.sleepFor(10)
        };

        tcp.closeStream(clientStream);
        tcp.closeListen(listenID);

        local(pathCorrect = system.temp.httpTest.requestPath == "/helloworld");
        delete(@system.temp.httpTest);

        return pathCorrect
      }
      else {
        tcp.closeListen(listenID);
        delete(@system.temp.httpTest);
        scriptError(tryError)
      }
    expected_success: true
    expected_result: "true"
    notes: "Validates HTTP request line parsing - path extraction is core to webserver dispatch"

  - name: "HTTP round-trip - multiple sequential requests on same port"
    skip: true
    skip_reason: "Accept-callback echo pattern still broken after unit-2-2 landed (re-verified 2026-08-10 on develop 1cc71bc3b): a single non-blocking tcp.readStream + tcp.writeStream inside a tcp.listenStream callback never delivers the response to the client, so the assertion returns false. Same residual root-cause family as the baselined tcp client_verbs/server_verbs echo failures (issues #710, #333). Un-skip when that family is fixed, or migrate the handlers to the state-driven tcp.readStreamBytes pattern unit-2-2 recommends."
    description: "Send multiple HTTP requests sequentially to the same server"
    timeout: 20
    script: |
      new(tableType, @system.temp.httpTest);
      system.temp.httpTest.requestCount = 0;

      on httpHandler(streamID, remoteAddr, remotePort) {
        local(request = tcp.readStream(streamID, 4096));
        system.temp.httpTest.requestCount = system.temp.httpTest.requestCount + 1;

        local(body = "Request #" + system.temp.httpTest.requestCount);
        local(response = "HTTP/1.1 200 OK\r\nContent-Length: " + sizeOf(body) + "\r\nConnection: close\r\n\r\n" + body);
        tcp.writeStream(streamID, response);
        tcp.closeStream(streamID);
        return true
      };

      local(listenID = tcp.listenStream(49204, 5, @httpHandler));

      try {
        local(allOK = true);
        local(i);
        for i = 1 to 3 {
          local(clientStream = tcp.openStream(tcp.addressEncode("127.0.0.1"), 49204));
          tcp.writeStream(clientStream, "GET /req" + i + " HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n");

          thread.sleepFor(100);

          local(response = "");
          local(startTicks = clock.ticks());
          while (sizeOf(response) == 0) and ((clock.ticks() - startTicks) < 200) {
            response = tcp.readStream(clientStream, 4096);
            thread.sleepFor(10)
          };

          tcp.closeStream(clientStream);

          if not (response contains "200 OK") {
            allOK = false
          }
        };

        tcp.closeListen(listenID);

        local(count = system.temp.httpTest.requestCount);
        delete(@system.temp.httpTest);

        return allOK and (count == 3)
      }
      else {
        tcp.closeListen(listenID);
        delete(@system.temp.httpTest);
        scriptError(tryError)
      }
    expected_success: true
    expected_result: "true"
    notes: "Validates server handles multiple sequential HTTP connections correctly"

