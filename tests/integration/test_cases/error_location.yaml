# PR1 of REPL error context chain: runtime + protocol metadata.
#
# These tests assert that script/eval failure responses include structured
# error.location (script/line/column/tokenStart/tokenEnd) and error.stack
# arrays so REPL/protocol clients can render rich error displays.
#
# All tests are protocol-mode script/eval. The runner side checks the new
# fields under resp.error.{location,stack}. PR2 wires the REPL display.

tests:
  - name: "error_location - syntax error on eval line 1 includes location and token span"
    description: |
      A bare syntax error in user input. The protocol response must include
      error.location with line == 1 (not the wrapper's 2) and tokenStart/tokenEnd
      that bracket the offending position (tokenEnd > 0 OR tokenStart > 0).
    protocol_ops:
      - op: "script/eval"
        params:
          expression: "foo +"
        validate:
          success: false
          expected_error_location:
            script: "<eval>"
            line: 1
          expected_error_token_present: true

  - name: "error_location - runtime error on eval line 1 reports user-relative line 1"
    description: |
      An undefined-identifier reference on the first line of user input. The
      wrapper prefix is 1 line, so without offset subtraction the raw line
      number is 2; the runtime offset machinery must subtract back to 1.
    protocol_ops:
      - op: "script/eval"
        params:
          expression: "local (x = undefinedXYZ123)"
        validate:
          success: false
          expected_error_location:
            script: "<eval>"
            line: 1

  - name: "error_location - multi-line user input reports line 2 not wrapper-shifted line 3"
    description: |
      User input is two lines; the error is on line 2. With the 1-line wrapper
      prefix the raw line number is 3. The eval input offset must reduce that
      back to 2 so the REPL display points at the user's actual second line.
    protocol_ops:
      - op: "script/eval"
        params:
          expression: "local (x = 1);\nlocal (y = undefinedXYZ123)"
        validate:
          success: false
          expected_error_location:
            script: "<eval>"
            line: 2

  - name: "error_location - called named script that errors produces stack depth >= 2"
    description: |
      Defines a named script in system.temp.tests.errlocfn that errors when
      called, then calls it from the eval. The error.stack array must contain
      at least 2 frames (the failure site + the eval-frame caller). The top
      frame's script string must mention the called script's name so clients
      can identify the failing function.
    protocol_ops:
      - op: "script/eval"
        params:
          expression: |
            new (tabletype, @system.temp.errloctests);
            local (s = "on errlocfn () { return undefinedXYZ123 }");
            script.compile (s, @system.temp.errloctests.errlocfn);
            system.temp.errloctests.errlocfn ()
        validate:
          success: false
          expected_error_stack_min: 2
          expected_error_stack_top_script_contains: "errlocfn"

  - name: "error_location - lang.scriptError raised from eval populates location"
    description: |
      A user-raised lang.scriptError must still populate error.location with the
      line where the call appears. This locks in that the snapshot machinery
      runs for user-raised errors, not just compile/lookup errors.
    protocol_ops:
      - op: "script/eval"
        params:
          expression: "scriptError (\"user-raised\")"
        validate:
          success: false
          expected_error_location:
            script: "<eval>"
            line: 1
