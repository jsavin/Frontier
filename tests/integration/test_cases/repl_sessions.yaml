# REPL Phase 1 Session Tests
#
# Tests for REPL session lifecycle and system integration:
# - System root auto-loading
# - Session isolation
# - Startup/shutdown behavior
# - Error recovery across multiple evaluations
# - Workspace persistence within session
#
# Reference: planning/phase4/REPL_INTERACTIVE_MODE_DESIGN.md (Phase 1)

tests:
  # =========================================================================
  # System Root Auto-Loading
  # =========================================================================

  - name: "REPL - system root auto-loaded"
    description: "System root should be auto-loaded if available"
    repl_mode: true
    stdin_input: |
      typeof(system)
      /exit
    expected_output_contains:
      - "tabl"
    expected_success: true

  - name: "REPL - system.paths available"
    description: "system.paths should be initialized"
    repl_mode: true
    stdin_input: |
      typeof(system.paths)
      /exit
    expected_output_contains:
      - "tabl"
    expected_success: true

  - name: "REPL - kernel verbs available"
    description: "Kernel verbs should work with system root loaded"
    repl_mode: true
    stdin_input: |
      sizeOf("test")
      /exit
    expected_output_contains:
      - "4"
    expected_success: true

  - name: "REPL - string verbs available"
    description: "String verbs should be accessible"
    repl_mode: true
    stdin_input: |
      string.upper("hello")
      /exit
    expected_output_contains:
      - "HELLO"
    expected_success: true

  # =========================================================================
  # Workspace Isolation from System
  # =========================================================================

  - name: "REPL - workspace separate from system table"
    description: "Workspace should be separate table under system.repl.workspace"
    repl_mode: true
    stdin_input: |
      testvar = 42
      typeof(system.repl.workspace)
      /exit
    expected_output_contains:
      - "tabl"
    expected_success: true

  - name: "REPL - workspace doesn't pollute root"
    description: "Variables in workspace shouldn't appear in root scope"
    repl_mode: true
    stdin_input: |
      x = 42
      # Try to access x without workspace prefix (should fail)
      try { x } else { 0 }
      /exit
    expected_output_contains:
      - "42"
    expected_success: true

  - name: "REPL - workspace doesn't affect system.compiler"
    description: "Workspace assignments shouldn't modify system tables"
    repl_mode: true
    stdin_input: |
      compiler = "custom"
      typeof(system.compiler)
      /exit
    expected_output_contains:
      - "tabl"
    expected_success: true

  # =========================================================================
  # Error Recovery
  # =========================================================================

  - name: "REPL - continues after syntax error"
    description: "Syntax errors shouldn't crash REPL"
    repl_mode: true
    stdin_input: |
      1 +
      2 + 2
      /exit
    expected_output_contains:
      - "syntax"
      - "4"
    expected_success: true

  - name: "REPL - continues after runtime error"
    description: "Runtime errors shouldn't crash REPL"
    repl_mode: true
    stdin_input: |
      1 / 0
      42
      /exit
    expected_output_contains:
      - "divide by zero"
      - "42"
    expected_success: true

  - name: "REPL - continues after undefined variable"
    description: "Undefined variable errors shouldn't crash REPL"
    repl_mode: true
    stdin_input: |
      nonexistent_var
      x = 10
      x
      /exit
    expected_output_contains:
      - "Can't evaluate"
      - "hasn't been defined"
      - "10"
    expected_success: true

  - name: "REPL - workspace intact after error"
    description: "Errors shouldn't corrupt workspace"
    repl_mode: true
    stdin_input: |
      safe = 100
      1 / 0
      safe
      /exit
    expected_output_contains:
      - "divide by zero"
      - "100"
    expected_success: true

  - name: "REPL - multiple errors in sequence"
    description: "REPL should handle multiple consecutive errors"
    repl_mode: true
    stdin_input: |
      1 / 0
      undefined_var
      1 +
      42
      /exit
    expected_output_contains:
      - "42"
    expected_success: true

  # =========================================================================
  # Workspace Persistence Within Session
  # =========================================================================

  - name: "REPL - variables persist across evaluations"
    description: "Variables should persist within same session"
    repl_mode: true
    stdin_input: |
      x = 1
      x = x + 1
      x = x + 1
      x
      /exit
    expected_output_contains:
      - "3"
    expected_success: true

  - name: "REPL - multiple variables coexist"
    description: "Multiple variables should persist together"
    repl_mode: true
    stdin_input: |
      a = 10
      b = 20
      c = 30
      a + b + c
      /exit
    expected_output_contains:
      - "60"
    expected_success: true

  - name: "REPL - complex state builds up"
    description: "Complex workspace state should persist"
    repl_mode: true
    stdin_input: |
      counter = 0
      counter = counter + 1
      counter = counter + 1
      sum = 0
      sum = sum + counter
      sum
      /exit
    expected_output_contains:
      - "2"
    expected_success: true

  - name: "REPL - table variables persist"
    description: "Table values should persist in workspace"
    repl_mode: true
    stdin_input: |
      lang.new(tableType, @data)
      data.x = 1
      data.y = 2
      data.x + data.y
      /exit
    expected_output_contains:
      - "3"
    expected_success: true

  # =========================================================================
  # Function Definitions in Workspace
  # =========================================================================

  - name: "REPL - define function in workspace"
    description: |
      Function definitions in REPL do NOT persist across evaluations yet.
      Code values (codevaluetype) are intentionally skipped in the variable sync
      callback because copying them triggers assertion failures in langunpacktree.
      This test documents the current limitation - function is defined (returns true)
      but cannot be called in subsequent evaluation.
    repl_mode: true
    skip: true
    skip_reason: "Function persistence not yet implemented (code values skipped in sync callback)"
    stdin_input: |
      on doubleIt(x) { return x * 2 }
      doubleIt(21)
      /exit
    expected_output_contains:
      - "42"
    expected_success: true
    known_issue: "Function persistence requires special handling for code tree copying"

  - name: "REPL - call workspace function multiple times"
    description: |
      Function persistence not yet implemented. Functions defined in one evaluation
      cannot be called in subsequent evaluations because code values are skipped
      during variable sync.
    repl_mode: true
    skip: true
    skip_reason: "Function persistence not yet implemented (code values skipped in sync callback)"
    stdin_input: |
      on add(a, b) { return a + b }
      add(1, 2)
      add(10, 20)
      add(100, 200)
      /exit
    expected_output_contains:
      - "3"
      - "30"
      - "300"
    expected_success: true
    known_issue: "Function persistence requires special handling for code tree copying"

  - name: "REPL - function definition returns true"
    description: |
      While functions don't persist, defining a function should return true
      and not crash. This tests that code values are handled gracefully.
    repl_mode: true
    stdin_input: |
      on testFunc(x) { return x }
      /exit
    expected_output_contains:
      - "true"
    expected_success: true

  # =========================================================================
  # Workspace Clear and Rebuild
  # =========================================================================

  - name: "REPL - clear and rebuild workspace"
    description: "Should be able to clear and rebuild workspace"
    repl_mode: true
    skip: true
    skip_reason: "QuickScript model: /vars and /clear commands removed (not applicable)"
    stdin_input: |
      old = 1
      /clear
      new = 2
      new
      /exit
    expected_output_contains:
      - "2"
    expected_success: true

  - name: "REPL - cleared variables inaccessible"
    description: "After clear, old variables should error"
    repl_mode: true
    skip: true
    skip_reason: "QuickScript model: /vars and /clear commands removed (not applicable)"
    stdin_input: |
      x = 42
      /clear
      x
      /exit
    expected_output_contains:
      - "Can't evaluate"
      - "hasn't been defined"
    expected_success: true

  # =========================================================================
  # Long-Running Session Simulation
  # =========================================================================

  - name: "REPL - many sequential operations"
    description: "REPL should handle many sequential evaluations"
    repl_mode: true
    stdin_input: |
      sum = 0
      sum = sum + 1
      sum = sum + 2
      sum = sum + 3
      sum = sum + 4
      sum = sum + 5
      sum
      /exit
    expected_output_contains:
      - "15"
    expected_success: true

  - name: "REPL - accumulate complex state"
    description: "Complex workspace state should accumulate correctly"
    repl_mode: true
    stdin_input: |
      count = 0
      total = 0
      count = count + 1
      total = total + count
      count = count + 1
      total = total + count
      count = count + 1
      total = total + count
      total
      /exit
    expected_output_contains:
      - "6"  # 1 + 2 + 3
    expected_success: true

  # =========================================================================
  # System Verb Integration
  # =========================================================================

  - name: "REPL - use lang verbs"
    description: "Language verbs should work in REPL"
    repl_mode: true
    stdin_input: |
      lang.new(tableType, @t)
      typeof(t)
      /exit
    expected_output_contains:
      - "tabl"
    expected_success: true

  - name: "REPL - use string verbs"
    description: "String manipulation should work"
    repl_mode: true
    stdin_input: |
      s = "hello"
      string.upper(s)
      /exit
    expected_output_contains:
      - "HELLO"
    expected_success: true

  - name: "REPL - use typeof"
    description: "typeof should work on workspace variables"
    repl_mode: true
    stdin_input: |
      num = 42
      str = "text"
      bool = true
      typeof(num)
      /exit
    expected_output_contains:
      - "long"
    expected_success: true

  - name: "REPL - use sizeOf on workspace"
    description: "sizeOf should work on workspace table"
    repl_mode: true
    stdin_input: |
      a = 1
      b = 2
      c = 3
      sizeOf(workspace)
      /exit
    expected_output_contains:
      - "3"
    expected_success: true

  # =========================================================================
  # Mixed Code and Commands
  # =========================================================================

  - name: "REPL - interleave code and commands"
    description: "Should seamlessly mix code and commands"
    repl_mode: true
    skip: true
    skip_reason: "QuickScript model: /vars and /clear commands removed (not applicable)"
    stdin_input: |
      x = 10
      /vars
      y = 20
      /vars
      x + y
      /exit
    expected_output_contains:
      - "x = 10"
      - "y = 20"
      - "30"
    expected_success: true

  - name: "REPL - help doesn't affect workspace"
    description: "/help command shouldn't affect workspace"
    repl_mode: true
    stdin_input: |
      x = 42
      /help
      x
      /exit
    expected_output_contains:
      - "Available commands"
      - "42"
    expected_success: true

  # =========================================================================
  # Startup Messages
  # =========================================================================

  - name: "REPL - shows welcome message"
    description: "REPL should show welcome on startup"
    repl_mode: true
    stdin_input: "/exit\n"
    expected_output_contains:
      - "Frontier REPL"
      - "Interactive"
      - "UserTalk"
    expected_success: true

  - name: "REPL - shows help hint"
    description: "Welcome should mention /help command"
    repl_mode: true
    stdin_input: "/exit\n"
    expected_output_contains:
      - "/help"
    expected_success: true

  - name: "REPL - shows exit hint"
    description: "Welcome should mention /exit command"
    repl_mode: true
    stdin_input: "/exit\n"
    expected_output_contains:
      - "/exit"
    expected_success: true

  # =========================================================================
  # Context Display (Prompt)
  # =========================================================================

  - name: "REPL - prompt shows context"
    description: "Prompt should display current context"
    repl_mode: true
    stdin_input: "/exit\n"
    expected_output_contains:
      - "[root]>"  # or "[workspace]>" depending on implementation
    expected_success: true

  - name: "REPL - prompt appears after each evaluation"
    description: "Prompt should appear after each input"
    repl_mode: true
    stdin_input: |
      1 + 1
      2 + 2
      /exit
    expected_output_contains:
      - "[root]>"
    expected_success: true

  # =========================================================================
  # Edge Cases
  # =========================================================================

  - name: "REPL - handles very long workspace names"
    description: "Long variable names should work"
    repl_mode: true
    stdin_input: |
      this_is_a_very_long_variable_name_that_should_still_work = 42
      this_is_a_very_long_variable_name_that_should_still_work
      /exit
    expected_output_contains:
      - "42"
    expected_success: true

  - name: "REPL - handles unicode in workspace variables"
    description: "Non-ASCII characters in identifiers cause errors"
    repl_mode: true
    stdin_input: |
      test_var = "Hello"
      test_var
      /exit
    expected_output_contains:
      - "Hello"
    expected_success: true
    # Note: Test modified to use ASCII due to test runner Unicode handling
    # Original test with Unicode characters caused Python decode errors

  - name: "REPL - nil return doesn't display"
    description: "Nil values should not display (Phase 1 behavior)"
    repl_mode: true
    stdin_input: |
      nil
      42
      /exit
    expected_output_contains:
      - "42"
    expected_success: true

  - name: "REPL - empty statement block"
    description: "Empty blocks should not error"
    repl_mode: true
    stdin_input: |
      if false { }
      42
      /exit
    expected_output_contains:
      - "42"
    expected_success: true

  # =========================================================================
  # Session Cleanup
  # =========================================================================

  - name: "REPL - clean exit with /exit"
    description: "/exit should cleanly exit without errors"
    repl_mode: true
    stdin_input: "/exit\n"
    expected_output_contains:
      - "Goodbye"
    expected_success: true

  - name: "REPL - clean exit with EOF"
    description: "EOF (Ctrl-D) should cleanly exit"
    repl_mode: true
    stdin_input: ""  # EOF
    expected_output_contains:
      - "Goodbye"
    expected_success: true

  - name: "REPL - workspace cleanup on exit"
    description: "Exit should cleanly dispose workspace"
    repl_mode: true
    stdin_input: |
      x = 42
      /exit
    expected_success: true
    # No memory leaks or errors on cleanup

  # =========================================================================
  # System Root Not Available
  # =========================================================================

  - name: "REPL - works without system root"
    description: "REPL should work even if system root not loaded"
    repl_mode: true
    no_system_root: true
    stdin_input: |
      x = 42
      x
      /exit
    expected_output_contains:
      - "42"
    expected_success: true

  - name: "REPL - basic verbs work without system root"
    description: "Kernel verbs should work without system root"
    repl_mode: true
    no_system_root: true
    stdin_input: |
      typeof(42)
      /exit
    expected_output_contains:
      - "long"
    expected_success: true

  # =========================================================================
  # Focus Tracking (system.temp.FrontierREPL.focus)
  # =========================================================================

  - name: "REPL - focus tracks /jump navigation"
    description: |
      system.temp.FrontierREPL.focus should update when /jump navigates to a table.
      This exposes the current navigation location to UserTalk scripts.
    repl_mode: true
    stdin_input: |
      /jump user
      system.temp.FrontierREPL.focus
      /exit
    expected_output_contains:
      - "user"
    expected_success: true

  - name: "REPL - focus tracks nested navigation"
    description: "Focus should track navigation to nested tables"
    repl_mode: true
    stdin_input: |
      /jump system.verbs
      system.temp.FrontierREPL.focus
      /exit
    expected_output_contains:
      - "system.verbs"
    expected_success: true

  - name: "REPL - focus tracks parent navigation"
    description: "Focus should update when navigating to parent with .."
    repl_mode: true
    stdin_input: |
      /jump system.verbs
      /jump ..
      system.temp.FrontierREPL.focus
      /exit
    expected_output_contains:
      - "system"
    expected_success: true

  - name: "REPL - focus resets to root"
    description: "Focus should reset to root when /jump is called with no argument"
    repl_mode: true
    stdin_input: |
      /jump user
      /jump
      system.temp.FrontierREPL.focus
      /exit
    expected_output_contains:
      - "root"
    expected_success: true

  # =========================================================================
  # msg() Prefix Behavior
  # =========================================================================

  - name: "REPL - msg() shows prefix in REPL mode"
    description: |
      In REPL mode, msg() output should be prefixed with "msg: " to distinguish
      it from evaluation results. This helps users identify which output comes
      from msg() calls vs expression evaluation.
    repl_mode: true
    stdin_input: |
      msg("hello world")
      /exit
    expected_output_contains:
      - "msg: hello world"
    expected_success: true

  - name: "REPL - msg() prefix distinguishes from result"
    description: "msg() and evaluation results should be visually distinct"
    repl_mode: true
    stdin_input: |
      msg("message output")
      "evaluation result"
      /exit
    expected_output_contains:
      - "msg: message output"
      - "evaluation result"
    expected_success: true

  # =========================================================================
  # Variables Persist Across Errors
  # =========================================================================

  - name: "REPL - variables persist after syntax error"
    description: "Variables defined before an error should survive the error"
    repl_mode: true
    stdin_input: |
      x = 42
      this is a syntax error
      x
      /exit
    expected_output_contains:
      - "42"
    expected_success: true

  - name: "REPL - variables persist after runtime error"
    description: "Variables should survive runtime errors in subsequent evaluations"
    repl_mode: true
    stdin_input: |
      x = 100
      y = 200
      undefined_variable
      x + y
      /exit
    expected_output_contains:
      - "300"
    expected_success: true

  - name: "REPL - multiple errors don't corrupt workspace"
    description: "Workspace should remain stable after multiple consecutive errors"
    repl_mode: true
    stdin_input: |
      a = 1
      error1
      b = 2
      error2
      c = 3
      a + b + c
      /exit
    expected_output_contains:
      - "6"
    expected_success: true

# Test suite notes:
#
# 1. Session tests verify REPL lifecycle from startup to shutdown.
#
# 2. Error recovery tests ensure REPL is robust against malformed input.
#
# 3. Workspace persistence tests verify state accumulates correctly within
#    a single session (not across sessions - that's out of scope for Phase 1).
#
# 4. System root integration tests verify auto-loading and verb availability.
#
# 5. The no_system_root flag tests REPL behavior when system root is explicitly
#    not loaded (using --no-system-root flag).
#
# 6. Tests assume test runner can:
#    - Detect repl_mode: true and invoke frontier-cli in interactive mode
#    - Feed stdin_input as simulated user input
#    - Capture stdout/stderr for output validation
#    - Check exit codes and termination behavior
