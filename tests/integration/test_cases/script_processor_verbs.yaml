# Integration tests for script processor verbs
# Tests UserTalk script compilation and execution in headless mode
#
# Script processor verbs:
#   - script.compile(addr) - Compile UserTalk source to bytecode
#   - script.getcode(addr, adrcode) - Get compiled code from script object
#   - script.setcode(addr, adrcode) - Set compiled code in script object
#   - script.getsource(addr, addrsource) - Get source text from script object
#   - script.setsource(addr, addrsource) - Set source text in script object
#   - script.error(message_or_code) - Trigger script error (terminates execution)
#
# Script Execution Patterns (Production):
#   - Direct evaluation: @myscript() - Call compiled script directly
#   - Parameterized: lang.callscript(@myscript, paramtable) - Pass parameters
#   - Inline: lang.evaluate(sourcetext) - Evaluate source string
#
# DEPRECATED VERBS:
#   - script.run(@addr) - Never implemented in production Frontier
#     Use direct evaluation (@scriptname) instead
#
# WORKSPACE TABLE DEPENDENCY:
# These tests currently use @workspace table for storing script objects. This requires
# the system root database (Frontier.root) to be loaded, which provides the workspace
# table. This is a known limitation that will be addressed in a follow-up:
# - Refactor tests to use self-contained table structures (@local.testTable.script)
# - Remove dependency on system root database for testing
# - Related to global state elimination (Issue #135) - outline context refactoring
#
# Test case fields:
#   name: Test name (required)
#   description: Test description (optional)
#   script: UserTalk script to execute (required)
#   expected_success: true/false (default: true)
#   expected_result: Expected return value as string (optional)
#   expected_result_type: Expected result type from JSON (optional)
#   expected_error_type: Expected error type if expected_success=false (optional)
#   timeout: Timeout in seconds (optional, default: 10)

tests:
  # ============================================================================
  # script.compile Tests - Compile UserTalk Source to Bytecode
  # ============================================================================

  # Happy path - simple script compilation
  - name: "script.compile - simple script compiles successfully"
    description: "Compile a simple UserTalk script and verify success"
    script: |
      lang.new(scriptType, @workspace.testScript);
      local(source = "return 42");
      script.setsource(@workspace.testScript, @source);
      return script.compile(@workspace.testScript)
    expected_success: true
    expected_result: "true"

  - name: "script.compile - returns boolean type"
    description: "Compile should return boolean type"
    script: |
      lang.new(scriptType, @workspace.compileTest);
      local(source = "return true");
      script.setsource(@workspace.compileTest, @source);
      return typeof(script.compile(@workspace.compileTest))
    expected_success: true
    expected_result: "bool"

  - name: "script.compile - arithmetic expression"
    description: "Compile script with arithmetic operations"
    script: |
      lang.new(scriptType, @workspace.mathScript);
      local(source = "return 10 + 20 * 3");
      script.setsource(@workspace.mathScript, @source);
      return script.compile(@workspace.mathScript)
    expected_success: true
    expected_result: "true"

  - name: "script.compile - string operations"
    description: "Compile script with string concatenation"
    script: |
      lang.new(scriptType, @workspace.stringScript);
      local(source = "return \"hello\" + \" \" + \"world\"");
      script.setsource(@workspace.stringScript, @source);
      return script.compile(@workspace.stringScript)
    expected_success: true
    expected_result: "true"

  - name: "script.compile - local variables"
    description: "Compile script with local variable declarations"
    script: |
      lang.new(scriptType, @workspace.localVarScript);
      local(source = "local(x=5, y=10); return x+y");
      script.setsource(@workspace.localVarScript, @source);
      return script.compile(@workspace.localVarScript)
    expected_success: true
    expected_result: "true"

  - name: "script.compile - conditional logic"
    description: "Compile script with if/else statement"
    script: |
      lang.new(scriptType, @workspace.ifScript);
      local(source = "if true { return \"yes\" } else { return \"no\" }");
      script.setsource(@workspace.ifScript, @source);
      return script.compile(@workspace.ifScript)
    expected_success: true
    expected_result: "true"

  - name: "script.compile - loop construct"
    description: "Compile script with for loop"
    script: |
      lang.new(scriptType, @workspace.loopScript);
      local(source = "local(i, sum=0); for i=1 to 10 { sum = sum + i }; return sum");
      script.setsource(@workspace.loopScript, @source);
      return script.compile(@workspace.loopScript)
    expected_success: true
    expected_result: "true"

  # Edge cases - compilation errors
  - name: "script.compile - syntax error terminates execution"
    description: "Compilation error should terminate script execution"
    script: |
      lang.new(scriptType, @workspace.badScript);
      local(source = "return 1 + +");
      script.setsource(@workspace.badScript, @source);
      script.compile(@workspace.badScript);
      return false
    expected_success: false

  - name: "script.compile - empty script compiles"
    description: "Empty script should compile successfully"
    script: |
      lang.new(scriptType, @workspace.emptyScript);
      local(source = "");
      script.setsource(@workspace.emptyScript, @source);
      return script.compile(@workspace.emptyScript)
    expected_success: true
    expected_result: "true"

  - name: "script.compile - multiline script"
    description: "Compile multi-line script with statements on separate lines"
    script: |
      lang.new(scriptType, @workspace.multilineScript);
      local(source = "local(x = 10);\nlocal(y = 20);\nreturn x + y");
      script.setsource(@workspace.multilineScript, @source);
      return script.compile(@workspace.multilineScript)
    expected_success: true
    expected_result: "true"

  - name: "script.compile - script with comments"
    description: "Compile script containing comments"
    script: |
      lang.new(scriptType, @workspace.commentScript);
      local(source = "// This is a comment\nreturn 42 // another comment");
      script.setsource(@workspace.commentScript, @source);
      return script.compile(@workspace.commentScript)
    expected_success: true
    expected_result: "true"

  # Non-script object handling
  - name: "script.compile - non-script object returns false"
    description: "Attempting to compile non-script object should return false"
    script: |
      lang.new(tableType, @workspace.notAScript);
      return script.compile(@workspace.notAScript)
    expected_success: true
    expected_result: "false"

  # ============================================================================
  # Script Execution Patterns (Production)
  # ============================================================================

  - name: "script execution - direct evaluation of compiled script"
    description: "Production pattern: call script directly after compilation"
    script: |
      lang.new(scriptType, @workspace.execTest);
      local(source = "return 42");
      script.setsource(@workspace.execTest, @source);
      script.compile(@workspace.execTest);
      return @workspace.execTest() == 42
    expected_success: true
    expected_result: "true"

  - name: "script execution - script with arithmetic"
    description: "Verify compiled script executes and returns correct result"
    script: |
      lang.new(scriptType, @workspace.mathScript);
      local(source = "return 10 + 20 + 12");
      script.setsource(@workspace.mathScript, @source);
      script.compile(@workspace.mathScript);
      return @workspace.mathScript() == 42
    expected_success: true
    expected_result: "true"

  - name: "script execution - inline evaluation for testing"
    description: "Alternative pattern: use lang.evaluate for simple cases"
    script: |
      local(source = "return 100 / 2");
      return lang.evaluate(source) == 50
    expected_success: true
    expected_result: "true"

  - name: "script.run - deprecated verb returns error"
    description: "script.run should fail with deprecation message"
    script: |
      lang.new(scriptType, @workspace.runTest);
      script.setsource(@workspace.runTest, @"return 42");
      script.compile(@workspace.runTest);
      script.run(@workspace.runTest)
    expected_success: false
    expected_error: "script.run is not supported"

  # ============================================================================
  # script.getsource / script.setsource Tests
  # ============================================================================

  # Happy path - get and set source
  - name: "script.getsource - retrieve script source text"
    description: "Get source code from script object"
    script: |
      lang.new(scriptType, @workspace.sourceTest);
      local(originalSource = "return 42");
      script.setsource(@workspace.sourceTest, @originalSource);
      local(source);
      script.getsource(@workspace.sourceTest, @source);
      return source == "return 42"
    expected_success: true
    expected_result: "true"

  - name: "script.setsource - set script source text"
    description: "Set source code in script object"
    script: |
      lang.new(scriptType, @workspace.setSourceTest);
      local(newSource = "return 100");
      script.setsource(@workspace.setSourceTest, @newSource);
      local(retrieved);
      script.getsource(@workspace.setSourceTest, @retrieved);
      return retrieved == "return 100"
    expected_success: true
    expected_result: "true"

  - name: "script.setsource - returns boolean true"
    description: "setsource should return boolean true on success"
    script: |
      lang.new(scriptType, @workspace.setSourceReturn);
      local(src = "return 42");
      return script.setsource(@workspace.setSourceReturn, @src)
    expected_success: true
    expected_result: "true"

  - name: "script.getsource - returns boolean true"
    description: "getsource should return boolean true on success"
    script: |
      lang.new(scriptType, @workspace.getSourceReturn);
      local(originalSource = "return 42");
      script.setsource(@workspace.getSourceReturn, @originalSource);
      local(source);
      return script.getsource(@workspace.getSourceReturn, @source)
    expected_success: true
    expected_result: "true"

  # Roundtrip test
  - name: "script source verbs - roundtrip test"
    description: "Set source, get it back, verify unchanged"
    script: |
      lang.new(scriptType, @workspace.roundtrip);
      local(original = "local(x = 10);\nreturn x * 2");
      script.setsource(@workspace.roundtrip, @original);
      local(retrieved);
      script.getsource(@workspace.roundtrip, @retrieved);
      return retrieved == original
    expected_success: true
    expected_result: "true"

  # Edge cases
  - name: "script.setsource - empty string source"
    description: "Setting empty source should work"
    script: |
      lang.new(scriptType, @workspace.emptySource);
      local(empty = "");
      script.setsource(@workspace.emptySource, @empty);
      local(retrieved);
      script.getsource(@workspace.emptySource, @retrieved);
      return retrieved == ""
    expected_success: true
    expected_result: "true"

  - name: "script.setsource - multiline source"
    description: "Setting multi-line source with newlines"
    script: |
      lang.new(scriptType, @workspace.multiline);
      local(source = "local(x = 1);\nlocal(y = 2);\nreturn x + y");
      script.setsource(@workspace.multiline, @source);
      local(retrieved);
      script.getsource(@workspace.multiline, @retrieved);
      return string.length(retrieved) > 0
    expected_success: true
    expected_result: "true"

  - name: "script.setsource - source with special characters"
    description: "Setting source with quotes and backslashes"
    script: |
      lang.new(scriptType, @workspace.specialChars);
      local(source = "return \"hello\\nworld\"");
      script.setsource(@workspace.specialChars, @source);
      local(retrieved);
      script.getsource(@workspace.specialChars, @retrieved);
      return string.length(retrieved) > 0
    expected_success: true
    expected_result: "true"

  # ============================================================================
  # script.getcode / script.setcode Tests
  # ============================================================================

  # Happy path - get compiled code
  - name: "script.getcode - retrieve compiled bytecode"
    description: "Get compiled code from script object"
    script: |
      lang.new(scriptType, @workspace.codeTest);
      local(source = "return 42");
      script.setsource(@workspace.codeTest, @source);
      script.compile(@workspace.codeTest);
      local(code);
      script.getcode(@workspace.codeTest, @code);
      return typeof(code) == binaryType
    expected_success: true
    expected_result: "true"

  - name: "script.getcode - returns boolean true"
    description: "getcode should return boolean true on success"
    script: |
      lang.new(scriptType, @workspace.getCodeReturn);
      local(source = "return 42");
      script.setsource(@workspace.getCodeReturn, @source);
      script.compile(@workspace.getCodeReturn);
      local(code);
      return script.getcode(@workspace.getCodeReturn, @code)
    expected_success: true
    expected_result: "true"

  - name: "script.setcode - set compiled bytecode"
    description: "Set compiled code in script object"
    script: |
      lang.new(scriptType, @workspace.originalScript);
      local(source = "return 42");
      script.setsource(@workspace.originalScript, @source);
      script.compile(@workspace.originalScript);
      local(code);
      script.getcode(@workspace.originalScript, @code);
      lang.new(scriptType, @workspace.copyScript);
      return script.setcode(@workspace.copyScript, @code)
    expected_success: true
    expected_result: "true"

  - name: "script.setcode - returns boolean true"
    description: "setcode should return boolean true on success"
    script: |
      lang.new(scriptType, @workspace.setCodeReturn);
      local(source = "return 42");
      script.setsource(@workspace.setCodeReturn, @source);
      script.compile(@workspace.setCodeReturn);
      local(code);
      script.getcode(@workspace.setCodeReturn, @code);
      lang.new(scriptType, @workspace.setCodeTarget);
      return script.setcode(@workspace.setCodeTarget, @code)
    expected_success: true
    expected_result: "true"

  # Code transfer test
  - name: "script code verbs - transfer code between scripts"
    description: "Get code from one script, set it in another, run both"
    script: |
      lang.new(scriptType, @workspace.source);
      local(source = "return 99");
      script.setsource(@workspace.source, @source);
      script.compile(@workspace.source);
      local(code);
      script.getcode(@workspace.source, @code);
      lang.new(scriptType, @workspace.dest);
      script.setcode(@workspace.dest, @code);
      local(result1 = @workspace.source());
      local(result2 = @workspace.dest());
      return (result1 == 99) and (result2 == 99)
    expected_success: true
    expected_result: "true"

  # Edge cases
  - name: "script.getcode - uncompiled script behavior"
    description: "Getting code from uncompiled script should handle gracefully"
    script: |
      lang.new(scriptType, @workspace.uncompiled);
      local(source = "return 42");
      script.setsource(@workspace.uncompiled, @source);
      local(code);
      try {
        script.getcode(@workspace.uncompiled, @code);
        return true
      }
      else {
        return true
      }
    expected_success: true
    expected_result: "true"

  # ============================================================================
  # script.error Tests - Trigger Runtime Error
  # ============================================================================

  # String error message
  - name: "script.error - string message terminates execution"
    description: "Triggering error with string should terminate script"
    script: |
      script.error("This is a test error");
      return false
    expected_success: false

  - name: "script.error - error prevents subsequent code"
    description: "Code after script.error should not execute"
    script: |
      workspace.errorFlag = false;
      script.error("Error here");
      workspace.errorFlag = true;
      return false
    expected_success: false

  # Numeric error code
  - name: "script.error - numeric error code"
    description: "Triggering error with numeric OS error code"
    script: |
      script.error(-1);
      return false
    expected_success: false

  - name: "script.error - zero error code"
    description: "Error code 0 still terminates execution"
    script: |
      script.error(0);
      return false
    expected_success: false

  # Edge cases
  - name: "script.error - empty string message"
    description: "Error with empty string should still terminate"
    script: |
      script.error("");
      return false
    expected_success: false

  - name: "script.error - long error message"
    description: "Error with very long message should handle gracefully"
    script: |
      local(longMsg = "Error: ");
      local(i);
      for i = 1 to 20 {
        longMsg = longMsg + "This is a very long error message component. "
      };
      script.error(longMsg);
      return false
    expected_success: false

  # ============================================================================
  # Integration Tests - Complete Script Lifecycle
  # ============================================================================

  - name: "script verbs - complete lifecycle test"
    description: "Create, set source, compile, run, get result"
    script: |
      lang.new(scriptType, @workspace.lifecycle);
      local(source = "return 100 + 23");
      script.setsource(@workspace.lifecycle, @source);
      script.compile(@workspace.lifecycle);
      local(result = @workspace.lifecycle());
      return result == 123
    expected_success: true
    expected_result: "true"

  - name: "script verbs - modify source and recompile"
    description: "Change script source, recompile, run again"
    script: |
      lang.new(scriptType, @workspace.modify);
      local(source1 = "return 1");
      script.setsource(@workspace.modify, @source1);
      script.compile(@workspace.modify);
      local(first = @workspace.modify());
      local(source2 = "return 2");
      script.setsource(@workspace.modify, @source2);
      script.compile(@workspace.modify);
      local(second = @workspace.modify());
      return (first == 1) and (second == 2)
    expected_success: true
    expected_result: "true"

  - name: "script verbs - source and code independence"
    description: "Verify getting source doesn't require compilation"
    script: |
      lang.new(scriptType, @workspace.independence);
      local(originalSource = "return 42");
      script.setsource(@workspace.independence, @originalSource);
      local(source);
      script.getsource(@workspace.independence, @source);
      return source == "return 42"
    expected_success: true
    expected_result: "true"

  - name: "script verbs - clone script via code transfer"
    description: "Create exact copy of script by transferring compiled code"
    script: |
      lang.new(scriptType, @workspace.original);
      local(source = "local(x = 5); return x * x");
      script.setsource(@workspace.original, @source);
      script.compile(@workspace.original);
      local(code);
      script.getcode(@workspace.original, @code);
      lang.new(scriptType, @workspace.clone);
      script.setcode(@workspace.clone, @code);
      local(origResult = @workspace.original());
      local(cloneResult = @workspace.clone());
      return origResult == cloneResult
    expected_success: true
    expected_result: "true"

  - name: "script verbs - multiple scripts independent"
    description: "Multiple scripts can coexist and run independently"
    script: |
      lang.new(scriptType, @workspace.scriptA);
      lang.new(scriptType, @workspace.scriptB);
      local(sourceA = "return 10");
      local(sourceB = "return 20");
      script.setsource(@workspace.scriptA, @sourceA);
      script.setsource(@workspace.scriptB, @sourceB);
      script.compile(@workspace.scriptA);
      script.compile(@workspace.scriptB);
      local(a = @workspace.scriptA());
      local(b = @workspace.scriptB());
      return (a == 10) and (b == 20)
    expected_success: true
    expected_result: "true"

  # ============================================================================
  # Type Validation Tests
  # ============================================================================

  - name: "script verbs - return type validation"
    description: "Verify all script verbs return correct types"
    script: |
      lang.new(scriptType, @workspace.typeTest);
      local(originalSource = "return 42");
      script.setsource(@workspace.typeTest, @originalSource);
      script.compile(@workspace.typeTest);
      local(compileResult = script.compile(@workspace.typeTest));
      local(runResult = @workspace.typeTest());
      local(source, code);
      local(getSourceResult = script.getsource(@workspace.typeTest, @source));
      local(getCodeResult = script.getcode(@workspace.typeTest, @code));
      return (typeof(compileResult) == booleanType) and
             (typeof(getSourceResult) == booleanType) and
             (typeof(getCodeResult) == booleanType) and
             (typeof(source) == stringType) and
             (typeof(code) == binaryType)
    expected_success: true
    expected_result: "true"

  # ============================================================================
  # Error Recovery Tests
  # ============================================================================

  - name: "script verbs - recover from compilation error"
    description: "After compilation error, script should still be usable"
    script: |
      lang.new(scriptType, @workspace.recovery);
      local(badSource = "return 1 + +");
      script.setsource(@workspace.recovery, @badSource);
      try {
        script.compile(@workspace.recovery);
        return false
      }
      else {
        local(goodSource = "return 42");
        script.setsource(@workspace.recovery, @goodSource);
        script.compile(@workspace.recovery);
        return @workspace.recovery() == 42
      }
    expected_success: true
    expected_result: "true"
