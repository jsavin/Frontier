# Integration tests for db verb operations
# Tests ODB Engine API verbs for database operations
#
# THREAD-SAFETY NOTE (Step 0 - Legacy Parity):
# These tests validate Step 0 behavior matching legacy Frontier semantics.
# db.* verbs assume single-threaded script execution and are NOT safe for
# concurrent access to the same external database. Thread-local outline context
# (ADR-006) provides per-thread isolation, but db.* operations themselves are
# not atomic or synchronized for multi-user access.
#
# See planning/phase3/EXTERNAL_ATOMICITY_AND_COLLABORATION_ROADMAP.md for
# the multi-user collaboration roadmap (Step 1-3).
#
# All 13 db.* verbs (implemented via ODB Engine in odbengine.c):
#   - db.new() - Create new ODB file
#   - db.open() - Open existing ODB file
#   - db.save() - Save ODB changes
#   - db.close() - Close ODB file
#   - db.defined() - Check if address exists
#   - db.getvalue() - Get value at address
#   - db.setvalue() - Set value at address
#   - db.delete() - Delete value at address
#   - db.newtable() - Create new table
#   - db.istable() - Check if address is a table
#   - db.countitems() - Count items in table
#   - db.getnthitem() - Get Nth item name
#   - db.getmoddate() - Get modification date
#
# Test Strategy:
# Each test is self-contained - it creates/opens database, performs operations,
# and saves if needed. Tests that need persisted data use unique database files
# and explicitly save before closing.

tests:
  # ========================================================================
  # Test 1: db.new + db.open - Create and open database
  # ========================================================================
  - name: "db.new - create new database file"
    description: "Create a new ODB database file"
    script: |
      local(tmpDir = "{FRONTIER_TEST_TMP_DIR}");
      local(dbPath = tmpDir + "/" + "test_db_new.root");
      local(ok = db.new(dbPath));
      return ok
    expected_success: true
    expected_result: "true"

  - name: "db.open - open newly created database"
    description: "Open the database we just created"
    script: |
      local(tmpDir = "{FRONTIER_TEST_TMP_DIR}");
      local(dbPath = tmpDir + "/" + "test_db_new.root");
      local(ok = db.open(dbPath, false));
      return ok
    expected_success: true
    expected_result: "true"

  # ========================================================================
  # Test 2: db.setvalue + db.getvalue (string) - Write and read in same script
  # ========================================================================
  - name: "db.setvalue - write string and read back"
    description: "Set a string value and read it back in same session"
    script: |
      local(tmpDir = "{FRONTIER_TEST_TMP_DIR}");
      local(dbPath = tmpDir + "/" + "test_string.root");
      db.new(dbPath);
      db.open(dbPath, false);
      db.setvalue(dbPath, "testString", "Hello, DB!");
      local(val = db.getvalue(dbPath, "testString"));
      return val
    expected_success: true
    expected_result: "Hello, DB!"

  # ========================================================================
  # Test 3: db.defined - Check existence
  # ========================================================================
  - name: "db.defined - check existing value"
    description: "Verify that a value exists after setting it"
    script: |
      local(tmpDir = "{FRONTIER_TEST_TMP_DIR}");
      local(dbPath = tmpDir + "/" + "test_defined.root");
      db.new(dbPath);
      db.open(dbPath, false);
      db.setvalue(dbPath, "testString", "exists");
      local(exists = db.defined(dbPath, "testString"));
      return exists
    expected_success: true
    expected_result: "true"

  - name: "db.defined - check nonexistent value"
    description: "Verify that nonexistent item returns false"
    script: |
      local(tmpDir = "{FRONTIER_TEST_TMP_DIR}");
      local(dbPath = tmpDir + "/" + "test_defined2.root");
      db.new(dbPath);
      db.open(dbPath, false);
      local(exists = db.defined(dbPath, "doesNotExist"));
      return exists
    expected_success: true
    expected_result: "false"

  # ========================================================================
  # Test 4: db.setvalue + db.getvalue (number)
  # ========================================================================
  - name: "db.setvalue - write number and read back"
    description: "Set a numeric value and read it back"
    script: |
      local(tmpDir = "{FRONTIER_TEST_TMP_DIR}");
      local(dbPath = tmpDir + "/" + "test_number.root");
      db.new(dbPath);
      db.open(dbPath, false);
      db.setvalue(dbPath, "testNumber", 42);
      local(val = db.getvalue(dbPath, "testNumber"));
      return val
    expected_success: true
    expected_result: "42"

  # ========================================================================
  # Test 5: db.newtable + db.istable
  # ========================================================================
  - name: "db.newtable - create table and verify"
    description: "Create a new table and verify it's a table"
    script: |
      local(tmpDir = "{FRONTIER_TEST_TMP_DIR}");
      local(dbPath = tmpDir + "/" + "test_table.root");
      db.new(dbPath);
      db.open(dbPath, false);
      db.newtable(dbPath, "testTable");
      local(isTable = db.istable(dbPath, "testTable"));
      return isTable
    expected_success: true
    expected_result: "true"

  - name: "db.istable - verify string is not a table"
    description: "Check that a string value is not a table"
    script: |
      local(tmpDir = "{FRONTIER_TEST_TMP_DIR}");
      local(dbPath = tmpDir + "/" + "test_istable.root");
      db.new(dbPath);
      db.open(dbPath, false);
      db.setvalue(dbPath, "testString", "not a table");
      local(isTable = db.istable(dbPath, "testString"));
      return isTable
    expected_success: true
    expected_result: "false"

  # ========================================================================
  # Test 6: db.countitems + db.getnthitem
  # ========================================================================
  - name: "db.countitems - count items in table"
    description: "Create table with items and count them"
    script: |
      local(tmpDir = "{FRONTIER_TEST_TMP_DIR}");
      local(dbPath = tmpDir + "/" + "test_count.root");
      db.new(dbPath);
      db.open(dbPath, false);
      db.newtable(dbPath, "testTable");
      db.setvalue(dbPath, "testTable.item1", "first");
      db.setvalue(dbPath, "testTable.item2", "second");
      db.setvalue(dbPath, "testTable.item3", "third");
      local(count = db.countitems(dbPath, "testTable"));
      return count
    expected_success: true
    expected_result: "3"

  - name: "db.getnthitem - get first item name"
    description: "Get name of first item in table"
    script: |
      local(tmpDir = "{FRONTIER_TEST_TMP_DIR}");
      local(dbPath = tmpDir + "/" + "test_getnth.root");
      db.new(dbPath);
      db.open(dbPath, false);
      db.newtable(dbPath, "testTable");
      db.setvalue(dbPath, "testTable.item1", "first");
      db.setvalue(dbPath, "testTable.item2", "second");
      db.setvalue(dbPath, "testTable.item3", "third");
      local(name = db.getnthitem(dbPath, "testTable", 1));
      return name
    expected_success: true
    expected_result: "item1"

  - name: "db.getnthitem - get second item name"
    description: "Get name of second item in table"
    script: |
      local(tmpDir = "{FRONTIER_TEST_TMP_DIR}");
      local(dbPath = tmpDir + "/" + "test_getnth2.root");
      db.new(dbPath);
      db.open(dbPath, false);
      db.newtable(dbPath, "testTable");
      db.setvalue(dbPath, "testTable.item1", "first");
      db.setvalue(dbPath, "testTable.item2", "second");
      db.setvalue(dbPath, "testTable.item3", "third");
      local(name = db.getnthitem(dbPath, "testTable", 2));
      return name
    expected_success: true
    expected_result: "item2"

  - name: "db.getnthitem - get third item name"
    description: "Get name of third item in table"
    script: |
      local(tmpDir = "{FRONTIER_TEST_TMP_DIR}");
      local(dbPath = tmpDir + "/" + "test_getnth3.root");
      db.new(dbPath);
      db.open(dbPath, false);
      db.newtable(dbPath, "testTable");
      db.setvalue(dbPath, "testTable.item1", "first");
      db.setvalue(dbPath, "testTable.item2", "second");
      db.setvalue(dbPath, "testTable.item3", "third");
      local(name = db.getnthitem(dbPath, "testTable", 3));
      return name
    expected_success: true
    expected_result: "item3"

  # ========================================================================
  # Test 7: db.getmoddate
  # ========================================================================
  - name: "db.getmoddate - get item modification date"
    description: "Get modification date for an item (returns date value)"
    script: |
      local(tmpDir = "{FRONTIER_TEST_TMP_DIR}");
      local(dbPath = tmpDir + "/" + "test_moddate.root");
      db.new(dbPath);
      db.open(dbPath, false);
      db.setvalue(dbPath, "testString", "data");
      local(modDate = db.getmoddate(dbPath, "testString"));
      // Just verify it returns a date (non-zero)
      return (modDate > 0)
    expected_success: true
    expected_result: "true"

  # ========================================================================
  # Test 8: db.delete
  # ========================================================================
  - name: "db.delete - delete value and verify"
    description: "Delete a value and verify it no longer exists"
    script: |
      local(tmpDir = "{FRONTIER_TEST_TMP_DIR}");
      local(dbPath = tmpDir + "/" + "test_delete.root");
      db.new(dbPath);
      db.open(dbPath, false);
      db.setvalue(dbPath, "testString", "to be deleted");
      db.delete(dbPath, "testString");
      local(exists = db.defined(dbPath, "testString"));
      return exists
    expected_success: true
    expected_result: "false"

  # ========================================================================
  # Test 9: db.save + db.close + reopen - Persistence test
  # ========================================================================
  - name: "db.save - save and persist data"
    description: "Write data, save, close, reopen, and verify persistence"
    script: |
      local(tmpDir = "{FRONTIER_TEST_TMP_DIR}");
      local(dbPath = tmpDir + "/" + "test_persist.root");
      // Create and populate database
      db.new(dbPath);
      db.open(dbPath, false);
      db.setvalue(dbPath, "persistTest", "This should persist");
      db.setvalue(dbPath, "numberTest", 12345);
      db.newtable(dbPath, "tableTest");
      db.setvalue(dbPath, "tableTest.item1", "data1");
      db.setvalue(dbPath, "tableTest.item2", "data2");
      // Save changes
      db.save(dbPath);
      // Close database
      db.close(dbPath);
      // Reopen and verify
      db.open(dbPath, false);
      local(val1 = db.getvalue(dbPath, "persistTest"));
      local(val2 = db.getvalue(dbPath, "numberTest"));
      local(count = db.countitems(dbPath, "tableTest"));
      db.close(dbPath);
      // Verify all data persisted
      return (val1 == "This should persist" and val2 == 12345 and count == 2)
    expected_success: true
    expected_result: "true"

  # ========================================================================
  # Test 10: db.close
  # ========================================================================
  - name: "db.close - close database"
    description: "Open and close a database"
    script: |
      local(tmpDir = "{FRONTIER_TEST_TMP_DIR}");
      local(dbPath = tmpDir + "/" + "test_close.root");
      db.new(dbPath);
      db.open(dbPath, false);
      local(ok = db.close(dbPath));
      return ok
    expected_success: true
    expected_result: "true"

  # ========================================================================
  # Test 11: v7 database format
  # ========================================================================
  - name: "db.new - create and test v7 database"
    description: "Create v7 database, write/read/save/reopen"
    script: |
      local(tmpDir = "{FRONTIER_TEST_TMP_DIR}");
      local(dbPath = tmpDir + "/" + "test_v7.root7");
      db.new(dbPath);
      db.open(dbPath, false);
      db.setvalue(dbPath, "v7test", "V7 works!");
      local(val = db.getvalue(dbPath, "v7test"));
      db.save(dbPath);
      db.close(dbPath);
      // Reopen and verify
      db.open(dbPath, false);
      local(val2 = db.getvalue(dbPath, "v7test"));
      db.close(dbPath);
      return (val == "V7 works!" and val2 == "V7 works!")
    expected_success: true
    expected_result: "true"

  # ========================================================================
  # Test 12: v6 database (read-only)
  # ========================================================================
  - name: "db.open - open existing v6 database readonly"
    description: "Open test v6 database in read-only mode"
    script: |
      local(ok = db.open("tests/fixtures/v6/test.root", true));
      return ok
    expected_success: true
    expected_result: "true"

  - name: "db.defined - check root in v6 database"
    description: "Verify root exists in v6 database"
    script: |
      db.open("tests/fixtures/v6/test.root", true);
      local(exists = db.defined("tests/fixtures/v6/test.root", "root"));
      db.close("tests/fixtures/v6/test.root");
      return exists
    expected_success: true
    expected_result: "true"

  - name: "db.istable - verify root is table in v6 database"
    description: "Verify root is a table in v6 database"
    script: |
      db.open("tests/fixtures/v6/test.root", true);
      local(isTable = db.istable("tests/fixtures/v6/test.root", "root"));
      db.close("tests/fixtures/v6/test.root");
      return isTable
    expected_success: true
    expected_result: "true"
