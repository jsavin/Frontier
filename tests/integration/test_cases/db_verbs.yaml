# Integration tests for db verb operations
# Tests ODB Engine API verbs for database operations
#
# THREAD-SAFETY NOTE (Step 0 - Legacy Parity):
# These tests validate Step 0 behavior matching legacy Frontier semantics.
# db.* verbs assume single-threaded script execution and are NOT safe for
# concurrent access to the same external database. Thread-local outline context
# (ADR-006) provides per-thread isolation, but db.* operations themselves are
# not atomic or synchronized for multi-user access.
#
# See planning/phase3/EXTERNAL_ATOMICITY_AND_COLLABORATION_ROADMAP.md for
# the multi-user collaboration roadmap (Step 1-3).
#
# All 13 db.* verbs (implemented via ODB Engine in odbengine.c):
#   - db.new() - Create new ODB file
#   - db.open() - Open existing ODB file
#   - db.save() - Save ODB changes
#   - db.close() - Close ODB file
#   - db.defined() - Check if address exists
#   - db.getvalue() - Get value at address
#   - db.setvalue() - Set value at address
#   - db.delete() - Delete value at address
#   - db.newtable() - Create new table
#   - db.istable() - Check if address is a table
#   - db.countitems() - Count items in table
#   - db.getnthitem() - Get Nth item name
#   - db.getmoddate() - Get modification date
#
# Test Strategy:
# 1. Create new database
# 2. Test write operations (setvalue, newtable)
# 3. Test read operations (getvalue, defined, istable)
# 4. Test enumeration (countitems, getnthitem)
# 5. Test delete operations
# 6. Test save/close/reopen cycle
# 7. Test with existing v6 database (if available)

tests:
  # ========================================================================
  # Test 1: db.new - Create new database
  # ========================================================================
  - name: "db.new - create new database file"
    description: "Create a new ODB database file"
    script: |
      local(tmpDir = "{FRONTIER_TEST_TMP_DIR}");
      local(dbPath = tmpDir + "/" + "test_db_new.root");
      local(ok = db.new(dbPath));
      return ok
    expected_success: true
    expected_result: "true"

