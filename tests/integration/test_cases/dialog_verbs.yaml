# Dialog Verb Integration Tests
#
# Tests for dialog verbs in batch (non-interactive) mode.
#
# Interactive dialog tests (repl_mode) are skipped because piped stdin
# cannot reliably deliver both REPL commands and dialog responses —
# the REPL and dialog verbs both read from the same stdin stream.
# Interactive dialog behavior requires a real TTY or PTY test harness.
#
# Phase 1 (merged): --batch flag, TTY detection, isInteractiveMode()
# Phase 2: Interactive stdio prompts (requires PTY harness for testing)
#
# Reference: planning/phase3/HEADLESS_INTERACTIVE_MODE.md

tests:
  # lang.msg() - Output Verb (Already Works)
  - name: "lang.msg - basic output to stdout"
    description: "lang.msg() should output text to stdout"
    script: |
      lang.msg("Hello from Phase 2");
      return true
    expected_success: true

  - name: "lang.msg - multiple messages"
    description: "Multiple lang.msg() calls should all output"
    script: |
      lang.msg("Line 1");
      lang.msg("Line 2");
      lang.msg("Line 3");
      return true
    expected_success: true

  # ===== Interactive Dialog Tests (skipped — require PTY harness) =====

  # dialog.ask(prompt, @adr) - Text input, stores string in @adr, returns boolean
  - name: "dialog.ask - accept default with Enter"
    description: "Pressing Enter should keep default value in @adr"
    skip: true
    skip_reason: "Interactive dialog tests require PTY harness — piped stdin cannot deliver both REPL commands and dialog responses"
    repl_mode: true
    stdin_input: "local(r = \"default\"); dialog.ask(\"Enter name\", @r); return r\n\n/exit\n"
    expected_output_contains:
      - "default"
    expected_success: true

  - name: "dialog.ask - type new value"
    description: "Typing text should store new value in @adr"
    skip: true
    skip_reason: "Interactive dialog tests require PTY harness"
    repl_mode: true
    stdin_input: "local(r = \"old\"); dialog.ask(\"Enter name\", @r); return r\nhello\n/exit\n"
    expected_output_contains:
      - "hello"
    expected_success: true

  - name: "dialog.ask - empty default, enter text"
    description: "With no default, typed text should be stored in @adr"
    skip: true
    skip_reason: "Interactive dialog tests require PTY harness"
    repl_mode: true
    stdin_input: "local(r); dialog.ask(\"Enter text\", @r); return r\nworld\n/exit\n"
    expected_output_contains:
      - "world"
    expected_success: true

  - name: "dialog.ask - returns true on OK"
    description: "dialog.ask returns true when user confirms input"
    skip: true
    skip_reason: "Interactive dialog tests require PTY harness"
    repl_mode: true
    stdin_input: "local(r); dialog.ask(\"Enter\", @r)\ntest\n/exit\n"
    expected_output_contains:
      - "true"
    expected_success: true

