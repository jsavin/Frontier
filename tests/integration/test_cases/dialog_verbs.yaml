# Dialog Verb Integration Tests
#
# Tests for dialog verbs in both interactive (PTY) and batch modes.
#
# Interactive dialog tests use `interactive_steps` with pexpect/PTY support
# to synchronize expect/send pairs with dialog prompts.
#
# Phase 1 (merged): --batch flag, TTY detection, isInteractiveMode()
# Phase 2: Interactive stdio prompts via PTY harness
#
# Reference: planning/phase3/HEADLESS_INTERACTIVE_MODE.md

tests:
  # lang.msg() - Output Verb (Already Works)
  - name: "lang.msg - basic output to stdout"
    description: "lang.msg() should output text to stdout"
    script: |
      lang.msg("Hello from Phase 2");
      return true
    expected_success: true

  - name: "lang.msg - multiple messages"
    description: "Multiple lang.msg() calls should all output"
    script: |
      lang.msg("Line 1");
      lang.msg("Line 2");
      lang.msg("Line 3");
      return true
    expected_success: true

  # ===== Interactive Dialog Tests (PTY-based expect/send) =====

  # dialog.ask(prompt, @adr) - Text input, stores string in @adr, returns boolean
  - name: "dialog.ask - accept default with Enter"
    description: "Pressing Enter should keep default value in @adr"
    interactive_steps:
      - expect: "\\[root\\]>"
        send: "local(r = \"default\"); dialog.ask(\"Enter name\", @r); return r"
      - expect: "Enter name"
        send: ""
      - expect: "\\[root\\]>"
        send: "/exit"
    expected_output_contains:
      - "default"
    expected_success: true

  - name: "dialog.ask - type new value"
    description: "Typing text should store new value in @adr"
    interactive_steps:
      - expect: "\\[root\\]>"
        send: "local(r = \"old\"); dialog.ask(\"Enter name\", @r); return r"
      - expect: "Enter name"
        send: "hello"
      - expect: "\\[root\\]>"
        send: "/exit"
    expected_output_contains:
      - "hello"
    expected_success: true

  - name: "dialog.ask - empty default, enter text"
    description: "With no default, typed text should be stored in @adr"
    interactive_steps:
      - expect: "\\[root\\]>"
        send: "local(r); dialog.ask(\"Enter text\", @r); return r"
      - expect: "Enter text"
        send: "world"
      - expect: "\\[root\\]>"
        send: "/exit"
    expected_output_contains:
      - "world"
    expected_success: true

  - name: "dialog.ask - returns true on OK"
    description: "dialog.ask returns true when user confirms input"
    interactive_steps:
      - expect: "\\[root\\]>"
        send: "local(r); dialog.ask(\"Enter\", @r)"
      - expect: "Enter"
        send: "test"
      - expect: "\\[root\\]>"
        send: "/exit"
    expected_output_contains:
      - "true"
    expected_success: true

  # dialog.getInt(prompt, @adr) - Integer input, stores int in @adr, returns boolean
  - name: "dialog.getInt - accept default with Enter"
    description: "Pressing Enter should keep default value in @adr"
    interactive_steps:
      - expect: "\\[root\\]>"
        send: "local(r = 10); dialog.getInt(\"How many iterations?\", @r); return r"
      - expect: "How many iterations"
        send: ""
      - expect: "\\[root\\]>"
        send: "/exit"
    expected_output_contains:
      - "10"
    expected_success: true

  - name: "dialog.getInt - override default with typed value"
    description: "Typing number should store new value in @adr"
    interactive_steps:
      - expect: "\\[root\\]>"
        send: "local(r = 10); dialog.getInt(\"How many iterations?\", @r); return r"
      - expect: "How many iterations"
        send: "42"
      - expect: "\\[root\\]>"
        send: "/exit"
    expected_output_contains:
      - "42"
    expected_success: true

  - name: "dialog.getInt - no default specified"
    description: "Without default, should prompt for required input"
    interactive_steps:
      - expect: "\\[root\\]>"
        send: "local(r); dialog.getInt(\"Enter count\", @r); return r"
      - expect: "Enter count"
        send: "5"
      - expect: "\\[root\\]>"
        send: "/exit"
    expected_output_contains:
      - "5"
    expected_success: true

  - name: "dialog.getInt - invalid input re-prompts"
    description: "Non-numeric input should re-prompt"
    interactive_steps:
      - expect: "\\[root\\]>"
        send: "local(r = 10); dialog.getInt(\"Enter number\", @r); return r"
      - expect: "Enter number"
        send: "abc"
      - expect: "Enter number"
        send: "20"
      - expect: "\\[root\\]>"
        send: "/exit"
    expected_output_contains:
      - "20"
    expected_success: true

  - name: "dialog.getInt - negative numbers"
    description: "Should accept negative integers"
    interactive_steps:
      - expect: "\\[root\\]>"
        send: "local(r = 0); dialog.getInt(\"Enter value\", @r); return r"
      - expect: "Enter value"
        send: "-42"
      - expect: "\\[root\\]>"
        send: "/exit"
    expected_output_contains:
      - "-42"
    expected_success: true

  - name: "dialog.getInt - very large number"
    description: "Should handle large integers (2^31-1)"
    interactive_steps:
      - expect: "\\[root\\]>"
        send: "local(r); dialog.getInt(\"Enter large number\", @r); return r"
      - expect: "Enter large number"
        send: "2147483647"
      - expect: "\\[root\\]>"
        send: "/exit"
    expected_output_contains:
      - "2147483647"
    expected_success: true

  # dialog.getPassword(prompt, @adr) - Password input, stores in @adr, returns boolean
  - name: "dialog.getPassword - basic password input"
    description: "Should accept password and store in @adr"
    interactive_steps:
      - expect: "\\[root\\]>"
        send: "local(r); dialog.getPassword(\"Enter encryption key\", @r); return r"
      - expect: "Enter encryption key"
        send: "secret123"
      - expect: "\\[root\\]>"
        send: "/exit"
    expected_output_contains:
      - "secret123"
    expected_success: true

  - name: "dialog.getPassword - empty password"
    description: "Should allow empty password"
    interactive_steps:
      - expect: "\\[root\\]>"
        send: "local(r); dialog.getPassword(\"Enter password\", @r); return r"
      - expect: "Enter password"
        send: ""
      - expect: "\\[root\\]>"
        send: "/exit"
    expected_output_contains:
      - "\"\""
    expected_success: true

  - name: "dialog.getPassword - password with spaces"
    description: "Should accept spaces in password"
    interactive_steps:
      - expect: "\\[root\\]>"
        send: "local(r); dialog.getPassword(\"Enter passphrase\", @r); return r"
      - expect: "Enter passphrase"
        send: "my secret pass"
      - expect: "\\[root\\]>"
        send: "/exit"
    expected_output_contains:
      - "my secret pass"
    expected_success: true

  - name: "dialog.getPassword - password with special chars"
    description: "Should accept special characters in password"
    interactive_steps:
      - expect: "\\[root\\]>"
        send: "local(r); dialog.getPassword(\"Enter password\", @r); return r"
      - expect: "Enter password"
        send: "P@ssw0rd!#$%"
      - expect: "\\[root\\]>"
        send: "/exit"
    expected_output_contains:
      - "P@ssw0rd!#$%"
    expected_success: true

  - name: "dialog.getPassword - very long password (256 chars)"
    description: "Should handle long passwords"
    interactive_steps:
      - expect: "\\[root\\]>"
        send: "local(r); dialog.getPassword(\"Enter master key\", @r); return r"
      - expect: "Enter master key"
        send: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      - expect: "\\[root\\]>"
        send: "/exit"
    expected_output_contains:
      - "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
    expected_success: true

  # dialog.alert(message) - Display message, wait for Enter, return true
  - name: "dialog.alert - displays message and waits for Enter"
    description: "Should display message with beep and wait for Enter key"
    interactive_steps:
      - expect: "\\[root\\]>"
        send: "dialog.alert(\"Test alert message\")"
      - expect: "Test alert message"
        send: ""
      - expect: "\\[root\\]>"
        send: "/exit"
    expected_output_contains:
      - "true"
    expected_success: true

  - name: "dialog.alert - returns true when Enter pressed"
    description: "Should always return true"
    interactive_steps:
      - expect: "\\[root\\]>"
        send: "dialog.alert(\"Important notification\")"
      - expect: "Important notification"
        send: ""
      - expect: "\\[root\\]>"
        send: "/exit"
    expected_output_contains:
      - "true"
    expected_success: true

  # dialog.notify(message) - Display message without beep, wait for Enter, return true
  - name: "dialog.notify - displays message and waits for Enter"
    description: "Should display message without beep and wait for Enter"
    interactive_steps:
      - expect: "\\[root\\]>"
        send: "dialog.notify(\"Test notification\")"
      - expect: "Test notification"
        send: ""
      - expect: "\\[root\\]>"
        send: "/exit"
    expected_output_contains:
      - "true"
    expected_success: true

  - name: "dialog.notify - returns true when Enter pressed"
    description: "Should always return true"
    interactive_steps:
      - expect: "\\[root\\]>"
        send: "dialog.notify(\"Info message\")"
      - expect: "Info message"
        send: ""
      - expect: "\\[root\\]>"
        send: "/exit"
    expected_output_contains:
      - "true"
    expected_success: true

  # dialog.twoway(msg, btn1, btn2) - Two-button choice, returns boolean
  - name: "dialog.twoway - select first button with '1' key"
    description: "Should return true when first button selected"
    interactive_steps:
      - expect: "\\[root\\]>"
        send: "dialog.twoway(\"Choose option\", \"First\", \"Second\")"
      - expect: "Choose option"
        send: "1"
      - expect: "\\[root\\]>"
        send: "/exit"
    expected_output_contains:
      - "true"
    expected_success: true

  - name: "dialog.twoway - select second button with '2' key"
    description: "Should return false when second button selected"
    interactive_steps:
      - expect: "\\[root\\]>"
        send: "dialog.twoway(\"Choose option\", \"First\", \"Second\")"
      - expect: "Choose option"
        send: "2"
      - expect: "\\[root\\]>"
        send: "/exit"
    expected_output_contains:
      - "false"
    expected_success: true

  - name: "dialog.twoway - select first button with Enter (default)"
    description: "Should default to first button (true) when Enter pressed"
    interactive_steps:
      - expect: "\\[root\\]>"
        send: "dialog.twoway(\"Proceed?\", \"Yes\", \"No\")"
      - expect: "Proceed"
        send: ""
      - expect: "\\[root\\]>"
        send: "/exit"
    expected_output_contains:
      - "true"
    expected_success: true

  - name: "dialog.twoway - custom button labels"
    description: "Should work with custom button text"
    interactive_steps:
      - expect: "\\[root\\]>"
        send: "dialog.twoway(\"Save changes?\", \"Save\", \"Discard\")"
      - expect: "Save changes"
        send: "1"
      - expect: "\\[root\\]>"
        send: "/exit"
    expected_output_contains:
      - "true"
    expected_success: true

  # dialog.threeway(msg, btn1, btn2, btn3) - Three-button choice, returns integer (1, 2, or 3)
  - name: "dialog.threeway - select first button (returns 1)"
    description: "Should return 1 when first button selected"
    interactive_steps:
      - expect: "\\[root\\]>"
        send: "dialog.threeway(\"Choose\", \"One\", \"Two\", \"Three\")"
      - expect: "Choose"
        send: "1"
      - expect: "\\[root\\]>"
        send: "/exit"
    expected_output_contains:
      - "1"
    expected_success: true

  - name: "dialog.threeway - select second button (returns 2)"
    description: "Should return 2 when second button selected"
    interactive_steps:
      - expect: "\\[root\\]>"
        send: "dialog.threeway(\"Choose\", \"One\", \"Two\", \"Three\")"
      - expect: "Choose"
        send: "2"
      - expect: "\\[root\\]>"
        send: "/exit"
    expected_output_contains:
      - "2"
    expected_success: true

  - name: "dialog.threeway - select third button (returns 3)"
    description: "Should return 3 when third button selected"
    interactive_steps:
      - expect: "\\[root\\]>"
        send: "dialog.threeway(\"Choose\", \"One\", \"Two\", \"Three\")"
      - expect: "Choose"
        send: "3"
      - expect: "\\[root\\]>"
        send: "/exit"
    expected_output_contains:
      - "3"
    expected_success: true

  - name: "dialog.threeway - default to first button with Enter"
    description: "Should return 1 (first button) when Enter pressed"
    interactive_steps:
      - expect: "\\[root\\]>"
        send: "dialog.threeway(\"Pick one\", \"First\", \"Second\", \"Third\")"
      - expect: "Pick one"
        send: ""
      - expect: "\\[root\\]>"
        send: "/exit"
    expected_output_contains:
      - "1"
    expected_success: true

  - name: "dialog.threeway - custom button labels"
    description: "Should work with custom button text, returns integer 2"
    interactive_steps:
      - expect: "\\[root\\]>"
        send: "dialog.threeway(\"Action?\", \"Save\", \"Don't Save\", \"Cancel\")"
      - expect: "Action"
        send: "2"
      - expect: "\\[root\\]>"
        send: "/exit"
    expected_output_contains:
      - "2"
    expected_success: true

  # ===== Batch Mode Tests (Phase 1 behavior - should error) =====

  - name: "dialog.ask - error in batch mode"
    description: "Should return error when --batch flag set"
    script: |
      local(r); dialog.ask("Continue?", @r)
    batch_mode: true
    expected_success: false
    expected_error: "not implemented"

  - name: "dialog.getInt - error in batch mode"
    description: "Should return error when --batch flag set"
    script: |
      local(r = 10); dialog.getInt("How many?", @r)
    batch_mode: true
    expected_success: false
    expected_error: "not implemented"

  - name: "dialog.getPassword - error in batch mode"
    description: "Should return error when --batch flag set"
    script: |
      local(r); dialog.getPassword("Enter password", @r)
    batch_mode: true
    expected_success: false
    expected_error: "not implemented"

  # CI Environment Auto-Detection (Phase 1 behavior)
  - name: "dialog.ask - error in CI environment"
    description: "Should auto-detect batch mode when CI=true"
    script: |
      local(r); dialog.ask("Proceed?", @r)
    environment:
      CI: "true"
    expected_success: false
    expected_error: "not implemented"

  - name: "dialog.alert - error in batch mode"
    description: "Should return error when not in interactive mode"
    script: |
      dialog.alert("Test")
    batch_mode: true
    expected_success: false
    expected_error: "Can't use dialog verbs in batch mode"

  - name: "dialog.notify - error in batch mode"
    description: "Should return error in batch mode"
    script: |
      dialog.notify("Test")
    batch_mode: true
    expected_success: false
    expected_error: "Can't use dialog verbs in batch mode"

  - name: "dialog.twoway - error in batch mode"
    description: "Should return error in batch mode"
    script: |
      dialog.twoway("Test", "A", "B")
    batch_mode: true
    expected_success: false
    expected_error: "Can't use dialog verbs in batch mode"

  - name: "dialog.threeway - error in batch mode"
    description: "Should return error in batch mode"
    script: |
      dialog.threeway("Test", "A", "B", "C")
    batch_mode: true
    expected_success: false
    expected_error: "Can't use dialog verbs in batch mode"

  # ===== Platform-specific and Ghost Cruft Verbs =====

  - name: "dialog.run - platform-specific error"
    description: "Resource-based verbs should error in headless mode"
    script: |
      dialog.run()
    expected_success: false
    expected_error: "requires GUI resources"

  - name: "dialog.getValue - platform-specific error"
    description: "Should error outside dialog.run callback"
    script: |
      dialog.getValue()
    expected_success: false
    expected_error: "only works in GUI dialog callbacks"

  - name: "dialog.runcard - ghost cruft error"
    description: "Card-based verbs were never implemented"
    script: |
      dialog.runcard()
    expected_success: false
    expected_error: "was never implemented"
