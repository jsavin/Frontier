  # ===== Batch Mode Tests (Phase 1 behavior - should error) =====

  - name: "dialog.ask - error in batch mode"
    description: "Should return error when --batch flag set"
    script: |
      local(r); dialog.ask("Continue?", @r)
    batch_mode: true
    expected_success: false
    expected_error: "not implemented"

  - name: "dialog.getInt - error in batch mode"
    description: "Should return error when --batch flag set"
    script: |
      local(r = 10); dialog.getInt("How many?", @r)
    batch_mode: true
    expected_success: false
    expected_error: "not implemented"

  - name: "dialog.getPassword - error in batch mode"
    description: "Should return error when --batch flag set"
    script: |
      local(r); dialog.getPassword("Enter password", @r)
    batch_mode: true
    expected_success: false
    expected_error: "not implemented"

  # CI Environment Auto-Detection (Phase 1 behavior)
  - name: "dialog.ask - error in CI environment"
    description: "Should auto-detect batch mode when CI=true"
    script: |
      local(r); dialog.ask("Proceed?", @r)
    environment:
      CI: "true"
    expected_success: false
    expected_error: "not implemented"

  - name: "dialog.alert - error in batch mode"
    description: "Should return error when not in interactive mode"
    script: |
      dialog.alert("Test")
    batch_mode: true
    expected_success: false
    expected_error: "Can't use dialog verbs in batch mode"

  - name: "dialog.notify - error in batch mode"
    description: "Should return error in batch mode"
    script: |
      dialog.notify("Test")
    batch_mode: true
    expected_success: false
    expected_error: "Can't use dialog verbs in batch mode"

  - name: "dialog.twoway - error in batch mode"
    description: "Should return error in batch mode"
    script: |
      dialog.twoway("Test", "A", "B")
    batch_mode: true
    expected_success: false
    expected_error: "Can't use dialog verbs in batch mode"

  - name: "dialog.threeway - error in batch mode"
    description: "Should return error in batch mode"
    script: |
      dialog.threeway("Test", "A", "B", "C")
    batch_mode: true
    expected_success: false
    expected_error: "Can't use dialog verbs in batch mode"

  # ===== Platform-specific and Ghost Cruft Verbs =====

  - name: "dialog.run - platform-specific error"
    description: "Resource-based verbs should error in headless mode"
    script: |
      dialog.run()
    expected_success: false
    expected_error: "requires GUI resources"

  - name: "dialog.getValue - platform-specific error"
    description: "Should error outside dialog.run callback"
    script: |
      dialog.getValue()
    expected_success: false
    expected_error: "only works in GUI dialog callbacks"

  - name: "dialog.runcard - ghost cruft error"
    description: "Card-based verbs were never implemented"
    script: |
      dialog.runcard()
    expected_success: false
    expected_error: "was never implemented"
