# Integration tests for Phase 2 HTML verbs - Page Framework
# Tests the 10 page framework verbs for page table management and directive processing
#
# Phase 2 Page Framework verbs covered (10 verbs):
#   - html.buildpagetable - Build page metadata table
#   - html.getpref - Get page/site preference value
#   - html.rundirective - Execute a single directive
#   - html.rundirectives - Execute all directives in text
#   - html.runoutlinedirectives - Execute directives in outline
#   - html.cleanforexport - Remove Mac-specific characters
#   - html.glossarypatcher - Glossary reference expansion
#   - html.traversalskip - Check if object should be skipped
#   - html.getpagetableaddress - Get current page table address
#
# Reference: planning/phase3/html_verbs_implementation_plan.md
# Architecture: docs/WEBSITE_FRAMEWORK_ARCHITECTURE.md
# C Implementation: Common/source/langhtml.c

tests:
  # =============================================================================
  # html.getpref - Get page/site preference value
  # =============================================================================

  - name: "html.getpref - default file extension"
    description: "Get default file extension preference"
    requires_system_root: true
    script: |
      local(ext = html.getpref("fileExtension"))
      return ext == ".html"
    expected_result: "true"

  - name: "html.getpref - default filename"
    description: "Get default filename preference"
    requires_system_root: true
    script: |
      local(name = html.getpref("defaultFileName"))
      return name == "index"
    expected_result: "true"

  - name: "html.getpref - charset preference"
    description: "Get character encoding preference"
    requires_system_root: true
    script: |
      local(charset = html.getpref("charset"))
      return sizeOf(charset) > 0
    expected_result: "true"

  - name: "html.getpref - boolean preference (activeURLs)"
    description: "Get boolean preference for URL auto-linking"
    requires_system_root: true
    script: |
      local(active = html.getpref("activeURLs"))
      return typeof(active) == booleanType
    expected_result: "true"

  - name: "html.getpref - maxFileNameLength"
    description: "Get maximum filename length preference"
    requires_system_root: true
    script: |
      local(maxLen = html.getpref("maxFileNameLength"))
      return (typeof(maxLen) == longType) and (maxLen > 0)
    expected_result: "true"

  - name: "html.getpref - useGlossPatcher preference"
    description: "Get glossary patcher preference (needed for Phase 2)"
    requires_system_root: true
    script: |
      local(usePatcher = html.getpref("useGlossPatcher"))
      return typeof(usePatcher) == booleanType
    expected_result: "true"

  - name: "html.getpref - directivesOnlyAtBeginning"
    description: "Get directive processing preference"
    requires_system_root: true
    script: |
      local(directivesAtStart = html.getpref("directivesOnlyAtBeginning"))
      return typeof(directivesAtStart) == booleanType
    expected_result: "true"

  - name: "html.getpref - with page table parameter"
    description: "Get preference with explicit page table"
    requires_system_root: true
    script: |
      local(pageTable)
      lang.new(tableType, @pageTable)
      local(ext = html.getpref("fileExtension", @pageTable))
      return ext == ".html"
    expected_result: "true"

  - name: "html.getpref - page table override"
    description: "Page-specific preference overrides global"
    requires_system_root: true
    script: |
      local(pageTable)
      lang.new(tableType, @pageTable)
      lang.new(tableType, @pageTable.prefs)
      pageTable.prefs.fileExtension = ".php"

      local(ext = html.getpref("fileExtension", @pageTable))
      return ext == ".php"
    expected_result: "true"

  - name: "html.getpref - undefined preference returns default"
    description: "Undefined preferences should return sensible defaults"
    requires_system_root: true
    script: |
      local(result = html.getpref("nonExistentPref"))
      return true
    expected_result: "true"

