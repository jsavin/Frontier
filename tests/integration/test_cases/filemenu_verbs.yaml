# Integration tests for fileMenu verb operations in headless mode
#
# fileMenu verbs provide File menu functionality for headless/CLI usage:
#   - fileMenu.open(path, hidden=false) - Open guest database, mount into system.compiler.files
#   - fileMenu.close() - Close current target guest database
#   - fileMenu.closeall() - Close all guest databases
#   - fileMenu.save([path]) - Save system root or guest database (implemented in prior PR)
#
# No-op stubs (return true in headless mode):
#   - fileMenu.revert, print, quit
#
# Guest Database Concepts:
#   - A "guest database" is any ODB file opened via fileMenu.open or db.open
#     (as opposed to the system root database loaded at startup)
#   - Guest databases are tracked in the hodblist linked list
#   - fileMenu.open also mounts the root table into system.compiler.files
#     for bracket-syntax access (e.g., ["/path/to/db.root"].table.value)
#   - fileMenu.close operates on the current target (set via target.set)
#
# Test Strategy:
#   1. Verify no-op verbs (revert, print, quit) return true
#   2. Test no-op/empty cases (close/closeall with nothing open)
#   3. Test error cases (open nonexistent file)
#   4. Test open/close lifecycle with real database files
#   5. Test closeall cleans up multiple databases
#   6. Test fileMenu.save on system root and guest databases

tests:
  # ========================================================================
  # No-Op Verbs (headless mode)
  # ========================================================================

  - name: "fileMenu.revert - no-op in headless mode"
    description: "fileMenu.revert returns true (no GUI document state to revert)"
    script: |
      return fileMenu.revert()
    expected_success: true
    expected_result: "true"

  - name: "fileMenu.print - no-op in headless mode"
    description: "fileMenu.print returns true (no printing in headless mode)"
    script: |
      return fileMenu.print()
    expected_success: true
    expected_result: "true"

  - name: "fileMenu.quit - no-op in headless mode"
    description: "fileMenu.quit returns true (CLI shutdown handled by process exit)"
    script: |
      return fileMenu.quit()
    expected_success: true
    expected_result: "true"

  # ========================================================================
  # fileMenu.new
  # ========================================================================

  - name: "fileMenu.new - create new database"
    description: "fileMenu.new creates a new empty ODB database and opens it"
    script: |
      local(tmpDir = "{FRONTIER_TEST_TMP_DIR}");
      local(dbPath = tmpDir + "/" + "filemenu_new_basic.root");
      local(result = fileMenu.new(dbPath));
      fileMenu.closeall();
      return result
    expected_success: true
    expected_result: "true"

  - name: "fileMenu.new - file already exists error"
    description: "fileMenu.new returns error if file already exists"
    skip: true
    skip_reason: "fileMenu verb errors are uncatchable (bypass try/else) — see planning/FIX_TESTS_2026_02_16.md B2"
    script: |
      local(tmpDir = "{FRONTIER_TEST_TMP_DIR}");
      local(dbPath = tmpDir + "/" + "filemenu_new_exists.root");
      fileMenu.new(dbPath);
      fileMenu.closeall();
      try {
        fileMenu.new(dbPath);
        return "should_have_failed"
      } else {
        return "error_caught"
      }
    expected_success: true
    expected_result: "error_caught"

  - name: "fileMenu.new - with hidden parameter"
    description: "fileMenu.new accepts optional hidden parameter (ignored in headless)"
    script: |
      local(tmpDir = "{FRONTIER_TEST_TMP_DIR}");
      local(dbPath = tmpDir + "/" + "filemenu_new_hidden.root");
      local(result = fileMenu.new(dbPath, true));
      fileMenu.closeall();
      return result
    expected_success: true
    expected_result: "true"

  - name: "fileMenu.new - with named hidden parameter"
    description: "fileMenu.new accepts named hidden:true parameter syntax"
    script: |
      local(tmpDir = "{FRONTIER_TEST_TMP_DIR}");
      local(dbPath = tmpDir + "/" + "filemenu_new_named_hidden.root");
      local(result = fileMenu.new(dbPath, hidden:true));
      fileMenu.closeall();
      return result
    expected_success: true
    expected_result: "true"

  - name: "fileMenu.new - database is usable after creation"
    description: "A database created with fileMenu.new can be written to and read from"
    script: |
      local(tmpDir = "{FRONTIER_TEST_TMP_DIR}");
      local(dbPath = tmpDir + "/" + "filemenu_new_usable.root");
      fileMenu.new(dbPath);
      db.setvalue(dbPath, "testKey", "testValue");
      local(val = db.getvalue(dbPath, "testKey"));
      fileMenu.closeall();
      return val
    expected_success: true
    expected_result: "testValue"

  - name: "fileMenu.savecopy - error with no params"
    description: "fileMenu.savecopy requires exactly 1 parameter"
    script: |
      try {
        fileMenu.savecopy();
        return "should_have_failed"
      } else {
        return "error_caught"
      }
    expected_success: true
    expected_result: "error_caught"

  # ========================================================================
  # fileMenu.closeall - Empty/No-Op Cases
  # ========================================================================

  - name: "fileMenu.closeall - no databases open"
    description: "closeall with no guest databases open should succeed (no-op)"
    script: |
      return fileMenu.closeall()
    expected_success: true
    expected_result: "true"

  # ========================================================================
  # fileMenu.close - No-Op Cases
  # ========================================================================

  - name: "fileMenu.close - no target set"
    description: "close with no target set should succeed (no-op returning true)"
    script: |
      target.clear();
      return fileMenu.close()
    expected_success: true
    expected_result: "true"

  - name: "fileMenu.close - target is not a guest database"
    description: "close when target points at a non-guest-database table is a no-op"
    script: |
      lang.new(tableType, @system.temp.notADb);
      target.set(@system.temp.notADb);
      local(result = fileMenu.close());
      target.clear();
      return result
    expected_success: true
    expected_result: "true"

  # ========================================================================
  # fileMenu.open - Error Cases
  # ========================================================================

  - name: "fileMenu.open - nonexistent file"
    description: "Opening a file that doesn't exist should fail"
    script: |
      try {
        fileMenu.open("/tmp/nonexistent_database_12345.root7");
        return "should_have_failed"
      } else {
        return "error_caught"
      }
    expected_success: true
    expected_result: "error_caught"

  # ========================================================================
  # fileMenu.open - Open Guest Database
  # ========================================================================

  - name: "fileMenu.open - open a new guest database"
    description: "Create a database with db.new, then open it with fileMenu.open"
    script: |
      local(tmpDir = "{FRONTIER_TEST_TMP_DIR}");
      local(dbPath = tmpDir + "/" + "filemenu_guest.root");
      db.new(dbPath);
      local(result = fileMenu.open(dbPath));
      fileMenu.closeall();
      return result
    expected_success: true
    expected_result: "true"

  - name: "fileMenu.open - open same database twice returns true"
    description: "Opening an already-open guest database should return true (idempotent)"
    script: |
      local(tmpDir = "{FRONTIER_TEST_TMP_DIR}");
      local(dbPath = tmpDir + "/" + "filemenu_double_open.root");
      db.new(dbPath);
      fileMenu.open(dbPath);
      local(result = fileMenu.open(dbPath));
      fileMenu.closeall();
      return result
    expected_success: true
    expected_result: "true"

  - name: "fileMenu.open - with hidden parameter"
    description: "Opening with optional hidden parameter (ignored in headless) should succeed"
    script: |
      local(tmpDir = "{FRONTIER_TEST_TMP_DIR}");
      local(dbPath = tmpDir + "/" + "filemenu_hidden.root");
      db.new(dbPath);
      local(result = fileMenu.open(dbPath, true));
      fileMenu.closeall();
      return result
    expected_success: true
    expected_result: "true"

  - name: "fileMenu.open - with named hidden parameter"
    description: "Opening with named hidden:true parameter syntax should succeed"
    script: |
      local(tmpDir = "{FRONTIER_TEST_TMP_DIR}");
      local(dbPath = tmpDir + "/" + "filemenu_open_named_hidden.root");
      db.new(dbPath);
      local(result = fileMenu.open(dbPath, hidden:true));
      fileMenu.closeall();
      return result
    expected_success: true
    expected_result: "true"

  # ========================================================================
  # fileMenu.close - Close Guest Database
  # ========================================================================

  - name: "fileMenu.close - close targeted guest database"
    description: "Open a guest database, set it as target, then close it"
    script: |
      local(tmpDir = "{FRONTIER_TEST_TMP_DIR}");
      local(dbPath = tmpDir + "/" + "filemenu_close_target.root");
      db.new(dbPath);
      fileMenu.open(dbPath);
      target.set(@[dbPath]);
      local(result = fileMenu.close());
      target.clear();
      return result
    expected_success: true
    expected_result: "true"

  # ========================================================================
  # fileMenu.closeall - Close All Guest Databases
  # ========================================================================

  - name: "fileMenu.closeall - close single open database"
    description: "Open one guest database then close all"
    script: |
      local(tmpDir = "{FRONTIER_TEST_TMP_DIR}");
      local(dbPath = tmpDir + "/" + "filemenu_closeall_single.root");
      db.new(dbPath);
      fileMenu.open(dbPath);
      local(result = fileMenu.closeall());
      return result
    expected_success: true
    expected_result: "true"

  - name: "fileMenu.closeall - close multiple open databases"
    description: "Open two guest databases then close all"
    script: |
      local(tmpDir = "{FRONTIER_TEST_TMP_DIR}");
      local(dbPath1 = tmpDir + "/" + "filemenu_closeall_multi1.root");
      local(dbPath2 = tmpDir + "/" + "filemenu_closeall_multi2.root");
      db.new(dbPath1);
      db.new(dbPath2);
      fileMenu.open(dbPath1);
      fileMenu.open(dbPath2);
      local(result = fileMenu.closeall());
      return result
    expected_success: true
    expected_result: "true"

  - name: "fileMenu.closeall - idempotent (call twice)"
    description: "Calling closeall twice should succeed both times"
    script: |
      local(tmpDir = "{FRONTIER_TEST_TMP_DIR}");
      local(dbPath = tmpDir + "/" + "filemenu_closeall_twice.root");
      db.new(dbPath);
      fileMenu.open(dbPath);
      fileMenu.closeall();
      local(result = fileMenu.closeall());
      return result
    expected_success: true
    expected_result: "true"

  # ========================================================================
  # fileMenu.save - Save System Root
  # ========================================================================

  - name: "fileMenu.save - save system root (no params)"
    description: "Calling fileMenu.save() with no parameters saves the system root database"
    script: |
      return fileMenu.save()
    expected_success: true
    expected_result: "true"

  - name: "fileMenu.save - save system root with guest database open"
    description: >
      Regression test: saving the system root while a guest database is open
      should not corrupt the databasedata global. Previously, recursive packing
      of system table externals would switch databasedata to the guest database,
      causing dbread failures on sibling externals (e.g. menus at addresses
      valid only in the system root).
    script: |
      local(tmpDir = "{FRONTIER_TEST_TMP_DIR}");
      local(dbPath = tmpDir + "/" + "filemenu_save_regression.root");
      db.new(dbPath);
      fileMenu.open(dbPath);
      local(result = fileMenu.save());
      fileMenu.closeall();
      return result
    expected_success: true
    expected_result: "true"

  # ========================================================================
  # fileMenu.save - Save Guest Database
  # ========================================================================

  - name: "fileMenu.save - save guest database by path"
    description: "Open a guest database, write a value, then save it by path"
    script: |
      local(tmpDir = "{FRONTIER_TEST_TMP_DIR}");
      local(dbPath = tmpDir + "/" + "filemenu_save_guest.root");
      db.new(dbPath);
      fileMenu.open(dbPath);
      db.setvalue(dbPath, "testKey", "testValue");
      local(result = fileMenu.save(dbPath));
      fileMenu.closeall();
      return result
    expected_success: true
    expected_result: "true"

  - name: "fileMenu.save - save nonexistent guest database fails"
    description: "Saving a database that isn't open should fail"
    script: |
      try {
        fileMenu.save("/tmp/not_open_database_12345.root7");
        return "should_have_failed"
      } else {
        return "error_caught"
      }
    expected_success: true
    expected_result: "error_caught"

  # ========================================================================
  # Full Lifecycle: Open -> Write -> Save -> Close -> Reopen -> Verify
  # ========================================================================

  - name: "fileMenu lifecycle - open, write, save, closeall, reopen, verify"
    description: "Full lifecycle test: create database, open with fileMenu, write data, save, close all, reopen with db.open, and verify persisted data"
    script: |
      local(tmpDir = "{FRONTIER_TEST_TMP_DIR}");
      local(dbPath = tmpDir + "/" + "filemenu_lifecycle.root");
      db.new(dbPath);
      fileMenu.open(dbPath);
      db.setvalue(dbPath, "lifecycleKey", "lifecycleValue");
      fileMenu.save(dbPath);
      fileMenu.closeall();
      db.open(dbPath, false);
      local(val = db.getvalue(dbPath, "lifecycleKey"));
      db.close(dbPath);
      return val
    expected_success: true
    expected_result: "lifecycleValue"

  # ========================================================================
  # Integration with db.* Verbs
  # ========================================================================

  - name: "fileMenu.open + db.setvalue/getvalue - database interop"
    description: "Guest database opened via fileMenu.open is accessible via db.* verbs"
    script: |
      local(tmpDir = "{FRONTIER_TEST_TMP_DIR}");
      local(dbPath = tmpDir + "/" + "filemenu_db_interop.root");
      db.new(dbPath);
      fileMenu.open(dbPath);
      db.setvalue(dbPath, "interopTest", 42);
      local(val = db.getvalue(dbPath, "interopTest"));
      fileMenu.closeall();
      return val
    expected_success: true
    expected_result: "42"

  - name: "fileMenu.open + db.newtable - create table in guest db"
    description: "Can create tables in guest database opened via fileMenu.open"
    script: |
      local(tmpDir = "{FRONTIER_TEST_TMP_DIR}");
      local(dbPath = tmpDir + "/" + "filemenu_db_table.root");
      db.new(dbPath);
      fileMenu.open(dbPath);
      db.newtable(dbPath, "myTable");
      db.setvalue(dbPath, "myTable.key1", "value1");
      local(count = db.countitems(dbPath, "myTable"));
      fileMenu.closeall();
      return count
    expected_success: true
    expected_result: "1"

  - name: "fileMenu.open + db.defined - check existence in guest db"
    description: "db.defined works on guest database opened via fileMenu.open"
    script: |
      local(tmpDir = "{FRONTIER_TEST_TMP_DIR}");
      local(dbPath = tmpDir + "/" + "filemenu_db_defined.root");
      db.new(dbPath);
      fileMenu.open(dbPath);
      db.setvalue(dbPath, "existsTest", "yes");
      local(exists = db.defined(dbPath, "existsTest"));
      local(notExists = db.defined(dbPath, "doesNotExist"));
      fileMenu.closeall();
      return exists and (not notExists)
    expected_success: true
    expected_result: "true"

  # ========================================================================
  # fileMenu.saveCopy / fileMenu.saveAs
  # ========================================================================

  - name: "fileMenu.saveCopy - save system root to new file"
    description: "saveCopy creates a copy of the system root database"
    script: |
      local(tmpDir = "{FRONTIER_TEST_TMP_DIR}");
      local(destPath = tmpDir + "/" + "savecopy_sysroot.root");
      fileMenu.saveCopy(destPath);
      return file.exists(destPath)
    expected_success: true
    expected_result: "true"

  - name: "fileMenu.saveCopy - original database unchanged after copy"
    description: "After saveCopy, the system root is still fully usable"
    script: |
      local(tmpDir = "{FRONTIER_TEST_TMP_DIR}");
      local(destPath = tmpDir + "/" + "savecopy_unchanged.root");
      fileMenu.saveCopy(destPath);
      return defined(system.compiler)
    expected_success: true
    expected_result: "true"

  - name: "fileMenu.saveCopy - new file is independently openable"
    description: "The copied database can be opened and contains system table"
    script: |
      local(tmpDir = "{FRONTIER_TEST_TMP_DIR}");
      local(destPath = tmpDir + "/" + "savecopy_openable.root");
      fileMenu.saveCopy(destPath);
      fileMenu.open(destPath);
      local(hasSys = db.defined(destPath, "system"));
      fileMenu.closeall();
      return hasSys
    expected_success: true
    expected_result: "true"

  - name: "fileMenu.saveAs - aliases to same behavior as saveCopy"
    description: "saveAs and saveCopy are interchangeable"
    script: |
      local(tmpDir = "{FRONTIER_TEST_TMP_DIR}");
      local(destPath = tmpDir + "/" + "saveas_alias.root");
      fileMenu.saveAs(destPath);
      return file.exists(destPath)
    expected_success: true
    expected_result: "true"

  - name: "fileMenu.saveCopy - save guest database to new file"
    description: "saveCopy can copy a guest database when targeted via target.set"
    script: |
      local(tmpDir = "{FRONTIER_TEST_TMP_DIR}");
      local(srcPath = tmpDir + "/" + "savecopy_guest_src.root");
      local(destPath = tmpDir + "/" + "savecopy_guest_dest.root");
      db.new(srcPath);
      fileMenu.open(srcPath);
      db.setvalue(srcPath, "testData", "hello_savecopy");
      fileMenu.save(srcPath);
      target.set(@[srcPath]);
      fileMenu.saveCopy(destPath);
      fileMenu.closeall();
      fileMenu.open(destPath);
      local(val = db.getvalue(destPath, "testData"));
      fileMenu.closeall();
      return val
    expected_success: true
    expected_result: "hello_savecopy"

  - name: "fileMenu.saveCopy - error with too many params"
    description: "saveCopy with 2+ params returns an error"
    script: |
      try {
        fileMenu.saveCopy("/tmp/a", "/tmp/b");
        return "should_have_failed"
      } else {
        return "error_caught"
      }
    expected_success: true
    expected_result: "error_caught"
