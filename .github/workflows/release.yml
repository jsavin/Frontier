name: Create Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags (v1.0.0, v1.0.0-alpha.1, etc.)

jobs:
  create-release:
    runs-on: macos-latest

    permissions:
      contents: write  # Required for creating releases

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for git describe

      - name: Get version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_clean=${VERSION#v}" >> $GITHUB_OUTPUT

      - name: Setup build environment
        run: |
          # Install cmake for Paige library build
          brew install cmake

      - name: Build release package
        run: |
          ./tools/package_release.sh ${{ steps.version.outputs.version }}

      - name: Verify release artifacts
        run: |
          ls -lh dist/
          # Verify zip contains expected files
          unzip -l dist/frontier-cli-${{ steps.version.outputs.version_clean }}-macos.zip

      - name: Extract changelog for this release
        id: changelog
        run: |
          if [ -f "CHANGELOG.md" ]; then
            # Extract changelog section for this version
            VERSION_CLEAN="${{ steps.version.outputs.version_clean }}"
            CHANGELOG=$(awk "/^## \[?${VERSION_CLEAN}\]?/,/^## \[?[0-9]/" CHANGELOG.md | head -n -1 || echo "")

            if [ -z "$CHANGELOG" ]; then
              CHANGELOG="Release ${{ steps.version.outputs.version }}"
            fi

            # Save to output file (multi-line handling)
            {
              echo 'notes<<EOF'
              echo "$CHANGELOG"
              echo EOF
            } >> $GITHUB_OUTPUT
          else
            echo "notes=Release ${{ steps.version.outputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/frontier-cli-${{ steps.version.outputs.version_clean }}-macos.zip
            dist/frontier-cli-${{ steps.version.outputs.version_clean }}-macos.zip.sha256
            dist/Frontier.root7.gz
            dist/Frontier.root7.gz.sha256
          body: |
            # Frontier CLI ${{ steps.version.outputs.version }}

            ${{ steps.changelog.outputs.notes }}

            ## Installation

            ### Quick Install

            ```bash
            # Download and extract
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/frontier-cli-${{ steps.version.outputs.version_clean }}-macos.zip -o frontier-cli.zip
            unzip frontier-cli.zip
            cd frontier-cli-${{ steps.version.outputs.version_clean }}-macos

            # Run installer
            ./install.sh

            # Verify
            frontier-cli --version
            ```

            ### System Requirements

            - macOS 11.0 (Big Sur) or later
            - Apple Silicon (arm64) or Intel (x86_64) Mac

            ### Files in this release

            - `frontier-cli-${{ steps.version.outputs.version_clean }}-macos.zip` - Complete package with binary, database, and installer
            - `Frontier.root7.gz` - Compressed system root database (optional separate download)
            - `.sha256` files - SHA-256 checksums for verification

            ### Documentation

            - [Installation Guide](https://github.com/${{ github.repository }}/blob/develop/INSTALL.md)
            - [CLI Usage Guide](https://github.com/${{ github.repository }}/blob/develop/docs/CLI_USAGE_GUIDE.md)

            ### Verification

            Verify checksums after download:
            ```bash
            shasum -a 256 -c frontier-cli-${{ steps.version.outputs.version_clean }}-macos.zip.sha256
            ```
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, 'alpha') || contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            dist/frontier-cli-*-macos.zip
            dist/frontier-cli-*-macos.zip.sha256
            dist/Frontier.root7.gz
            dist/Frontier.root7.gz.sha256
          retention-days: 90
