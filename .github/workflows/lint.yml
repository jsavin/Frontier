name: Lint Checks

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'tests/**/*.c'
      - 'tests/**/*.h'
      - 'portable/**/*.c'
      - 'portable/**/*.h'
      - 'tests/integration/test_cases/**/*.yaml'
  push:
    branches:
      - develop
      - main
    paths:
      - 'tests/**/*.c'
      - 'tests/**/*.h'
      - 'portable/**/*.c'
      - 'portable/**/*.h'
      - 'tests/integration/test_cases/**/*.yaml'

jobs:
  check-tmp-usage:
    name: Check for unsafe /tmp usage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run /tmp usage check
        run: |
          chmod +x ./tools/check_tmp_usage.sh
          ./tools/check_tmp_usage.sh

      - name: Report results
        if: failure()
        run: |
          echo "::error::Found unsafe /tmp usage in code. frontier-cli runs in macOS sandbox and cannot access /tmp."
          echo "::error::Use project-relative paths (test_tmp/), {FRONTIER_TEST_TMP_DIR} template, or \$(./tools/get_test_temp_path.sh)"
          echo "::error::See docs/TESTING_GUIDE.md for safe testing patterns"
